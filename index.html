<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Severance Wiki</title>
<meta name="description" content="The Severance wiki: realms, races, classes, weapons, combat, item sets and crafting for the game by Koala Studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
html{font-size:16px}
@media (min-width:1441px){html{font-size:calc(100vw / 90)}}
:root{
  --bg:#121826; --bg2:#182031; --bg3:#1f293d; --line:#2a3550; --line2:#3a4766;
  --tx:#e8ecf3; --tx2:#aeb8ca; --tx3:#7c88a0;
  --acc:#f0b14a; --acc-soft:#f0b14a24;
  --world:#45c4b0; --characters:#b394ff; --combat:#ff7a66; --gear:#f0b14a;
  --mana:#6aa8ff; --stamina:#5fd394; --health:#ff6b6b; --tank:#e6a856; --healer:#efd77a; --hybrid:#c3a3ff;
  --serif:"IM Fell English",Georgia,serif; --sc:"IM Fell English SC",Georgia,serif; --ui:"Atkinson Hyperlegible",system-ui,sans-serif;
  --side:17.25rem; --shadow:0 1.25rem 3.75rem #0009;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f5f9; --bg2:#ffffff; --bg3:#e9edf4; --line:#dbe1ea; --line2:#c3ccd9;
  --tx:#141a26; --tx2:#435069; --tx3:#66728a; --acc:#a6650a; --acc-soft:#a6650a1c;
  --world:#0f8a78; --characters:#6a4bd0; --combat:#c43d2c; --gear:#a6650a;
  --mana:#1f66d1; --stamina:#16834a; --health:#c43535; --tank:#9a5f0e; --healer:#7c6a08; --hybrid:#6a42c0; --shadow:0 1.25rem 3.75rem #1a223340;
}}
:root[data-theme="light"]{
  --bg:#f3f5f9; --bg2:#ffffff; --bg3:#e9edf4; --line:#dbe1ea; --line2:#c3ccd9;
  --tx:#141a26; --tx2:#435069; --tx3:#66728a; --acc:#a6650a; --acc-soft:#a6650a1c;
  --world:#0f8a78; --characters:#6a4bd0; --combat:#c43d2c; --gear:#a6650a;
  --mana:#1f66d1; --stamina:#16834a; --health:#c43535; --tank:#9a5f0e; --healer:#7c6a08; --hybrid:#6a42c0; --shadow:0 1.25rem 3.75rem #1a223340;
}
*{box-sizing:border-box}
html{scroll-padding-top:1.25rem}
body{margin:0;background:var(--bg);color:var(--tx);font:1.0312rem/1.6 var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:0.25rem}
.link,.prose a{color:var(--acc);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--acc) 45%,transparent);text-underline-offset:0.1875rem}
.link:hover,.prose a:hover{text-decoration-color:var(--acc)}
.g-world{--g:var(--world)} .g-characters{--g:var(--characters)} .g-combat{--g:var(--combat)} .g-gear{--g:var(--gear)}

/* ---------- sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.logo{display:block;padding:1.375rem 1.375rem 0.875rem}
.logo b{display:block;font:400 2.125rem/1 var(--sc);letter-spacing:.04em}
.logo span{display:block;font-size:0.8438rem;color:var(--tx3);margin-top:0.25rem}
.sbtn{margin:0.375rem 1rem 0.625rem;display:flex;align-items:center;gap:0.625rem;width:calc(100% - 2rem);background:var(--bg3);border:1px solid var(--line);border-radius:0.625rem;padding:0.625rem 0.75rem;color:var(--tx3);cursor:pointer;text-align:left}
.sbtn:hover{border-color:var(--line2);color:var(--tx2)}
.sbtn kbd{margin-left:auto;font:0.75rem var(--ui);border:1px solid var(--line2);border-radius:0.3125rem;padding:1px 0.375rem;color:var(--tx3)}
.nav{flex:1;overflow:auto;padding:0.25rem 0.625rem 1.5rem}
.nav .grp{margin-top:0.875rem}
.nav .gh{display:flex;align-items:center;gap:0.5rem;padding:0.25rem 0.75rem;font-weight:700;font-size:0.8438rem;color:var(--g)}
.nav .gh::before{content:"";width:0.5rem;height:0.5rem;border-radius:2px;background:var(--g);transform:rotate(45deg)}
.nav .row{display:flex;align-items:center}
.nav a.it{flex:1;display:flex;justify-content:space-between;padding:0.375rem 0.75rem;border-radius:0.5rem;color:var(--tx2);font-size:0.9375rem}
.nav a.it:hover{background:var(--bg3);color:var(--tx)}
.nav a.it.on{background:color-mix(in srgb,var(--g) 16%,transparent);color:var(--tx);font-weight:700}
.nav a.it small{color:var(--tx3);font-weight:400}
.nav .tg{background:none;border:0;color:var(--tx3);cursor:pointer;padding:0.375rem 0.5rem;border-radius:0.375rem;display:flex}
.nav .tg:hover{color:var(--tx);background:var(--bg3)}
.nav .tg svg{transition:transform .2s}
.nav .tg[aria-expanded="true"] svg{transform:rotate(90deg)}
.nav .kids{margin:2px 0 0.375rem 1.125rem;border-left:1px solid var(--line);padding-left:0.375rem;display:none}
.nav .kids.open{display:block}
.nav .kids a.it{font-size:0.875rem;padding:0.25rem 0.625rem}
.side-foot{padding:0.75rem 1.125rem;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:0.8125rem;color:var(--tx3)}
.ib{background:none;border:1px solid var(--line);border-radius:0.5rem;padding:0.375rem;cursor:pointer;color:var(--tx2);display:flex}
.ib:hover{color:var(--tx);border-color:var(--line2)}
.top{display:none}
.scrim{display:none}

/* ---------- banner ---------- */
main{margin-left:var(--side);min-height:100vh}
.banner{position:relative;height:18.75rem;overflow:hidden;background:#0b0e16;isolation:isolate}
.banner .scene{position:absolute;inset:0;width:100%;height:100%}
.banner canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,color-mix(in srgb,var(--bg) 55%,transparent) 72%,var(--bg) 100%);pointer-events:none}
.banner .bt{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 3rem 1.125rem;max-width:77.5rem}
.crumbs{font-size:0.875rem;color:#ffffffc0;margin-bottom:0.375rem;text-shadow:0 1px 0.5rem #000}
.crumbs a:hover{color:#fff;text-decoration:underline}
.crumbs .s{margin:0 0.4375rem;opacity:.6}
.banner h1{font:400 4rem/1 var(--serif);margin:0;color:#fff;text-shadow:0 2px 1.5rem #000c,0 0 2px #000}
:root[data-theme="light"] .banner h1, :root[data-theme="light"] .banner .crumbs{color:var(--tx);text-shadow:0 0 1.25rem var(--bg),0 0 0.375rem var(--bg)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .banner h1, :root:not([data-theme="dark"]) .banner .crumbs{color:var(--tx);text-shadow:0 0 1.25rem var(--bg),0 0 0.375rem var(--bg)} }
.banner .sub{margin:0.5rem 0 0;font:italic 400 1.25rem var(--serif);color:var(--tx2)}
.gtag{display:inline-flex;align-items:center;gap:0.4375rem;font-size:0.8438rem;font-weight:700;color:var(--g);margin-right:0.625rem}
.gtag::before{content:"";width:0.4375rem;height:0.4375rem;border-radius:2px;background:var(--g);transform:rotate(45deg)}

/* svg animation */
.tw{animation:tw 3.5s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.15}}
.fl{animation:fl 1.6s ease-in-out infinite alternate}
@keyframes fl{0%{transform:scaleY(1) skewX(0)}50%{transform:scaleY(1.18) skewX(3deg)}100%{transform:scaleY(.86) skewX(-3deg)}}
.lava{animation:lava 2.6s ease-in-out infinite alternate}
@keyframes lava{from{opacity:.55}to{opacity:1}}
.moth{animation:moth 12s ease-in-out infinite alternate}
@keyframes moth{0%{transform:translate(0,0)}33%{transform:translate(40px,-18px)}66%{transform:translate(-30px,14px)}100%{transform:translate(20px,-8px)}}
.wings{animation:wing .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes wing{to{transform:scaleX(.35)}}
.bat{animation:bat 14s linear infinite}
@keyframes bat{0%{transform:translate(-80px,10px)}50%{transform:translate(120px,-20px)}100%{transform:translate(320px,10px)}}
.sway{animation:sway 4s ease-in-out infinite alternate}
.sway.slow{animation-duration:6s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.spin{animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rays{animation:rays 9s ease-in-out infinite alternate}
@keyframes rays{to{transform:rotate(4deg)}}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-120px)}}
.bub{animation:bub 8s linear infinite}
@keyframes bub{to{transform:translateY(-380px);opacity:0}}
.win{animation:win 5s ease-in-out infinite alternate}
@keyframes win{to{opacity:.55}}
.smoke{animation:drift 30s ease-in-out infinite alternate}
.flag{animation:sway 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
@media (prefers-reduced-motion: reduce){ .scene *{animation:none!important} }

/* ---------- page body ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 16.25rem;gap:3rem;padding:1.625rem 3rem 5.625rem;max-width:77.5rem;align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr)}
.main{min-width:0;max-width:50rem}
.wrap.solo .main{max-width:68.75rem}
.rail{position:sticky;top:1.25rem;display:flex;flex-direction:column;gap:1.375rem}
.lede p{font-size:1.1562rem;line-height:1.6;color:var(--tx2);margin:0 0 0.875rem;max-width:66ch}
.lede strong{color:var(--tx)}
.prose h2{font:400 2.125rem/1.15 var(--serif);margin:3rem 0 0.75rem;padding-bottom:0.5rem;border-bottom:1px solid var(--line)}
.prose h3{font:400 1.625rem/1.2 var(--serif);margin:2.125rem 0 0.375rem}
.prose h3.line small{display:block;font:italic 400 0.9688rem/1.5 var(--ui);color:var(--tx3);margin-top:0.25rem}
.prose p{margin:0 0 0.875rem;max-width:70ch}
.prose ul{margin:0 0 1rem;padding-left:1.375rem;max-width:70ch}
.prose li{margin:0.3125rem 0} .prose li p{margin:0}
.prose li::marker{color:var(--g,var(--acc))}
.prose > p:first-child > em:only-child{display:block;font:italic 400 1.625rem/1.3 var(--serif);color:var(--tx)}
.muted{color:var(--tx3)}
.note{background:var(--acc-soft);border-radius:0.625rem;padding:0.625rem 0.875rem;margin:1.25rem 0;font-size:0.9375rem;color:var(--tx2);max-width:70ch}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0.75rem 0 1.25rem;border:1px solid var(--line);border-radius:0.75rem;background:var(--bg2)}
table{border-collapse:collapse;width:100%;font-size:0.9375rem;line-height:1.45}
th{text-align:left;font-weight:700;font-size:0.8438rem;color:var(--tx3);padding:0.625rem 0.875rem;border-bottom:1px solid var(--line);background:var(--bg3);white-space:nowrap}
td{padding:0.625rem 0.875rem;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--tx);font-weight:700}
@media (min-width:761px){table.doc td:first-child{white-space:nowrap}}
table.doc td a{color:var(--tx);text-decoration-color:var(--line2)}
table.doc td a:hover{color:var(--acc);text-decoration-color:var(--acc)}
tr.hit td{animation:hit 2.6s ease-out}
@keyframes hit{0%,40%{background:color-mix(in srgb,var(--acc) 30%,transparent)}100%{background:transparent}}
.tfilter{display:flex;align-items:center;gap:0.5rem;margin:0.875rem 0 -4px}
.tfilter input{background:var(--bg2);border:1px solid var(--line);border-radius:0.5rem;padding:0.375rem 0.625rem;font-size:0.9062rem;width:15rem;outline:none;color:var(--tx)}
.tfilter input:focus{border-color:var(--acc)}
.tfilter span{font-size:0.8438rem;color:var(--tx3)}
.tchip{font-size:0.7812rem;font-weight:700;padding:2px 0.5rem;border-radius:6.1875rem;white-space:nowrap}
.t-active{background:var(--bg3);color:var(--tx2)} .t-ultimate{background:var(--acc-soft);color:var(--acc)} .t-passive{background:color-mix(in srgb,var(--hybrid) 16%,transparent);color:var(--hybrid)}
.cost{white-space:nowrap;font-weight:700}
.cost small{font-weight:400;font-size:0.7812rem;margin-left:0.1875rem}
.c-mana{color:var(--mana)} .c-stamina{color:var(--stamina)} .c-health{color:var(--health)} .c-ultimate{color:var(--acc)}
tbody tr.go{cursor:pointer}
tbody tr.go:hover td{background:var(--bg3)}
tbody tr.go:hover td.nm{color:var(--acc)}
td.nm{font:400 1.1875rem/1.2 var(--serif)!important;white-space:nowrap}
td.num{text-align:right;white-space:nowrap}
.group-row td{font:400 1.125rem var(--serif)!important;color:var(--acc)!important;background:var(--bg3)}

/* glossary terms */
.term{border-bottom:1px dotted var(--tx3);cursor:help;position:relative}
.term:hover,.term:focus{border-bottom-color:var(--acc);outline:none}
.tip{position:fixed;z-index:80;max-width:18.75rem;background:var(--bg2);border:1px solid var(--line2);border-radius:0.625rem;padding:0.625rem 0.75rem;font-size:0.875rem;line-height:1.45;color:var(--tx2);box-shadow:var(--shadow);pointer-events:none;opacity:0;transform:translateY(0.25rem);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;color:var(--tx);font:400 1.125rem var(--serif);margin-bottom:2px}

/* marks */
.pk{display:inline-flex;align-items:center;gap:0.375rem;white-space:nowrap;font-size:0.9062rem;font-weight:700}
.pk::before{content:"";width:0.5rem;height:0.5rem;border-radius:2px;transform:rotate(45deg);background:currentColor}
.pk-mana{color:var(--mana)} .pk-stamina{color:var(--stamina)} .pk-tank{color:var(--tank)} .pk-healer{color:var(--healer)} .pk-hybrid{color:var(--hybrid)}
.wt{display:inline-flex;align-items:center;gap:0.4375rem;font-size:0.9062rem;white-space:nowrap}
.wt .pips{display:inline-flex;gap:2px;align-items:flex-end}
.wt .pips span{width:0.25rem;border-radius:1px;background:var(--line2)}
.wt .pips span:nth-child(1){height:0.375rem}.wt .pips span:nth-child(2){height:0.5625rem}.wt .pips span:nth-child(3){height:0.75rem}
.wt .pips span.f{background:var(--tx)}
.src{font-size:0.9062rem;white-space:nowrap}

/* facts + on this page */
.facts{background:var(--bg2);border:1px solid var(--line);border-radius:0.875rem;overflow:hidden}
.facts .fh{position:relative;height:6.875rem;overflow:hidden}
.facts .fh svg{position:absolute;inset:0;width:100%;height:100%}
.facts .fh b{position:absolute;left:0.875rem;bottom:0.5rem;font:400 1.625rem var(--serif);color:#fff;text-shadow:0 2px 0.75rem #000}
.facts dl{margin:0;padding:0.375rem 0.875rem 0.625rem}
.facts dl div{padding:0.5rem 0;border-bottom:1px solid var(--line)}
.facts dl div:last-child{border-bottom:0}
.facts dt{font-size:0.8125rem;color:var(--tx3)}
.facts dd{margin:1px 0 0;font-size:0.9375rem}
.facts dd a{color:var(--acc);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--acc) 40%,transparent);text-underline-offset:0.1875rem}
.otp b{display:block;font-size:0.8438rem;color:var(--tx3);margin-bottom:0.375rem}
.otp a{display:block;font-size:0.9062rem;color:var(--tx3);padding:0.25rem 0 0.25rem 0.75rem;border-left:2px solid var(--line);cursor:pointer}
.otp a:hover{color:var(--tx)}
.otp a.on{color:var(--tx);border-left-color:var(--g,var(--acc))}

/* tiles (hub children, realms) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.75rem,1fr));gap:0.875rem;margin:0.75rem 0 1.375rem}
.tile{display:block;position:relative;border-radius:0.875rem;overflow:hidden;background:var(--bg2);border:1px solid var(--line);text-decoration:none!important;color:var(--tx)!important;transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:var(--shadow)}
.tile .th{position:relative;height:7.375rem;overflow:hidden}
.tile .th svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s}
.tile:hover .th svg{transform:scale(1.06)}
.tile .th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#0008)}
.tile .tn{position:absolute;left:0.875rem;bottom:0.5rem;z-index:1;font:400 1.625rem/1 var(--serif);color:#fff;text-shadow:0 2px 0.625rem #000}
.tile .tb{padding:0.625rem 0.875rem 0.75rem;font-size:0.9062rem;color:var(--tx2);line-height:1.45}
.tile .tb i{display:block;font-style:normal;color:var(--tx3);font-size:0.8438rem;margin-bottom:2px}
.tile .badge{position:absolute;right:0.625rem;top:0.625rem;z-index:1;font-size:0.75rem;font-weight:700;background:#000a;color:#9ff0c0;border-radius:6.1875rem;padding:2px 0.5rem}

details.devnotes{margin:3rem 0 0;border:1px dashed var(--line2);border-radius:0.75rem;padding:0 1.125rem}
details.devnotes summary{cursor:pointer;padding:0.75rem 0;color:var(--tx3)}
details.devnotes ul{color:var(--tx2);font-size:0.9375rem}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:0.625rem 1.125rem;align-items:center;margin:1.125rem 0 0.25rem}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:0.625rem;padding:0.1875rem;gap:2px}
.seg button{background:none;border:0;border-radius:0.4375rem;padding:0.25rem 0.625rem;cursor:pointer;color:var(--tx3);font-size:0.9062rem}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--acc-soft);color:var(--tx);font-weight:700}
.seg-l{font-size:0.8438rem;color:var(--tx3);margin-right:0.375rem}
.count{font-size:0.875rem;color:var(--tx3);margin-left:auto}
.inline-search{background:var(--bg2);border:1px solid var(--line);border-radius:0.625rem;padding:0.5rem 0.75rem;color:var(--tx);outline:none;min-width:16.25rem}
.inline-search:focus{border-color:var(--acc)}
.empty{padding:1.875rem;color:var(--tx3);text-align:center}

/* set page */
.tiers{border:1px solid var(--line);border-radius:0.75rem;background:var(--bg2);overflow:hidden;margin:0.625rem 0}
.tier{display:grid;grid-template-columns:6.25rem 1fr;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}
.tier .pc{padding:0.875rem;font-size:0.875rem;color:var(--tx3);display:flex;align-items:center;gap:0.5rem;border-right:1px solid var(--line)}
.tier .pc .dots{display:flex;gap:0.1875rem}
.tier .pc .dots span{width:0.4375rem;height:0.4375rem;border-radius:2px;transform:rotate(45deg);background:var(--line2)}
.tier .pc .dots span.f{background:var(--tx2)}
.tier .tx{padding:0.875rem 1rem;color:var(--tx2)}
.tier.unique{background:linear-gradient(90deg,var(--acc-soft),transparent 70%)}
.tier.unique .pc .dots span.f{background:var(--acc)}
.tier.unique .tx{color:var(--tx);font-size:1.0938rem}
.tier .tag{display:block;font:400 1.125rem var(--serif);color:var(--acc)}
.slots{display:flex;flex-wrap:wrap;gap:0.375rem;margin:0.625rem 0}
.slots span{padding:0.25rem 0.625rem;border:1px solid var(--line2);border-radius:0.5rem;font-size:0.9062rem;background:var(--bg2)}
.slots span.j{border-style:dashed}
.slots span.w{border-color:var(--acc)}
.weights{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin:0.75rem 0}
.weights div{background:var(--bg2);border:1px solid var(--line);border-radius:0.75rem;padding:0.875rem}
.weights b{font:400 1.5rem var(--serif);display:block;margin:0.375rem 0 2px}
.weights p{font-size:0.9062rem;color:var(--tx2);margin:0}
.pager{display:flex;justify-content:space-between;gap:0.75rem;margin-top:3.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.pager a{display:block;max-width:48%;padding:0.625rem 0.875rem;border:1px solid var(--line);border-radius:0.75rem;background:var(--bg2)}
.pager a:hover{border-color:var(--line2)}
.pager a small{display:block;font-size:0.8125rem;color:var(--tx3)}
.pager a b{font:400 1.3125rem var(--serif)}
.pager a.r{text-align:right;margin-left:auto}
footer.foot{margin-top:3.5rem;font-size:0.8438rem;color:var(--tx3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem}

/* ---------- home ---------- */
.hero{position:relative;height:min(66vh,32rem);min-height:28.75rem;overflow:hidden;isolation:isolate;background:#0b0e16}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 0%,#0000 55%,color-mix(in srgb,var(--bg) 60%,transparent) 85%,var(--bg) 100%);pointer-events:none}
.hero .hc{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 1.25rem 2.5rem}
.hero h1{font:400 clamp(4rem,10vw,8.25rem)/.9 var(--sc);letter-spacing:.06em;margin:0;color:#fff;text-shadow:0 0.25rem 2.5rem #000,0 0 5rem #ff5a1f66}
.hero p{font:italic 400 clamp(1.125rem,2vw,1.4375rem)/1.4 var(--serif);color:#f3e6d8;max-width:40ch;margin:0.875rem 0 1.625rem;text-shadow:0 2px 0.75rem #000}
.bigsearch{display:flex;align-items:center;gap:0.75rem;width:min(40rem,100%);background:#0b0e16cc;backdrop-filter:blur(0.625rem);border:1px solid #ffffff33;border-radius:1rem;padding:0.9375rem 1.125rem;color:#cfd6e4;font-size:1.125rem;cursor:text;box-shadow:0 0.625rem 3.125rem #000a}
.bigsearch:hover{border-color:#ffffff66}
.bigsearch kbd{margin-left:auto;font:0.8125rem var(--ui);border:1px solid #ffffff44;border-radius:0.375rem;padding:2px 0.4375rem;color:#cfd6e4}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:0.5rem;margin-top:1rem}
.quick a{font-size:0.9062rem;padding:0.375rem 0.8125rem;border-radius:6.1875rem;background:#0b0e16aa;border:1px solid #ffffff2a;color:#e9edf5;backdrop-filter:blur(0.375rem)}
.quick a:hover{border-color:var(--acc);color:#fff}
.home-body{padding:0.625rem 3rem 5.625rem;max-width:77.5rem}
.home-body h2{font:400 2.25rem var(--serif);margin:2.875rem 0 0.375rem}
.home-body > h2:first-child{margin-top:0.5rem}
.home-body .lead{color:var(--tx3);margin:0 0 1rem}
.answers{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:1rem}
.ans{background:var(--bg2);border:1px solid var(--line);border-radius:0.875rem;padding:1rem 1.125rem}
.ans h3{font:400 1.5rem var(--serif);margin:0 0 0.5rem;display:flex;justify-content:space-between;align-items:baseline}
.ans h3 a{font:0.875rem var(--ui);color:var(--acc)}
.ans table{font-size:0.9062rem}
.ans td{padding:0.375rem 0;border-bottom:1px solid var(--line)}
.ans td:first-child{padding-right:0.75rem}
.ans tr:last-child td{border-bottom:0}
.kbd{display:inline-block;font:700 0.8125rem var(--ui);border:1px solid var(--line2);border-bottom-width:2px;border-radius:0.375rem;padding:1px 0.4375rem;background:var(--bg3);color:var(--tx);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:0.75rem}
.bar b{display:flex;justify-content:space-between;font-size:0.9375rem}
.bar b span{font-weight:400;color:var(--tx3);font-size:0.8438rem}
.bar i{display:block;height:0.5rem;border-radius:6.1875rem;margin:0.3125rem 0 0.25rem;background:currentColor}
.bar p{margin:0;font-size:0.875rem;color:var(--tx2)}
.realms{display:grid;grid-template-columns:repeat(3,1fr);gap:0.875rem}
.realms .tile .th{height:9.375rem}
.dir{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5rem}
.dir h3{font:400 1.5rem var(--serif);margin:0 0 0.5rem;color:var(--g)}
.dir a.pg{display:block;padding:0.375rem 0;font-weight:700}
.dir a.pg:hover{color:var(--acc)}
.dir .ks{display:flex;flex-wrap:wrap;gap:0.25rem 0.625rem;font-size:0.875rem;margin:0 0 0.375rem}
.dir .ks a{color:var(--tx3)} .dir .ks a:hover{color:var(--acc)}

/* ---------- palette ---------- */
.pal{position:fixed;inset:0;z-index:100;background:#05070dcc;backdrop-filter:blur(0.25rem);display:none;align-items:flex-start;justify-content:center;padding:9vh 1rem 1rem}
.pal.open{display:flex}
.pbox{width:min(45rem,100%);background:var(--bg2);border:1px solid var(--line2);border-radius:1.125rem;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:78vh}
.pin{display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1.125rem;border-bottom:1px solid var(--line)}
.pin input{flex:1;background:none;border:0;outline:none;font-size:1.1875rem;color:var(--tx)}
.pin svg{color:var(--tx3)}
.pin button{background:var(--bg3);border:1px solid var(--line);border-radius:0.375rem;font-size:0.7812rem;padding:2px 0.4375rem;color:var(--tx3);cursor:pointer}
.pres{overflow:auto;padding:0.5rem}
.pres .ph{font-size:0.8125rem;color:var(--tx3);padding:0.5rem 0.75rem 0.25rem}
.pr{display:grid;grid-template-columns:auto 1fr;gap:2px 0.75rem;padding:0.625rem 0.75rem;border-radius:0.625rem;cursor:pointer}
.pr.sel{background:var(--acc-soft)}
.pr .k{grid-row:1/3;align-self:start;margin-top:0.1875rem;font-size:0.7188rem;font-weight:700;padding:2px 0.5rem;border-radius:6.1875rem;background:color-mix(in srgb,var(--g,var(--acc)) 18%,transparent);color:var(--g,var(--acc));white-space:nowrap;min-width:4.875rem;text-align:center}
.pr .t{font-weight:700;color:var(--tx)}
.pr .t small{font-weight:400;color:var(--tx3);margin-left:0.5rem;font-size:0.8438rem}
.pr .d{font-size:0.875rem;color:var(--tx2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr mark{background:none;color:var(--acc);font-weight:700}
.pfoot{display:flex;gap:1rem;padding:0.5625rem 1rem;border-top:1px solid var(--line);font-size:0.8125rem;color:var(--tx3)}
.pfoot a{margin-left:auto;color:var(--acc)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;order:-1}
  .otp{display:none}
  .facts{display:grid;grid-template-columns:12.5rem 1fr}
  .facts .fh{height:auto;min-height:7.5rem}
  .answers{grid-template-columns:1fr 1fr}
  .dir{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  :root{--side:0px}
  .side{transform:translateX(-100%);width:min(86vw,20rem);transition:transform .22s;box-shadow:var(--shadow)}
  body.nav-open .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:#0008;z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .top{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:0.625rem;padding:0.625rem 1rem;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(0.625rem);border-bottom:1px solid var(--line)}
  .top .logo{padding:0;margin-right:auto} .top .logo b{font-size:1.5rem}
  .realms{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  body{font-size:1rem}
  .banner{height:14.375rem}
  .banner .bt,.wrap,.home-body{padding-left:1rem;padding-right:1rem}
  .banner h1{font-size:2.625rem}
  .facts{grid-template-columns:1fr} .facts .fh{display:none}
  .answers,.realms,.dir{grid-template-columns:1fr}
  .weights{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr;gap:0.625rem}
  .tile .th{height:5.625rem} .tile .tn{font-size:1.3125rem} .tile .tb{font-size:0.8438rem}
  .tier{grid-template-columns:4.75rem 1fr}
  .inline-search,.tfilter input{min-width:0;width:100%}
  .count{margin-left:0;width:100%}
  td.nm{white-space:normal}
  table.sets thead{display:none}
  table.sets,table.sets tbody{display:block}
  table.sets tr.go{display:flex;flex-wrap:wrap;align-items:center;gap:0.375rem 0.75rem;padding:0.75rem 0.875rem;border-bottom:1px solid var(--line)}
  table.sets tr.go td{padding:0;border:0;background:none!important}
  table.sets tr.go td.nm{width:100%}
  table.sets tr.go td.bonus{width:100%}
  table.sets tr.go td.num::before{content:"Traits ";color:var(--tx3);font-weight:400}
  table.sets tr.group-row{display:block} table.sets tr.group-row td{display:block}
  .bigsearch{font-size:1rem;padding:0.8125rem 0.875rem} .bigsearch kbd{display:none}
  .pal{padding:0}
  .pbox{max-height:100vh;height:100%;border-radius:0}
  .pfoot span{display:none}
}

button svg,.sbtn svg,.bigsearch svg,.pin svg,.ib svg{width:1.15em;height:1.15em}
.tg svg{width:.75em;height:.75em}
.spin.rev{animation-direction:reverse;animation-duration:40s}
.flap{animation:flap .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:scaleY(.35)}}
</style>
</head>

const DOC={"order": ["world", "enemies", "guilds", "housing", "races", "races/drakari", "races/lunari", "races/vampyri", "races/felyne", "races/overlander", "races/dreadkin", "races/duskborn", "races/highborn", "races/oakborn", "races/ashkin", "classes", "classes/wizard", "classes/berserker", "classes/necromancer", "classes/dark-knight", "classes/holy-knight", "classes/shadowblade", "classes/alchemist", "classes/blood-maiden", "prestige", "titles", "combat", "weapons", "weapons/katana", "weapons/longsword", "weapons/sword-and-shield", "weapons/daggers", "weapons/destruction-staff", "weapons/restoration-staff", "weapons/scythe", "weapons/greatsword", "weapons/bow", "weapons/halberd", "weapons/twinblade", "status-effects", "enchantments", "crafting"], "pages": {"world": {"id": "world", "title": "The World", "group": "world", "children": [], "lede": "\n", "html": "<h2 id=\"s-the-story-so-far\">The story so far</h2><p>Five kingdoms once shared the realms: Dracoria, the kingdom of dragons; Aethelwing, the kingdom of moths; Deepspire, the kingdom of the Felyne; Eloria, the kingdom of elves; and Oakhaven, the kingdom of humans. A sixth realm was sealed away long ago.</p>\n<p>Malakor, once a student of the weave, broke that seal. In the Sixth Realm he became the <strong>Ash Sovereign</strong>, burning its people first and raising a cult from the cinders. His fire spread to the five realms, and on the night the game begins, it reached Oakhaven, the last kingdom still standing. Your story starts in the dungeons beneath the burning city.</p>\n<h2 id=\"s-the-realms\">The realms</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Realm</th>\n<th>Kingdom of</th>\n<th>Home of</th>\n<th>Feel</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Oakhaven</td>\n<td>Humans</td>\n<td><a class=\"link\" href=\"#/races/overlander\">Overlander</a>, <a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a></td>\n<td>Walls, knights, a burned capital being rebuilt</td>\n</tr>\n<tr class=\"even\">\n<td>Dracoria</td>\n<td>Dragons</td>\n<td><a class=\"link\" href=\"#/races/drakari\">Drakari</a>, <a class=\"link\" href=\"#/races/ashkin\">Ashkin</a></td>\n<td>Volcanic mountains, fire and scale</td>\n</tr>\n<tr class=\"odd\">\n<td>Aethelwing</td>\n<td>Moths</td>\n<td><a class=\"link\" href=\"#/races/lunari\">Lunari</a>, <a class=\"link\" href=\"#/races/vampyri\">Vampyri</a></td>\n<td>Lantern-lit night cities, light and dark</td>\n</tr>\n<tr class=\"even\">\n<td>Deepspire</td>\n<td>The Felyne</td>\n<td><a class=\"link\" href=\"#/races/felyne\">Felyne</a></td>\n<td>Moonlit spires and hunting grounds</td>\n</tr>\n<tr class=\"odd\">\n<td>Eloria</td>\n<td>Elves</td>\n<td><a class=\"link\" href=\"#/races/duskborn\">Duskborn</a>, <a class=\"link\" href=\"#/races/highborn\">Highborn</a>, <a class=\"link\" href=\"#/races/oakborn\">Oakborn</a></td>\n<td>Ancient forests and the Lanternhall Collegium</td>\n</tr>\n<tr class=\"even\">\n<td>The Sixth Realm</td>\n<td>Malakor</td>\n<td>(none)</td>\n<td>Ash wastes, the Ash Sovereign's domain; endgame</td>\n</tr>\n</tbody>\n</table></div>\n<p>Every character starts with the tutorial in the Oakhaven Dungeons, then travels to their race's home realm and its starting area.</p>\n<h2 id=\"s-dungeons-4-player\">Dungeons (4-player)</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Dungeon</th>\n<th>Realm theme</th>\n<th>Final boss</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/sets/dungeon\">Oakhaven Gaol</a></td>\n<td>Oakhaven's prison</td>\n<td>The Chained Warden</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/sets/dungeon\">Cinderdeep Mines</a></td>\n<td>Dracoria</td>\n<td>The Molten Foreman</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/sets/dungeon\">The Drowned Abbey</a></td>\n<td>Flooded monastery</td>\n<td>The Drowned Abbess</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/sets/dungeon\">Vaults of the Ashen Crown</a></td>\n<td>Malakor's treasury</td>\n<td><a class=\"link\" href=\"#/set/malakors-cultist\">Malakor&#x27;s Cultist</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/sets/dungeon\">Hollowroot Barrow</a></td>\n<td>Eloria's barrows</td>\n<td>The Root-Mother</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/sets/dungeon\">Thornveil Cathedral</a></td>\n<td>Aethelwing</td>\n<td>The Thorned Saint</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-trials-endgame-raids\">Trials (endgame raids)</h2><ul>\n<li><p><strong>The Sundered Spire:</strong> the shattered tower where the seal on the Sixth Realm was broken.</p></li>\n<li><p><strong>Throne of Ash:</strong> Malakor's seat in the Sixth Realm, ending in a fight with the Ash Sovereign himself.</p></li>\n</ul>\n<h2 id=\"s-the-ashpit\">The Ashpit</h2><p>A solo arena where players fight waves for the 11 arena weapons.</p>\n<h2 id=\"s-orders-in-the-world\">Orders in the world</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Order</th>\n<th>Class</th>\n<th>Realm</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>The Lanternhall Collegium</td>\n<td><a class=\"link\" href=\"#/classes/wizard\">Wizard</a></td>\n<td>Eloria</td>\n</tr>\n<tr class=\"even\">\n<td>The Emberhowl Clans</td>\n<td><a class=\"link\" href=\"#/classes/berserker\">Berserker</a></td>\n<td>Dracoria</td>\n</tr>\n<tr class=\"odd\">\n<td>The Quiet Choir</td>\n<td><a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a></td>\n<td>Oakhaven's barrows</td>\n</tr>\n<tr class=\"even\">\n<td>The Dawnward Order</td>\n<td><a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a></td>\n<td>Oakhaven</td>\n</tr>\n<tr class=\"odd\">\n<td>The Umbral Vow</td>\n<td><a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a></td>\n<td>Oakhaven, in exile</td>\n</tr>\n<tr class=\"even\">\n<td>The Hushed Court</td>\n<td><a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a></td>\n<td>Deepspire</td>\n</tr>\n<tr class=\"odd\">\n<td>The Lampwrights</td>\n<td><a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a></td>\n<td>Aethelwing</td>\n</tr>\n<tr class=\"even\">\n<td>The Rose Covenant</td>\n<td><a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a></td>\n<td>Aethelwing</td>\n</tr>\n</tbody>\n</table></div>\n"}, "enemies": {"id": "enemies", "title": "Enemies & bosses", "group": "world", "children": [], "lede": "<p>Enemies telegraph their attacks: a slowed wind-up means a big hit is coming. Most can be parried; some can't and must be dodged. This page grows as enemies are added.</p>\n", "html": "<h2 id=\"s-oakhaven-dungeons-tutorial\">Oakhaven Dungeons (tutorial)</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Enemy</th>\n<th>Type</th>\n<th>How it fights</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Prisoner</td>\n<td>Common</td>\n<td>Weak, fast swings; comes in groups</td>\n</tr>\n<tr class=\"even\">\n<td>Oakhaven Gaoler</td>\n<td>Elite</td>\n<td>Armed guard with a shield; blocks and punishes careless attacks</td>\n</tr>\n<tr class=\"odd\">\n<td>Chained Brute</td>\n<td>Heavy</td>\n<td>Slow, huge sweeps that hit all around it; dodge, don't block</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-boss-the-chained-warden\">Boss: The Chained Warden</h2><p>The gaol's warden, chained to his post by Malakor's fire. His arena is sealed by a fog wall once the fight starts.</p>\n<ul>\n<li><p><strong>Phase 1:</strong> chain sweeps and overhead slams with long wind-ups. Learn the rhythm, punish after slams.</p></li>\n<li><p><strong>Phase 2 (below half Health):</strong> his name burns red, he speeds up and adds a spinning chain attack that hits everything around him.</p></li>\n<li><p><strong>Reward:</strong> the Gaolbreaker achievement and title, plus Oakhaven Gaol set pieces.</p></li>\n</ul>\n<h2 id=\"s-ash-touched-foes\">Ash-touched foes</h2><p>Every Sixth Realm creature and every member of Malakor's cult is <strong>ash-touched</strong>: Hallowed weapons and Ashward jewellery work against them, and the Ironbound Company pays bounties on them.</p>\n"}, "guilds": {"id": "guilds", "title": "Guilds", "group": "world", "children": [], "lede": "<p>Two guilds are open to every character, whatever their class. Each has its own skill line that ranks up by doing the guild's work.</p>\n", "html": "<h2 id=\"s-the-arcane-conclave\">The Arcane Conclave</h2><p>Scholars of the weave who collect lost magic and keep dangerous relics out of the wrong hands. Join at any Conclave library; rank up by recovering lost tomes and closing ash rifts.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Weave Darts</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td>Three bolts of raw magic</td>\n</tr>\n<tr class=\"even\">\n<td>Rune Ward</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td>A glowing rune absorbs the next blow</td>\n</tr>\n<tr class=\"odd\">\n<td>Skyfall</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td>Bring a falling star down on your foes</td>\n</tr>\n<tr class=\"even\">\n<td>Scholar</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>More XP from books and discoveries</td>\n</tr>\n<tr class=\"odd\">\n<td>Spellweaver</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>Spells cost less</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-the-ironbound-company\">The Ironbound Company</h2><p>Sellswords and monster-hunters who take any contract that pays, and especially the ones against the Ash Sovereign's creatures. Join at any Company hall; rank up by hunting ash-touched foes and finishing bounties.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Silvered Quarrels</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td>A silver-tipped crossbow bolt, extra damage to ash-touched foes</td>\n</tr>\n<tr class=\"even\">\n<td>Hunter's Read</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td>Mark a foe to reveal its weak point</td>\n</tr>\n<tr class=\"odd\">\n<td>Company Banner</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td>Plant the banner: allies near it fight harder</td>\n</tr>\n<tr class=\"even\">\n<td>Veteran</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>More XP from kills</td>\n</tr>\n<tr class=\"odd\">\n<td>Beastbane</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>More damage to ash-touched foes</td>\n</tr>\n</tbody>\n</table></div>\n"}, "housing": {"id": "housing", "title": "Housing", "group": "world", "children": [], "lede": "<p>Every player can own a home: a private space to decorate, store gear and craft.</p>\n", "html": "<h2 id=\"s-getting-a-home\">Getting a home</h2><ul>\n<li><p><strong>Starter home:</strong> a small room in your home realm, given after the main story's first chapter.</p></li>\n<li><p><strong>Larger homes:</strong> bought with gold in each realm, from a cottage to a manor. Each realm has homes in its own style.</p></li>\n</ul>\n<h2 id=\"s-what-goes-in-a-home\">What goes in a home</h2><ul>\n<li><p><strong>Furniture:</strong> crafted, bought or found, placed freely.</p></li>\n<li><p><strong>Crafting stations:</strong> one for each of the seven crafts, plus set stations you've discovered in the world (see <a class=\"link\" href=\"#/crafting\">Crafting</a>).</p></li>\n<li><p><strong>Storage:</strong> chests that add bank space.</p></li>\n<li><p><strong>Trophies:</strong> boss trophies from dungeons and trials, and a title display.</p></li>\n<li><p><strong>Training dummy:</strong> for testing builds.</p></li>\n</ul>\n<h2 id=\"s-visiting\">Visiting</h2><p>You can invite friends and guild members, or open your home to visitors.</p>\n"}, "races": {"id": "races", "title": "Races", "group": "characters", "children": ["races/drakari", "races/lunari", "races/vampyri", "races/felyne", "races/overlander", "races/dreadkin", "races/duskborn", "races/highborn", "races/oakborn", "races/ashkin"], "lede": "<p>Severance has 10 playable races. Each race has four racial passives that unlock as you level and stay on all the time; they never take a skill bar slot. A race shapes your build but never locks it: any race can play any class and any weapon. Each race just gives a head start to a few play styles.</p>\n", "html": "<h2 id=\"s-how-racial-passives-work\">How racial passives work</h2><ul>\n<li><p><strong>Unlocks:</strong> each race's passives unlock at levels 1, 10, 25 and 40 (the level cap is 50).</p></li>\n<li><p><strong>Always on:</strong> racial passives need no skill points and work in every bar, every loadout and every zone.</p></li>\n<li><p><strong>Shape of a race:</strong> the level 1 passive is a trait you notice in the world, the level 10 one raises a resource, the level 25 one is a combat bonus, and the level 40 one is the race's signature.</p></li>\n<li><p><strong>Numbers are placeholders:</strong> every value here is a starting point for balance testing.</p></li>\n</ul>\n<h2 id=\"s-overview\">Overview</h2><p><em>Best Fits are suggestions, not requirements: every race can play every class well.</em></p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Race</th>\n<th>Kin</th>\n<th>Strengths</th>\n<th>Best Fits</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/drakari\">Drakari</a></td>\n<td>Dragonfolk</td>\n<td>Health, armour, Fire damage</td>\n<td><a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/races/lunari\">Lunari</a></td>\n<td>Mothfolk</td>\n<td>Mana, healing, evasion</td>\n<td><a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/vampyri\">Vampyri</a></td>\n<td>Batfolk</td>\n<td>Life steal, night mobility</td>\n<td><a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a>, <a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/races/felyne\">Felyne</a></td>\n<td>Catfolk</td>\n<td>Stamina, backstabs, survival</td>\n<td><a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/overlander\">Overlander</a></td>\n<td>Human</td>\n<td>All-rounder: XP, Poise, Ultimate</td>\n<td>Any</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a></td>\n<td>Undead</td>\n<td>Poison and Bleed immunity, regeneration</td>\n<td><a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/duskborn\">Duskborn</a></td>\n<td>Dark Elf</td>\n<td>Frost and Bleed damage, stealth</td>\n<td><a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/wizard\">Wizard</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/races/highborn\">Highborn</a></td>\n<td>High Elf</td>\n<td>Mana and Spell Damage</td>\n<td><a class=\"link\" href=\"#/classes/wizard\">Wizard</a>, <a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/oakborn\">Oakborn</a></td>\n<td>Wood Elf</td>\n<td>Ranged damage, Poison, sneaking</td>\n<td><a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a>, <a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/races/ashkin\">Ashkin</a></td>\n<td>Cinderborn</td>\n<td>Fire resistance, self-healing</td>\n<td><a class=\"link\" href=\"#/classes/berserker\">Berserker</a>, <a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a></td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-home-realms\">Home realms</h2><p>Every character starts with the tutorial in the dungeons beneath Oakhaven. Once it's done, they travel to their race's home realm and start the story in that realm's own starting area. All three elf races share Eloria.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Home realm</th>\n<th>Races</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/world\">Oakhaven</a></td>\n<td><a class=\"link\" href=\"#/races/overlander\">Overlander</a>, <a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/world\">Dracoria</a></td>\n<td><a class=\"link\" href=\"#/races/drakari\">Drakari</a>, <a class=\"link\" href=\"#/races/ashkin\">Ashkin</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/world\">Aethelwing</a></td>\n<td><a class=\"link\" href=\"#/races/lunari\">Lunari</a>, <a class=\"link\" href=\"#/races/vampyri\">Vampyri</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/world\">Deepspire</a></td>\n<td><a class=\"link\" href=\"#/races/felyne\">Felyne</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/world\">Eloria</a></td>\n<td><a class=\"link\" href=\"#/races/duskborn\">Duskborn</a>, <a class=\"link\" href=\"#/races/highborn\">Highborn</a>, <a class=\"link\" href=\"#/races/oakborn\">Oakborn</a></td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-changing-race\">Changing race</h2><p>Your race is set when you create a character. The only way to change it is a <strong>Race Reset Token</strong>, bought with Robux, which reopens the race step of character creation and keeps your level, gear and progress. Without a token, you'd make a new character in another slot.</p>\n<h2 id=\"s-pvp-versions\">PvP versions</h2><p>Some passives are too strong against other players, so they work differently in PvP:</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Race</th>\n<th>Passive</th>\n<th>PvE</th>\n<th>PvP</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/vampyri\">Vampyri</a></td>\n<td>Sanguine Thirst</td>\n<td>4% of damage heals you (6% on Bleeding foes)</td>\n<td>2% (3% on Bleeding foes)</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/races/vampyri\">Vampyri</a></td>\n<td>Wing-Shroud</td>\n<td>Once per 45 s</td>\n<td>Once per 90 s</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/felyne\">Felyne</a></td>\n<td>Ninth Life</td>\n<td>Once per 120 s</td>\n<td>Once per fight, and you're left at 1 Health with no immunity</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a></td>\n<td>Refused by Death</td>\n<td>Rise with 25% Health after 2 s, once per 300 s</td>\n<td>Rise with 10% Health after 3 s, once per fight; a foe can finish you while you're down</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/races/drakari\">Drakari</a></td>\n<td>Hoard-Fury</td>\n<td>+12% damage, +15 Poise</td>\n<td>+6% damage, +15 Poise</td>\n</tr>\n</tbody>\n</table></div>\n<!--CHILDREN--><details class=\"devnotes\" id=\"s-design-decisions\"><summary>Design notes</summary><ul>\n<li><p><strong>Ashkin and Malakor:</strong> linked. The Ashkin survived Malakor's first burning in the Sixth Realm (see Ashkin above).</p></li>\n<li><p><strong>Home realms:</strong> every race has a home realm and its own starting area, reached after the Oakhaven dungeon tutorial. All elves start in Eloria. The other realm assignments are proposals until confirmed.</p></li>\n<li><p><strong>Changing race:</strong> only with a Race Reset Token (Robux); otherwise make a new character slot.</p></li>\n<li><p><strong>PvP balance:</strong> the life-steal and cheat-death passives get weaker PvP versions (see PvP versions).</p></li>\n</ul>\n</details>"}, "races/drakari": {"id": "races/drakari", "title": "Drakari", "sub": "Dragonfolk", "group": "characters", "parent": "races", "info": [["Kin", "Dragonfolk"], ["Home realm", "<a class=\"link\" href=\"#/world\">Dracoria</a>"], ["Strengths", "Health, armour, Fire damage"], ["Best fits", "<a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a>"]], "card": "Health, armour, Fire damage", "badge": null, "html": "<p>Scaled descendants of the old wyrms: thick-skinned and fire-blooded. Drakari are hard to bring down, and they hit hardest when they're nearly beaten.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Scaled Hide</td>\n<td>Take 5% less physical damage</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Wyrmblood</td>\n<td>+8% max Health</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Kindled Breath</td>\n<td>+8% Fire damage; Burns on you last half as long</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Hoard-Fury</td>\n<td>Falling below 35% Health grants +12% damage and +15 Poise for 8 s (once per 60 s)</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/lunari": {"id": "races/lunari", "title": "Lunari", "sub": "Mothfolk", "group": "characters", "parent": "races", "info": [["Kin", "Mothfolk"], ["Home realm", "<a class=\"link\" href=\"#/world\">Aethelwing</a>"], ["Strengths", "Mana, healing, evasion"], ["Best fits", "<a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a>"]], "card": "Mana, healing, evasion", "badge": null, "html": "<p>Nocturnal wanderers drawn to lantern-light. Lunari are slippery in a fight and shine as healers.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Lanternsight</td>\n<td>See better in the dark, and spot foes through fog and smoke within 20 studs</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Moonsilk Mind</td>\n<td>+8% max Mana</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Wingdust</td>\n<td>Dodging leaves a cloud of dust that Slows foes in it by 20% for 2 s</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Drawn to Light</td>\n<td>+8% healing done and Holy damage</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/vampyri": {"id": "races/vampyri", "title": "Vampyri", "sub": "Batfolk", "group": "characters", "parent": "races", "info": [["Kin", "Batfolk"], ["Home realm", "<a class=\"link\" href=\"#/world\">Aethelwing</a>"], ["Strengths", "Life steal, night mobility"], ["Best fits", "<a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a>, <a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>"]], "card": "Life steal, night mobility", "badge": null, "html": "<p>Pale nightstalkers with a taste for old blood pacts. Vampyri feed on the fight itself and own the night.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Night-Sense</td>\n<td>Move 10% faster at night, and hear hidden foes nearby</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Old Pact</td>\n<td>+5% max Health and Stamina</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Sanguine Thirst</td>\n<td>4% of damage you deal heals you, rising to 6% against Bleeding foes</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Wing-Shroud</td>\n<td>Once per 45 s, a dodge becomes a swarm of bats: a 10 stud dash you can't be hit during</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/felyne": {"id": "races/felyne", "title": "Felyne", "sub": "Catfolk", "group": "characters", "parent": "races", "info": [["Kin", "Catfolk"], ["Home realm", "<a class=\"link\" href=\"#/world\">Deepspire</a>"], ["Strengths", "Stamina, backstabs, survival"], ["Best fits", "<a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a>"]], "card": "Stamina, backstabs, survival", "badge": null, "html": "<p>Quick-tongued and quicker-footed. Felyne strike from behind and refuse to stay down.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Soft Paws</td>\n<td>Sneaking is quieter, and you take no fall damage under 30 studs</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Long Breath</td>\n<td>+8% max Stamina</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Pounce</td>\n<td>+10% damage on backstabs and jump attacks</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Ninth Life</td>\n<td>Once per 120 s, a killing blow leaves you at 1 Health, and you can't be hurt for 2 s</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/overlander": {"id": "races/overlander", "title": "Overlander", "sub": "Human", "group": "characters", "parent": "races", "info": [["Kin", "Human"], ["Home realm", "<a class=\"link\" href=\"#/world\">Oakhaven</a>"], ["Strengths", "All-rounder: XP, Poise, Ultimate"], ["Best fits", "Any"]], "card": "All-rounder: XP, Poise, Ultimate", "badge": null, "html": "<p>No tricks, no tails. Overlanders do a little of everything well, level faster, and keep their footing when a fight turns bad.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Many Roads</td>\n<td>+10% XP from every source</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Steady Heart</td>\n<td>+4% max Health, Stamina and Mana</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Hard-Won Grit</td>\n<td>+10 Poise, and you recover from staggers 15% faster</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Rallying Spirit</td>\n<td>+10% Ultimate gained</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/dreadkin": {"id": "races/dreadkin", "title": "Dreadkin", "sub": "Undead", "group": "characters", "parent": "races", "info": [["Kin", "Undead"], ["Home realm", "<a class=\"link\" href=\"#/world\">Oakhaven</a>"], ["Strengths", "Poison and Bleed immunity, regeneration"], ["Best fits", "<a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a>"]], "card": "Poison and Bleed immunity, regeneration", "badge": null, "html": "<p>Death didn't take the first time. Dreadkin shrug off rot and blood loss, knit back together, and are very hard to finish off.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Grave-Touched</td>\n<td>Immune to Poison; Bleeds on you last half as long</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Hollow Vigor</td>\n<td>+15% Health regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Stubborn Flesh</td>\n<td>Below 50% Health, healing you receive is 10% stronger</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Refused by Death</td>\n<td>Once per 300 s, a killing blow instead drops you for 2 s, then you rise with 25% Health. Doesn't work in the Ashpit</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/duskborn": {"id": "races/duskborn", "title": "Duskborn", "sub": "Dark Elf", "group": "characters", "parent": "races", "info": [["Kin", "Dark Elf"], ["Home realm", "<a class=\"link\" href=\"#/world\">Eloria</a>"], ["Strengths", "Frost and Bleed damage, stealth"], ["Best fits", "<a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/wizard\">Wizard</a>"]], "card": "Frost and Bleed damage, stealth", "badge": null, "html": "<p>Children of the shaded vales, whose blood runs cold and blue. Duskborn mix blade and spell and vanish into shadow.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Coldblood</td>\n<td>Take 15% less Frost damage; Slows on you last half as long</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Vale-Twilight</td>\n<td>+4% max Mana and Stamina</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Shade-Cut</td>\n<td>+8% Frost and Bleed damage</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Dusk Veil</td>\n<td>Stand still while sneaking for 1.5 s to become invisible until you act (once per 60 s)</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/highborn": {"id": "races/highborn", "title": "Highborn", "sub": "High Elf", "group": "characters", "parent": "races", "info": [["Kin", "High Elf"], ["Home realm", "<a class=\"link\" href=\"#/world\">Eloria</a>"], ["Strengths", "Mana and Spell Damage"], ["Best fits", "<a class=\"link\" href=\"#/classes/wizard\">Wizard</a>, <a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a>"]], "card": "Mana and Spell Damage", "badge": null, "html": "<p>Old blood, older grudges, bred tall for a throne that no longer exists. Highborn are the purest spellcasters.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Old Tongue</td>\n<td>Read ancient inscriptions, and research crafting traits 10% faster</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Throneblood</td>\n<td>+10% max Mana</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Exacting Will</td>\n<td>+6% Spell Damage</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Crown of Focus</td>\n<td>+20% Mana regeneration while at full Health</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/oakborn": {"id": "races/oakborn", "title": "Oakborn", "sub": "Wood Elf", "group": "characters", "parent": "races", "info": [["Kin", "Wood Elf"], ["Home realm", "<a class=\"link\" href=\"#/world\">Eloria</a>"], ["Strengths", "Ranged damage, Poison, sneaking"], ["Best fits", "<a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a>, <a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>"]], "card": "Ranged damage, Poison, sneaking", "badge": null, "html": "<p>Forest-bound and root-footed. Oakborn are small but deadly at range, and nothing in the woods hears them coming.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Rootfoot</td>\n<td>Undergrowth doesn't slow you, and you move 15% faster while sneaking</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Sap-Stride</td>\n<td>+6% max Stamina and +5% Stamina regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Hunter's Patience</td>\n<td>+10% damage to foes more than 20 studs away</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Thornblood</td>\n<td>+10% Poison damage; Poison deals 25% less to you</td>\n</tr>\n</tbody>\n</table></div>\n"}, "races/ashkin": {"id": "races/ashkin", "title": "Ashkin", "sub": "Cinderborn", "group": "characters", "parent": "races", "info": [["Kin", "Cinderborn"], ["Home realm", "<a class=\"link\" href=\"#/world\">Dracoria</a>"], ["Strengths", "Fire resistance, self-healing"], ["Best fits", "<a class=\"link\" href=\"#/classes/berserker\">Berserker</a>, <a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a>"]], "card": "Fire resistance, self-healing", "badge": null, "html": "<p>The first people Malakor burned. When the Ash Sovereign rose in the Sixth Realm, its people were the first fed to the flame, and the Ashkin are what crawled out of the cinders before the realm was sealed. Their skin never stops smoking, and the same ash runs in them as in Malakor himself. Many in the five realms distrust them for it. The Ashkin settled among the fires of Dracoria, and they can't be burned; every hit they take stokes the fire.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Passive</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Smouldering</td>\n<td>Immune to Burn, and take 15% less Fire damage</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Ember Core</td>\n<td>+4% max Health and Mana</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td>Banked Coals</td>\n<td>Each hit you take adds heat; at 10 heat your next attack bursts into flame (200 Fire damage around you)</td>\n</tr>\n<tr class=\"even\">\n<td>40</td>\n<td>Rekindle</td>\n<td>Dodging heals 3% of your max Health (once every 4 s)</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes": {"id": "classes", "title": "Classes", "group": "characters", "children": ["classes/wizard", "classes/berserker", "classes/necromancer", "classes/dark-knight", "classes/holy-knight", "classes/shadowblade", "classes/alchemist", "classes/blood-maiden"], "lede": "<p>Severance has 8 classes. Each class has three skill lines of its own, each with 4 active skills, an ultimate and 2 passives, unlocked by character level and bought with skill points. You pick a class when you create your character. Weapons, races and armour are all free choices, so the Best Fits below are suggestions, not requirements.</p>\n", "html": "<h2 id=\"s-how-class-skills-work\">How class skills work</h2><ul>\n<li><p><strong>Skill points:</strong> you start with 3 and earn 1 per level. Spend them to unlock skills and passives.</p></li>\n<li><p><strong>Two bars:</strong> each bar holds 5 skills and an ultimate, and Z swaps bars (and weapons) mid-fight. Class skills slot on either bar.</p></li>\n<li><p><strong>No cooldowns:</strong> skills share a 0.9 s global cooldown between casts; the limit is your Mana, Stamina or Health.</p></li>\n<li><p><strong>Ultimate:</strong> builds up to 100 as you fight. Each ultimate costs between 75 and 100.</p></li>\n<li><p><strong>Elements:</strong> each skill line has a damage type (Fire, Frost, Shock, Shadow, Holy, Blood, Poison, Necrotic or Physical) that its passives and your gear can boost.</p></li>\n</ul>\n<h2 id=\"s-refinements-levels-20-50\">Refinements (levels 20-50)</h2><p>Class skills unlock by level 14, but your build keeps growing after that. From <strong>level 20</strong>, every active skill and ultimate you own can be <strong>refined</strong> once, for 1 skill point. A refinement makes you choose between two versions of the skill, each with its own name and twist. You keep the one you pick.</p>\n<ul>\n<li><p><strong>Why it balances:</strong> by level 50 you have 52 skill points. Buying every skill in your class and both weapon lines takes about 40, so there are only enough left to refine around 12 skills. That's enough for the skills on your two bars, but not for everything, so you have to choose.</p></li>\n<li><p><strong>Refinements change how a skill plays, not just how hard it hits.</strong> One side usually adds range, area or utility, and the other adds raw power or a stronger status effect. Neither should simply be better.</p></li>\n<li><p><strong>Changing your mind:</strong> you can swap a skill to its other refinement at any Wayshrine for a small gold fee. A full skill reset (all points back) costs more.</p></li>\n<li><p><strong>More points:</strong> <strong>Echo Stones</strong> are hidden across the realms, and every 3 you find gives 1 extra skill point. This rewards exploring without being needed to finish a build.</p></li>\n</ul>\n<p>Examples, one per class:</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Refinement A</th>\n<th>Refinement B</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ember Dart (Wizard)</td>\n<td><strong>Scattering Ember</strong>: splashes 5 studs around the target</td>\n<td><strong>Searing Dart</strong>: Burn deals 50% more and lasts 2 s longer</td>\n</tr>\n<tr class=\"even\">\n<td>Headlong Charge (Berserker)</td>\n<td><strong>Bull's Path</strong>: knocks down the first foe hit</td>\n<td><strong>Running Start</strong>: +20% damage for 4 s after the charge</td>\n</tr>\n<tr class=\"odd\">\n<td>Bone Bowman (Necromancer)</td>\n<td><strong>Twin Bowmen</strong>: raises two archers with 40% less damage each</td>\n<td><strong>Marrow Archer</strong>: one archer whose arrows Slow by 25%</td>\n</tr>\n<tr class=\"even\">\n<td>Lifethief (Dark Knight)</td>\n<td><strong>Deep Draw</strong>: heals 80% of the damage, less range</td>\n<td><strong>Spreading Thirst</strong>: pierces and drains up to 3 foes</td>\n</tr>\n<tr class=\"odd\">\n<td>Aegis of Light (Holy Knight)</td>\n<td><strong>Shared Aegis</strong>: also shields 2 nearby allies for half the amount</td>\n<td><strong>Burning Aegis</strong>: when the shield breaks, it bursts for Holy damage</td>\n</tr>\n<tr class=\"even\">\n<td>Gutting Cut (Shadowblade)</td>\n<td><strong>Opening Cut</strong>: deals double damage from behind</td>\n<td><strong>Long Bleed</strong>: Bleed lasts twice as long</td>\n</tr>\n<tr class=\"odd\">\n<td>Healing Draught (Alchemist)</td>\n<td><strong>Splash Draught</strong>: thrown, heals everyone in 6 studs for 60% as much</td>\n<td><strong>Strong Draught</strong>: heals 40% of max Health and cleanses a Poison</td>\n</tr>\n<tr class=\"even\">\n<td>Open Veins (Blood Maiden)</td>\n<td><strong>Sympathy</strong>: the Bleed jumps to a nearby foe when the target dies</td>\n<td><strong>Exsanguinate</strong>: the Bleed heals you for 30% of its damage</td>\n</tr>\n</tbody>\n</table></div>\n<p>Every skill gets its pair of refinements when the system is built. They're listed in each skill line's table once they're designed.</p>\n<h2 id=\"s-overview\">Overview</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Class</th>\n<th>Role</th>\n<th>Skill lines</th>\n<th>Best Fit weapons</th>\n<th>Best Fit races</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/classes/wizard\">Wizard</a></td>\n<td>Ranged damage</td>\n<td>Emberweave, Rimeweave, Thunderweave</td>\n<td><a class=\"link\" href=\"#/weapons/destruction-staff\">Destruction Staff</a>, <a class=\"link\" href=\"#/weapons/restoration-staff\">Restoration Staff</a></td>\n<td><a class=\"link\" href=\"#/races/highborn\">Highborn</a>, <a class=\"link\" href=\"#/races/lunari\">Lunari</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/classes/berserker\">Berserker</a></td>\n<td>Melee damage, bruiser</td>\n<td>Red Hunger, Scarhide, Battle Roar</td>\n<td><a class=\"link\" href=\"#/weapons/greatsword\">Greatsword</a>, <a class=\"link\" href=\"#/weapons/twinblade\">Twinblade</a>, <a class=\"link\" href=\"#/weapons/halberd\">Halberd</a></td>\n<td><a class=\"link\" href=\"#/races/drakari\">Drakari</a>, <a class=\"link\" href=\"#/races/felyne\">Felyne</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a></td>\n<td>Summoner, ranged</td>\n<td>Barrow Host, Ossuary, Sutured Flesh</td>\n<td><a class=\"link\" href=\"#/weapons/destruction-staff\">Destruction Staff</a>, <a class=\"link\" href=\"#/weapons/scythe\">Scythe</a></td>\n<td><a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a>, <a class=\"link\" href=\"#/races/highborn\">Highborn</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a></td>\n<td>Melee damage, life drain</td>\n<td>Abyssal Edge, Crimson Pact, Dread Aegis</td>\n<td><a class=\"link\" href=\"#/weapons/greatsword\">Greatsword</a>, <a class=\"link\" href=\"#/weapons/longsword\">Longsword</a>, <a class=\"link\" href=\"#/weapons/sword-and-shield\">Sword and Shield</a></td>\n<td><a class=\"link\" href=\"#/races/drakari\">Drakari</a>, <a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a></td>\n<td>Tank, healer</td>\n<td>Radiant Oath, Hallowed Shelter, Verdict of Light</td>\n<td><a class=\"link\" href=\"#/weapons/sword-and-shield\">Sword and Shield</a>, <a class=\"link\" href=\"#/weapons/longsword\">Longsword</a>, <a class=\"link\" href=\"#/weapons/restoration-staff\">Restoration Staff</a></td>\n<td><a class=\"link\" href=\"#/races/overlander\">Overlander</a>, <a class=\"link\" href=\"#/races/lunari\">Lunari</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a></td>\n<td>Melee damage, assassin</td>\n<td>Quiet Knife, Umbral Arts, Duskstride</td>\n<td><a class=\"link\" href=\"#/weapons/daggers\">Daggers</a>, <a class=\"link\" href=\"#/weapons/katana\">Katana</a>, <a class=\"link\" href=\"#/weapons/bow\">Bow</a></td>\n<td><a class=\"link\" href=\"#/races/felyne\">Felyne</a>, <a class=\"link\" href=\"#/races/duskborn\">Duskborn</a>, <a class=\"link\" href=\"#/races/oakborn\">Oakborn</a></td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a></td>\n<td>Support, damage over time</td>\n<td>Volatile Mixtures, Tinctures, Toxicology</td>\n<td><a class=\"link\" href=\"#/weapons/daggers\">Daggers</a>, <a class=\"link\" href=\"#/weapons/bow\">Bow</a>, <a class=\"link\" href=\"#/weapons/restoration-staff\">Restoration Staff</a></td>\n<td><a class=\"link\" href=\"#/races/oakborn\">Oakborn</a>, <a class=\"link\" href=\"#/races/lunari\">Lunari</a></td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a></td>\n<td>Mid-range damage, life steal</td>\n<td>Red Rites, Crimson Thorn, Vein Puppetry</td>\n<td><a class=\"link\" href=\"#/weapons/scythe\">Scythe</a>, <a class=\"link\" href=\"#/weapons/destruction-staff\">Destruction Staff</a></td>\n<td><a class=\"link\" href=\"#/races/vampyri\">Vampyri</a>, <a class=\"link\" href=\"#/races/ashkin\">Ashkin</a></td>\n</tr>\n</tbody>\n</table></div>\n<!--CHILDREN--><details class=\"devnotes\" id=\"s-design-decisions\"><summary>Design notes</summary><ul>\n<li><p><strong>Skills after level 14:</strong> refinements from level 20 (see Refinements), plus Echo Stones for extra skill points.</p></li>\n<li><p><strong>Orders:</strong> every class has an order, school, guild or cult in the world (see each class). Each should get its own questline and a hall players can visit.</p></li>\n</ul>\n</details>"}, "classes/wizard": {"id": "classes/wizard", "title": "Wizard", "sub": "Ranged damage", "group": "characters", "parent": "classes", "info": [["Role", "Ranged damage"], ["Skill lines", "Emberweave, Rimeweave, Thunderweave"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/destruction-staff\">Destruction Staff</a>, <a class=\"link\" href=\"#/weapons/restoration-staff\">Restoration Staff</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/highborn\">Highborn</a>, <a class=\"link\" href=\"#/races/lunari\">Lunari</a>"]], "card": "Emberweave, Rimeweave, Thunderweave", "badge": null, "html": "<p><em>Bends the weave from a careful distance. Fragile, but never out of options.</em></p>\n<p>Long-range caster built on Mana. Three elemental schools: fire for damage over time, frost for control and shields, storm for speed and mobility.</p>\n<p><strong>School: The Lanternhall Collegium</strong> (Eloria)</p>\n<p>Magic in Severance is called the weave, and the Collegium was the first to teach it as a craft rather than a gift. Its towers stand above the Elorian forests, lit day and night, and every student serves an apprenticeship in one of its three wings: the Ember Wing (Emberweave), the Rime Wing (Rimeweave) and the Thunder Wing (Thunderweave). The masters know the weave can be spoiled, because Malakor was once a student at Lanternhall. The Collegium has kept his name out of its records ever since, and it trains wizards now partly to make sure no one learns what he learned.</p>\n<h3 class=\"line\" id=\"s-emberweave\">Emberweave<small>(Fire): The oldest weave: heat, given a target.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ember Dart</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-mana\">220 <small>Mana</small></span></td>\n<td>A bolt (160 damage, 60 studs), Burns (30/s for 4 s)</td>\n</tr>\n<tr class=\"even\">\n<td>Flame Ring</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>A burst around you (180 damage, 8 studs), Burns (30/s for 4 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Cinder Field</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>8</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>An area 10 studs ahead (7 studs, 6 s): 60 damage/s</td>\n</tr>\n<tr class=\"even\">\n<td>Falling Star</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">75 <small>Ultimate</small></span></td>\n<td>An area 12 studs ahead (9 studs, 3 s): lands for 700 damage, 80 damage/s, Burns (50/s for 5 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Kindling</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+8% Fire damage</td>\n</tr>\n<tr class=\"even\">\n<td>Ember Heart</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+5% max Mana</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-rimeweave\">Rimeweave<small>(Frost): Patience, made cold enough to cut.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rime Spear</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-mana\">250 <small>Mana</small></span></td>\n<td>A bolt (150 damage, 60 studs), pierces, Slows by 30% for 3 s</td>\n</tr>\n<tr class=\"even\">\n<td>Glacial Shell</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>For 6 s: a shield worth 25% of max Health, -10% damage taken</td>\n</tr>\n<tr class=\"odd\">\n<td>Hoarfrost Burst</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-mana\">380 <small>Mana</small></span></td>\n<td>A burst around you (120 damage, 7 studs), Slows by 50% for 4 s</td>\n</tr>\n<tr class=\"even\">\n<td>Stillwinter</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>An area around you, following you (12 studs, 6 s): 80 damage/s, Slows by 60% for 1.5 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Winter's Patience</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>+8% Frost damage</td>\n</tr>\n<tr class=\"even\">\n<td>Slow Pulse</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>-4% damage taken</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-thunderweave\">Thunderweave<small>(Shock): Borrow the sky's temper.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Chain Spark</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-mana\">240 <small>Mana</small></span></td>\n<td>A bolt (130 damage, 55 studs), leaves them Vulnerable (10% more damage) for 4 s</td>\n</tr>\n<tr class=\"even\">\n<td>Boltstride</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>Dash 14 studs, untouchable, hitting everything in the path (140 damage)</td>\n</tr>\n<tr class=\"odd\">\n<td>Crackling Mantle</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-mana\">420 <small>Mana</small></span></td>\n<td>An area around you, following you (7 studs, 8 s): 50 damage/s</td>\n</tr>\n<tr class=\"even\">\n<td>Storm-Spirit</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">100 <small>Ultimate</small></span></td>\n<td>Summon a storm-spirit for 10 s that shoots the nearest foe (140 damage every 0.8 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Conductive</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>+8% Shock damage</td>\n</tr>\n<tr class=\"even\">\n<td>Quickening</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>+8% Mana regeneration</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes/berserker": {"id": "classes/berserker", "title": "Berserker", "sub": "Melee damage, bruiser", "group": "characters", "parent": "classes", "info": [["Role", "Melee damage, bruiser"], ["Skill lines", "Red Hunger, Scarhide, Battle Roar"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/greatsword\">Greatsword</a>, <a class=\"link\" href=\"#/weapons/twinblade\">Twinblade</a>, <a class=\"link\" href=\"#/weapons/halberd\">Halberd</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/drakari\">Drakari</a>, <a class=\"link\" href=\"#/races/felyne\">Felyne</a>"]], "card": "Red Hunger, Scarhide, Battle Roar", "badge": null, "html": "<p><em>Runs at the problem, swinging. Every hit taken is a hit returned harder.</em></p>\n<p>Stamina melee bruiser. Big damage buffs, charges and war cries, and the toughest self-defence of any class.</p>\n<p><strong>Warband: The Emberhowl Clans</strong> (Dracoria)</p>\n<p>The Emberhowl are the mountain clans of Dracoria, who learned to fight from watching dragons. A clan warrior earns their place by walking into a fight they should lose and walking out of it; scars are worn openly and counted at every feast. They answer to no king, only to whoever leads the next charge, and they were the first to march on the Sixth Realm's ash. Most never came back, and the clans still sing for them before every battle.</p>\n<h3 class=\"line\" id=\"s-red-hunger\">Red Hunger<small>(Physical): Hit first. Hit again. Keep hitting.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Reaving Cleave</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A strike (200 damage), Bleeds (30/s for 4 s)</td>\n</tr>\n<tr class=\"even\">\n<td>Headlong Charge</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Dash 12 studs, untouchable, hitting everything in the path (160 damage)</td>\n</tr>\n<tr class=\"odd\">\n<td>Red Haze</td>\n<td><span class=\"tchip t-active\">Activ
