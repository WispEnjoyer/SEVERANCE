 staff's element (220 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Searing Line</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>Scorch a line on the ground for 6 s: it Burns, Slows or shocks whoever crosses it</td>\n</tr>\n<tr class=\"odd\">\n<td>Ruinous Burst</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-mana\">300 <small>Mana</small></span></td>\n<td>A burst around you (160 damage) that knocks foes back</td>\n</tr>\n<tr class=\"even\">\n<td>Element Brand</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-mana\">250 <small>Mana</small></span></td>\n<td>Brand a foe: it takes 15% more damage of your staff's element for 10 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Skyrend</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Tear open the sky: 8 s of the element raining over a wide area</td>\n</tr>\n<tr class=\"even\">\n<td>Attuned Wood</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>Emberwood: Burns last 2 s longer. Rimewood: ward absorbs more. Stormwood: arcs reach one more foe</td>\n</tr>\n<tr class=\"odd\">\n<td>Ruinsight</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>+8% Spell Damage while wielding a Destruction Staff</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/restoration-staff": {"id": "weapons/restoration-staff", "title": "Restoration Staff", "sub": "Ranged heals and wards", "group": "combat", "parent": "weapons", "info": [["Hands", "Two-handed"], ["Resource", "Mana"], ["Skill line", "Mending Arts"], ["Fits", "<a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a>, <a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/menders-laurel\">Mender&#x27;s Laurel</a>"]], "card": "Ranged heals and wards", "badge": "Launch", "html": "<p>The Restoration Staff is the healer's weapon. Light attacks fire weak Holy bolts that restore a little Mana when they hit; the heavy channels a beam that heals the ally you aim at. Like the Destruction Staff, it raises a ward instead of blocking.</p>\n<h3 class=\"line\" id=\"s-mending-arts\">Mending Arts</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Sanctum Circle</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>Consecrate the ground: allies standing in it heal for 8 s</td>\n</tr>\n<tr class=\"even\">\n<td>Lingering Grace</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-mana\">280 <small>Mana</small></span></td>\n<td>Heals you and up to 2 wounded allies over 10 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Shelter</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-mana\">300 <small>Mana</small></span></td>\n<td>You and nearby allies take 10% less damage for 8 s</td>\n</tr>\n<tr class=\"even\">\n<td>Purifying Touch</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-mana\">300 <small>Mana</small></span></td>\n<td>Heal an ally and remove up to 2 harmful statuses</td>\n</tr>\n<tr class=\"odd\">\n<td>Lifegiver's Hymn</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">100 <small>Ultimate</small></span></td>\n<td>Raise a fallen ally, or heal everyone nearby for 50% of their max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Wellspring</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>Healing an ally restores 30 Mana (once per second)</td>\n</tr>\n<tr class=\"odd\">\n<td>Hand of Mercy</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>+10% Healing Done while wielding a Restoration Staff</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/scythe": {"id": "weapons/scythe", "title": "Scythe", "sub": "Wide reaping sweeps that drain life", "group": "combat", "parent": "weapons", "info": [["Hands", "Two-handed"], ["Resource", "Stamina"], ["Skill line", "Reaping"], ["Fits", "<a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a>, <a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/harrowed-crescent\">Harrowed Crescent</a>"]], "card": "Wide reaping sweeps that drain life", "badge": "Launch", "html": "<p>The scythe is a slow, wide two-hander that reaps life from everything it cuts. Light attacks are three broad sweeps, and the heavy is a full spin. Each foe struck by a heavy heals you a little, so it grows stronger the more foes surround you. It suits the Necromancer and Blood Maiden.</p>\n<h3 class=\"line\" id=\"s-reaping\">Reaping</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Reap</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>A wide sweep (160 damage) that heals you for 10% of the damage per foe hit</td>\n</tr>\n<tr class=\"even\">\n<td>Grim Hook</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>Hook a foe up to 12 studs away and drag them to you</td>\n</tr>\n<tr class=\"odd\">\n<td>Reaping Mark</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Foes you hit in the next 6 s grant 10 Ultimate and heal you if they die</td>\n</tr>\n<tr class=\"even\">\n<td>Death's Shroud</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>For 6 s, your hits Weaken foes (20% less damage)</td>\n</tr>\n<tr class=\"odd\">\n<td>Reaper's Moon</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Three full spinning reaps (250 damage each) that heal you for 30% of the damage</td>\n</tr>\n<tr class=\"even\">\n<td>Grim Harvest</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>3% of the damage you deal comes back as Health</td>\n</tr>\n<tr class=\"odd\">\n<td>Wide Arc</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>+15% damage when a swing hits 3 or more foes</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/greatsword": {"id": "weapons/greatsword", "title": "Greatsword", "sub": "Slow, armoured swings that break poise", "group": "combat", "parent": "weapons", "info": [["Hands", "Two-handed"], ["Resource", "Stamina"], ["Skill line", "Colossus"], ["Fits", "<a class=\"link\" href=\"#/classes/berserker\">Berserker</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/crowd-breaker\">Crowd-Breaker</a>"]], "card": "Slow, armoured swings that break poise", "badge": "Launch", "html": "<p><strong>Why add it:</strong> the classic heavy two-hander of both games, and the counterpart to the quick katana and daggers. Every swing is slow, armoured and breaks poise fast, so fights become a trade of big moments rather than quick strings. Light attacks are three heavy sweeps, and the heavy is an overhead you can hold to swing harder.</p>\n<h3 class=\"line\" id=\"s-colossus\">Colossus</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Skyward Cleave</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>A rising blow (260 damage) that staggers</td>\n</tr>\n<tr class=\"even\">\n<td>Bull Rush</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Charge 14 studs and stagger the first foe hit</td>\n</tr>\n<tr class=\"odd\">\n<td>Rending Arc</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>A sweep that Bleeds; each repeat within 6 s deepens it</td>\n</tr>\n<tr class=\"even\">\n<td>Iron Stance</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>For 8 s, your light attacks can't be interrupted and each hit grants a small shield</td>\n</tr>\n<tr class=\"odd\">\n<td>Earthsplitter</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>An overhead slam that splits the ground 20 studs ahead (600 damage) and staggers everything in the line</td>\n</tr>\n<tr class=\"even\">\n<td>Weight of Steel</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+20% poise damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Momentum</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>After a heavy attack lands, your next light attack deals 15% more damage</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/bow": {"id": "weapons/bow", "title": "Bow", "sub": "Ranged physical damage and status arrows", "group": "combat", "parent": "weapons", "info": [["Hands", "Two-handed"], ["Resource", "Stamina"], ["Skill line", "Fletcher&#x27;s Eye"], ["Fits", "<a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/sandglass-bow\">Sandglass Bow</a>"]], "card": "Ranged physical damage and status arrows", "badge": "Launch", "html": "<p>Why add it: Severance has no physical ranged option yet, and a bow gives Stamina builds a way to fight at range and pick off casters. Light attacks are quick shots, and holding the heavy draws a charged shot that pierces. A bow can't block, so you dodge and keep your distance. Bows use arrows: you craft them, and they're also a common find in chests, on enemy drops and in other loot. You can switch between broadheads (Bleed) and plain shafts.</p>\n<h3 class=\"line\" id=\"s-fletchers-eye\">Fletcher's Eye</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Longdraw</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>A slow, fully drawn shot that does more damage the farther it flies (200-360 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Rain of Shafts</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">320 <small>Stamina</small></span></td>\n<td>Loose arrows into the sky to fall on a circle 30 studs away for 4 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Pinning Shot</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">260 <small>Stamina</small></span></td>\n<td>Roots the target in place for 2.5 s</td>\n</tr>\n<tr class=\"even\">\n<td>Kick Away</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">220 <small>Stamina</small></span></td>\n<td>Kick the nearest foe back 10 studs and leap backwards</td>\n</tr>\n<tr class=\"odd\">\n<td>Hundred-Arrow Volley</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Fire 12 arrows in 3 s while walking slowly; each one Bleeds</td>\n</tr>\n<tr class=\"even\">\n<td>Steady Hand</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>Charged shots draw 20% faster</td>\n</tr>\n<tr class=\"odd\">\n<td>Hunter's Distance</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>+10% damage to foes more than 20 studs away</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/halberd": {"id": "weapons/halberd", "title": "Halberd", "sub": "Long reach: thrusts and sweeps that keep foes at bay", "group": "combat", "parent": "weapons", "info": [["Hands", "Two-handed"], ["Resource", "Stamina"], ["Skill line", "Long Reach"], ["Fits", "<a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/gatekeepers-reach\">Gatekeeper&#x27;s Reach</a>"]], "card": "Long reach: thrusts and sweeps that keep foes at bay", "badge": "Launch", "html": "<p>Why add it: the longest melee reach in the game. A halberd fighter keeps foes at the tip of the blade and punishes anyone who closes in carelessly. Light attacks alternate thrusts and short sweeps, and the heavy is a wide sweep that knocks foes off their feet. It blocks normally but parries poorly, and it rewards spacing over speed.</p>\n<h3 class=\"line\" id=\"s-long-reach\">Long Reach</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Spearpoint</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">260 <small>Stamina</small></span></td>\n<td>A long thrust that pierces two foes in a line (200 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Hookblade</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>Hook a shield or limb: breaks a raised guard, or pulls the target 6 studs closer</td>\n</tr>\n<tr class=\"odd\">\n<td>Set Against Charge</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">240 <small>Stamina</small></span></td>\n<td>Brace for 3 s: the first foe to rush or leap at you takes double damage and is staggered</td>\n</tr>\n<tr class=\"even\">\n<td>Wheel of Iron</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Spin the halberd around you twice (140 damage each), pushing foes outward</td>\n</tr>\n<tr class=\"odd\">\n<td>Sky-Piercer</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Vault on the haft and drive the blade down where you land (650 damage, knocks down)</td>\n</tr>\n<tr class=\"even\">\n<td>Measured Distance</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+10% damage to foes at the far end of your reach</td>\n</tr>\n<tr class=\"odd\">\n<td>Polearm Drill</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>Heavy attacks cost 15% less Stamina</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/twinblade": {"id": "weapons/twinblade", "title": "Twinblade", "sub": "Spinning combos that hit everything nearby", "group": "combat", "parent": "weapons", "info": [["Hands", "Two-handed"], ["Resource", "Stamina"], ["Skill line", "Whirling Steel"], ["Fits", "<a class=\"link\" href=\"#/classes/berserker\">Berserker</a>, <a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/dervish-edge\">Dervish Edge</a>"]], "card": "Spinning combos that hit everything nearby", "badge": "Launch", "html": "<p>Why add it: a double-ended blade with a spinning moveset nothing else has. It is weak against one foe and strong against many, and its strings flow straight into dodges. Light attacks are a five-cut spinning string, and the heavy is a leaping spin. It blocks poorly.</p>\n<h3 class=\"line\" id=\"s-whirling-steel\">Whirling Steel</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cyclone Cut</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>Spin through foes around you (3 hits of 70 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Mirror Edge</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">240 <small>Stamina</small></span></td>\n<td>For 1 s, deflect projectiles back at their source</td>\n</tr>\n<tr class=\"odd\">\n<td>Dancing Blade</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">260 <small>Stamina</small></span></td>\n<td>Dash through a foe, cutting twice; dodges are free for 3 s after</td>\n</tr>\n<tr class=\"even\">\n<td>Hurricane Step</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>For 6 s, moving fast leaves a ring of cutting wind that damages nearby foes</td>\n</tr>\n<tr class=\"odd\">\n<td>Eye of the Storm</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Become a whirlwind for 5 s: move freely while cutting everything near you 4 times a second</td>\n</tr>\n<tr class=\"even\">\n<td>Unbroken Rhythm</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>Each light attack in a string deals 3% more than the last</td>\n</tr>\n<tr class=\"odd\">\n<td>Graceful Footwork</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>Dodging costs 10% less Stamina</td>\n</tr>\n</tbody>\n</table></div>\n"}, "status-effects": {"id": "status-effects", "title": "Status effects", "group": "combat", "children": [], "lede": "<p>Skills, weapons, poisons and glyphs can apply these effects. Durations and strengths are set by whatever applied them; the rules below apply to all of them.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Effect</th>\n<th>What it does</th>\n<th>Stacking</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bleed</td>\n<td>Physical damage every second</td>\n<td>Reapplying refreshes it; the stronger Bleed wins</td>\n</tr>\n<tr class=\"even\">\n<td>Burn</td>\n<td>Fire damage every second</td>\n<td>Refreshes; Ashkin are immune</td>\n</tr>\n<tr class=\"odd\">\n<td>Poison</td>\n<td>Poison damage every second, usually long-lasting</td>\n<td>Refreshes; Dreadkin are immune</td>\n</tr>\n<tr class=\"even\">\n<td>Slow</td>\n<td>Lowers move speed by a percentage</td>\n<td>The strongest Slow applies</td>\n</tr>\n<tr class=\"odd\">\n<td>Weaken</td>\n<td>The target deals less damage</td>\n<td>The strongest applies</td>\n</tr>\n<tr class=\"even\">\n<td>Vulnerable</td>\n<td>The target takes more damage</td>\n<td>The strongest applies</td>\n</tr>\n<tr class=\"odd\">\n<td>Stagger</td>\n<td>Interrupts the target and opens them to a riposte</td>\n<td>Can't be re-applied while staggered</td>\n</tr>\n<tr class=\"even\">\n<td>Root</td>\n<td>The target can't move but can still attack</td>\n<td>Short; can't be chained</td>\n</tr>\n</tbody>\n</table></div>\n", "html": "<h2 id=\"s-counters\">Counters</h2><ul>\n<li><p><strong>Cleanse:</strong> some heals (such as Restoration skills and the Strong Draught) remove harmful effects.</p></li>\n<li><p><strong>Resist:</strong> the Warded armour trait shortens effects on you; racial passives make some races immune.</p></li>\n<li><p><strong>Unstoppable:</strong> some skills make you immune to staggers for their duration.</p></li>\n<li><p><strong>Damage types:</strong> Physical, Fire, Frost, Shock, Shadow, Holy, Blood, Poison and Necrotic. Each can be boosted by passives and resisted by jewellery glyphs (see <a class=\"link\" href=\"#/enchantments\">Enchantments</a>).</p></li>\n</ul>\n"}, "enchantments": {"id": "enchantments", "title": "Enchantments", "group": "gear", "children": [], "lede": "<p>Every weapon, piece of armour and piece of jewellery has one enchantment slot. Enchanters fill it with a <strong>glyph</strong>. Weapon glyphs trigger when you hit, armour glyphs raise your Health, Mana or Stamina, and jewellery glyphs fine-tune a build. Gear that drops already enchanted can be re-enchanted at any time; the new glyph replaces the old one.</p>\n", "html": "<h2 id=\"s-making-a-glyph\">Making a glyph</h2><p>A glyph is made from three sigils at an enchanting table:</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Sigil</th>\n<th>Decides</th>\n<th>Tiers</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Strength sigil</td>\n<td>How strong the glyph is, and the level it needs</td>\n<td>Faint (1-9), Steady (10-19), Strong (20-34), Fierce (35-49), Ashen (50 to prestige 100), Severed (prestige 150-200)</td>\n</tr>\n<tr class=\"even\">\n<td>Effect sigil</td>\n<td>What the glyph does (see the tables below)</td>\n<td>One per effect</td>\n</tr>\n<tr class=\"odd\">\n<td>Purity sigil</td>\n<td>The glyph's quality</td>\n<td>Dull (Common), Clear (Fine), Bright (Superior), Radiant (Epic), Flawless (Legendary)</td>\n</tr>\n</tbody>\n</table></div>\n<p>Sigils drop from enemies, sit in glowing sigil stones around the world, and come back when you break down glyphs you don't need. Effect sigils for the rarer effects (Hallowed, Shadow, Blood) mostly come from dungeons and trials.</p>\n<h2 id=\"s-how-strong-a-glyph-is\">How strong a glyph is</h2><p>The numbers below are for a Severed strength, Flawless purity glyph: the best possible. Lower glyphs are weaker:</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Strength</th>\n<th>Share of max</th>\n<th></th>\n<th>Purity</th>\n<th>Share of max</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Faint</td>\n<td>20%</td>\n<td></td>\n<td>Dull</td>\n<td>60%</td>\n</tr>\n<tr class=\"even\">\n<td>Steady</td>\n<td>35%</td>\n<td></td>\n<td>Clear</td>\n<td>70%</td>\n</tr>\n<tr class=\"odd\">\n<td>Strong</td>\n<td>50%</td>\n<td></td>\n<td>Bright</td>\n<td>80%</td>\n</tr>\n<tr class=\"even\">\n<td>Fierce</td>\n<td>70%</td>\n<td></td>\n<td>Radiant</td>\n<td>90%</td>\n</tr>\n<tr class=\"odd\">\n<td>Ashen</td>\n<td>85%</td>\n<td></td>\n<td>Flawless</td>\n<td>100%</td>\n</tr>\n<tr class=\"even\">\n<td>Severed</td>\n<td>100%</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>The two multiply: a Strong, Bright glyph is 50% × 80% = 40% of the numbers below.</p>\n<h2 id=\"s-weapon-glyphs\">Weapon glyphs</h2><p>Weapon glyphs trigger on a hit, then rest for 4 seconds before they can trigger again. On a two-handed weapon the effect is 50% stronger, since you only carry one weapon on that bar.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Glyph</th>\n<th>On hit</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Flame</td>\n<td>180 Fire damage and a short Burn</td>\n</tr>\n<tr class=\"even\">\n<td>Frost</td>\n<td>180 Frost damage and Slows by 20% for 2 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Storm</td>\n<td>180 Shock damage that arcs to one nearby foe</td>\n</tr>\n<tr class=\"even\">\n<td>Venom</td>\n<td>Poisons for 240 damage over 6 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Hallowed</td>\n<td>180 Holy damage, doubled against ash-touched foes</td>\n</tr>\n<tr class=\"even\">\n<td>Shadow</td>\n<td>180 Shadow damage, and the target deals 5% less damage for 3 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Blood</td>\n<td>240 Blood damage, but costs you 50 Health</td>\n</tr>\n<tr class=\"even\">\n<td>Leeching</td>\n<td>140 damage, and heals you for the same amount</td>\n</tr>\n<tr class=\"odd\">\n<td>Draining</td>\n<td>140 damage, and restores 120 Mana</td>\n</tr>\n<tr class=\"even\">\n<td>Winding</td>\n<td>140 damage, and restores 120 Stamina</td>\n</tr>\n<tr class=\"odd\">\n<td>Breaking</td>\n<td>25 poise damage</td>\n</tr>\n<tr class=\"even\">\n<td>Sundering</td>\n<td>The target takes 8% more damage for 5 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Withering</td>\n<td>The target deals 10% less damage for 5 s</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Charges:</strong> a weapon glyph holds 150 charges, and each trigger uses one (about 10 minutes of steady fighting). An empty glyph stops working until it's recharged. You recharge it with a <strong>Spark Shard</strong> (one shard refills it fully), which drop from enemies and come from breaking down glyphs, or for gold at any enchanting table. Armour and jewellery glyphs never run out.</p>\n<p><strong>Ash-touched foes:</strong> every creature from the Sixth Realm and every member of Malakor's cult. Hallowed and Ashward work against them.</p>\n<h2 id=\"s-armour-glyphs\">Armour glyphs</h2><p>Big pieces (chest and legs) get the full amount, and the other pieces get 60%.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Glyph</th>\n<th>Bonus (big piece)</th>\n<th>Full armour set</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Vitality</td>\n<td>+200 max Health</td>\n<td>+1,000 max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Clarity</td>\n<td>+180 max Mana</td>\n<td>+900 max Mana</td>\n</tr>\n<tr class=\"odd\">\n<td>Endurance</td>\n<td>+180 max Stamina</td>\n<td>+900 max Stamina</td>\n</tr>\n<tr class=\"even\">\n<td>Bulwark</td>\n<td>+3 Poise</td>\n<td>+15 Poise</td>\n</tr>\n</tbody>\n</table></div>\n<p>A full set is 2 big and 5 small pieces. For scale, a level 50 character has about 7,000 Health, so a full set of Vitality glyphs adds about 15%.</p>\n<h2 id=\"s-jewellery-glyphs\">Jewellery glyphs</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Glyph</th>\n<th>Bonus</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Renewal</td>\n<td>+10% Health regeneration</td>\n</tr>\n<tr class=\"even\">\n<td>Flowing Mind</td>\n<td>+10% Mana regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>Steady Breath</td>\n<td>+10% Stamina regeneration</td>\n</tr>\n<tr class=\"even\">\n<td>Keen Edge</td>\n<td>+4% weapon damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Deep Weave</td>\n<td>+4% Spell Damage</td>\n</tr>\n<tr class=\"even\">\n<td>Mercy</td>\n<td>+5% healing done</td>\n</tr>\n<tr class=\"odd\">\n<td>Thrift (Mana)</td>\n<td>Mana skills cost 5% less</td>\n</tr>\n<tr class=\"even\">\n<td>Thrift (Stamina)</td>\n<td>Stamina skills cost 5% less</td>\n</tr>\n<tr class=\"odd\">\n<td>Steady Guard</td>\n<td>Blocking costs 8% less</td>\n</tr>\n<tr class=\"even\">\n<td>Light Step</td>\n<td>Dodging costs 8% less</td>\n</tr>\n<tr class=\"odd\">\n<td>Emberward</td>\n<td>Take 8% less Fire damage</td>\n</tr>\n<tr class=\"even\">\n<td>Frostward</td>\n<td>Take 8% less Frost damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Stormward</td>\n<td>Take 8% less Shock damage</td>\n</tr>\n<tr class=\"even\">\n<td>Venomward</td>\n<td>Take 8% less Poison damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Ashward</td>\n<td>Take 8% less damage from ash-touched foes</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-enchanting-tips\">Enchanting tips</h2><ul>\n<li><p><strong>Match your resource:</strong> Mana builds want Clarity on armour and Thrift (Mana) on jewellery; Stamina builds want Endurance and Thrift (Stamina). Tanks lean on Vitality and Bulwark.</p></li>\n<li><p><strong>Two bars, two glyphs:</strong> your back-bar weapon has its own glyph, so you can carry two different weapon effects and swap between them.</p></li>\n<li><p><strong>Ashward</strong> only helps against enemies from the Sixth Realm, but that covers most of the endgame.</p></li>\n</ul>\n<details class=\"devnotes\" id=\"s-design-decisions\"><summary>Design notes</summary><ul>\n<li><p><strong>Glyph wear:</strong> weapon glyphs use charges and need recharging with Spark Shards or gold. Armour and jewellery glyphs don't wear.</p></li>\n<li><p><strong>Ash-touched foes:</strong> all Sixth Realm creatures and Malakor's cult.</p></li>\n</ul>\n</details>"}, "crafting": {"id": "crafting", "title": "Crafting", "group": "gear", "children": [], "lede": "<p>Anything worth wearing in Severance can be made by hand. There are seven crafts, and every character can learn all of them. Crafting is how you get the 12 crafted item sets, choose exactly which trait each piece carries, and keep your gear at its best quality.</p>\n", "html": "<h2 id=\"s-the-seven-crafts\">The seven crafts</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Craft</th>\n<th>Makes</th>\n<th>Materials</th>\n<th>Passives</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blacksmithing</td>\n<td>Heavy armour; Katana, Longsword, Greatsword, Daggers, Halberd, Twinblade, Scythe</td>\n<td>Ore and metal</td>\n<td>Metalworking, Quench and Polish</td>\n</tr>\n<tr class=\"even\">\n<td>Clothing</td>\n<td>Light armour (cloth) and medium armour (leather)</td>\n<td>Fibres and hides</td>\n<td>Tailoring, Leatherworking</td>\n</tr>\n<tr class=\"odd\">\n<td>Woodworking</td>\n<td>Destruction and Restoration Staves, Bows, arrows, shields</td>\n<td>Wood</td>\n<td>Carpentry, Sap and Varnish</td>\n</tr>\n<tr class=\"even\">\n<td>Alchemy</td>\n<td>Potions, poisons, Flask tinctures</td>\n<td>Reagents and solvents</td>\n<td>Steady Mortar, Healer's Measure</td>\n</tr>\n<tr class=\"odd\">\n<td>Enchanting</td>\n<td>Glyphs that enchant weapons and armour</td>\n<td>Sigils</td>\n<td>Glyph Carving, Deep Runes</td>\n</tr>\n<tr class=\"even\">\n<td>Cooking</td>\n<td>Food and drink buffs</td>\n<td>Ingredients</td>\n<td>Open Flame, Hearty Appetite</td>\n</tr>\n<tr class=\"odd\">\n<td>Jewelcrafting</td>\n<td>Rings and necklaces</td>\n<td>Precious metal and gems</td>\n<td>Gemcutting, Fine Settings</td>\n</tr>\n</tbody>\n</table></div>\n<p>Each craft levels up as you use it, from 1 to 50. Crafting levels unlock better material tiers and earn points for that craft's passives.</p>\n<h2 id=\"s-armour-weights\">Armour weights</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Weight</th>\n<th>Craft</th>\n<th>Suits</th>\n<th>Bonus per piece worn</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Light (cloth)</td>\n<td>Clothing</td>\n<td>Mana builds</td>\n<td>+2% Mana regeneration</td>\n</tr>\n<tr class=\"even\">\n<td>Medium (leather)</td>\n<td>Clothing</td>\n<td>Stamina builds</td>\n<td>+2% Stamina regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>Heavy (metal)</td>\n<td>Blacksmithing</td>\n<td>Tanks</td>\n<td>+2% max Health</td>\n</tr>\n</tbody>\n</table></div>\n<p>Any class can wear any weight, and mixing weights is allowed.</p>\n<h2 id=\"s-jewellery\">Jewellery</h2><p>Every character wears <strong>one necklace and two rings</strong> alongside their armour. Jewellery counts toward item sets like any other piece, so a 5-piece set can mix armour, weapons and jewellery. Jewelcrafters make it from precious metal, and jewellery takes its own traits and enchantments.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Tier</th>\n<th>Levels</th>\n<th>Metal</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>1-9</td>\n<td>Copper</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>10-19</td>\n<td>Silver</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>20-34</td>\n<td>Electrum</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>35-49</td>\n<td>Moongold</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>50 to prestige 100</td>\n<td>Ashgold</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Prestige 150-200</td>\n<td>Severed Gold</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Jewellery traits:</strong></p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Trait</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Focused</td>\n<td>+4% Spell Damage and weapon damage</td>\n</tr>\n<tr class=\"even\">\n<td>Hale</td>\n<td>+8% Health regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>Spirited</td>\n<td>+8% Mana regeneration</td>\n</tr>\n<tr class=\"even\">\n<td>Driven</td>\n<td>+8% Stamina regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>Grounded</td>\n<td>+8 Poise</td>\n</tr>\n<tr class=\"even\">\n<td>Quickened</td>\n<td>+3% move speed</td>\n</tr>\n<tr class=\"odd\">\n<td>Scholar's</td>\n<td>+10% XP</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Jewellery quality</strong> is improved with Polishing Grit (Fine), Gem Settings (Superior), Gold Leaf (Epic) and Flawless Gems (Legendary).</p>\n<h2 id=\"s-materials\">Materials</h2><p>Materials are gathered from nodes in the world (ore veins, flax and silk plants, hides from beasts, fallen logs) and from breaking down gear you don't need. Each tier covers a range of levels:</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Tier</th>\n<th>Levels</th>\n<th>Metal</th>\n<th>Cloth</th>\n<th>Leather</th>\n<th>Wood</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>1-9</td>\n<td>Iron</td>\n<td>Flax</td>\n<td>Rawhide</td>\n<td>Birch</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>10-19</td>\n<td>Steel</td>\n<td>Wool</td>\n<td>Hide</td>\n<td>Oak</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>20-34</td>\n<td>Blacksteel</td>\n<td>Silk</td>\n<td>Thickhide</td>\n<td>Yew</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>35-49</td>\n<td>Skyiron</td>\n<td>Moonsilk</td>\n<td>Wyrmhide</td>\n<td>Elderroot</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>50 to prestige 100</td>\n<td>Ashsteel</td>\n<td>Ashweave</td>\n<td>Ashhide</td>\n<td>Ashwood</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Prestige 150-200</td>\n<td>Severed Steel</td>\n<td>Veilsilk</td>\n<td>Sovereign Hide</td>\n<td>Heartwood</td>\n</tr>\n</tbody>\n</table></div>\n<p>Tier 5 and 6 materials come mostly from the Sixth Realm and the endgame, since that's where the ash is.</p>\n<h2 id=\"s-traits-and-research\">Traits and research</h2><p>Every crafted weapon or piece of armour carries one <strong>trait</strong>. You can only craft a trait you've researched for that piece, such as \"Keen on a Katana\".</p>\n<p><strong>Researching:</strong> you sacrifice an item that has the trait at a crafting station to research it. Each craft can research 3 traits at once. The first trait on a piece takes 2 hours, and each further trait on that same piece takes longer, up to 24 hours. Research keeps going while you're offline.</p>\n<p><strong>Weapon traits:</strong></p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Trait</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Keen</td>\n<td>+5% weapon and spell damage</td>\n</tr>\n<tr class=\"even\">\n<td>Balanced</td>\n<td>Skills cost 4% less</td>\n</tr>\n<tr class=\"odd\">\n<td>Heavy</td>\n<td>+15% poise damage</td>\n</tr>\n<tr class=\"even\">\n<td>Thirsting</td>\n<td>Heal for 2% of damage dealt</td>\n</tr>\n<tr class=\"odd\">\n<td>Fevered</td>\n<td>Your status effects last 20% longer</td>\n</tr>\n<tr class=\"even\">\n<td>Guarding</td>\n<td>Blocking costs 10% less</td>\n</tr>\n<tr class=\"odd\">\n<td>Scholar's</td>\n<td>+10% XP (for levelling alts)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Armour traits:</strong></p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Trait</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Hardened</td>\n<td>+6% armour</td>\n</tr>\n<tr class=\"even\">\n<td>Warded</td>\n<td>Status effects on you last 15% shorter</td>\n</tr>\n<tr class=\"odd\">\n<td>Fitted</td>\n<td>Dodging and sprinting cost 6% less</td>\n</tr>\n<tr class=\"even\">\n<td>Vital</td>\n<td>+2% max Health</td>\n</tr>\n<tr class=\"odd\">\n<td>Lucid</td>\n<td>+2% max Mana</td>\n</tr>\n<tr class=\"even\">\n<td>Tireless</td>\n<td>+2% max Stamina</td>\n</tr>\n<tr class=\"odd\">\n<td>Scholar's</td>\n<td>+10% XP</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Crafted sets:</strong> each of the 12 crafted sets has its own station somewhere in the world, and needs a number of traits researched on the piece before you can craft it: from 2 traits for the simplest sets up to 9 for the strongest.</p>\n<h2 id=\"s-quality\">Quality</h2><p>Crafted gear starts at Common quality and can be improved with improvement materials. Each step up raises the item's base stats.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Quality</th>\n<th>Colour</th>\n<th>Blacksmithing</th>\n<th>Clothing</th>\n<th>Woodworking</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Common</td>\n<td>White</td>\n<td>-</td>\n<td>-</td>\n<td>-</td>\n</tr>\n<tr class=\"even\">\n<td>Fine</td>\n<td>Green</td>\n<td>Whetgrit</td>\n<td>Waxed Thread</td>\n<td>Pine Pitch</td>\n</tr>\n<tr class=\"odd\">\n<td>Superior</td>\n<td>Blue</td>\n<td>Quench Oil</td>\n<td>Fine Lining</td>\n<td>Linseed Varnish</td>\n</tr>\n<tr class=\"even\">\n<td>Epic</td>\n<td>Purple</td>\n<td>Fine Flux</td>\n<td>Silver Stitching</td>\n<td>Amber Resin</td>\n</tr>\n<tr class=\"odd\">\n<td>Legendary</td>\n<td>Gold</td>\n<td>Emberforge Alloy</td>\n<td>Gilded Embroidery</td>\n<td>Heartwood Lacquer</td>\n</tr>\n</tbody>\n</table></div>\n<p>Each improvement has a chance to succeed that rises with the number of materials you use, up to a guaranteed success. Breaking down gear returns some improvement materials. Legendary materials are rare, and mostly come from Commissions and trials.</p>\n<h2 id=\"s-alchemy\">Alchemy</h2><p>Alchemists mix two or three <strong>reagents</strong> (plants, fungi and monster parts) with a <strong>solvent</strong>. Water makes a potion and oil makes a poison. Every reagent has hidden effects you discover by tasting it or combining it; a mix gets the effects its reagents share.</p>\n<ul>\n<li><p><strong>Potions</strong> restore Health, Mana or Stamina, or give short buffs such as more damage, Poison immunity or faster movement.</p></li>\n<li><p><strong>Poisons</strong> coat your weapon for a number of hits and apply their effect (Poison, Slow, Weaken, drain) to whatever you hit.</p></li>\n<li><p><strong>Flask tinctures</strong> add a bonus to your Flask for an hour, such as \"each Flask sip also restores 20 Stamina\". Your Flask still refills at shrines as normal.</p></li>\n</ul>\n<h2 id=\"s-woodworking-arrows\">Woodworking: arrows</h2><p>Bows use arrows, which woodworkers fletch in batches from wood and feathers: plain shafts, and broadheads that cause Bleed. Arrows are also a common find on enemies and in chests.</p>\n<h2 id=\"s-enchanting\">Enchanting</h2><p>Enchanters combine three <strong>sigils</strong> into a glyph and apply it to a weapon or piece of armour:</p>\n<ul>\n<li><p><strong>Strength sigil:</strong> sets the glyph's level and how strong it is.</p></li>\n<li><p><strong>Effect sigil:</strong> sets what it does, such as Fire damage on a weapon or more max Health on armour.</p></li>\n<li><p><strong>Purity sigil:</strong> sets the glyph's quality, from Common to Legendary.</p></li>\n</ul>\n<p>Weapon glyphs trigger on hit, and armour glyphs give a lasting bonus. The full list of enchantments and their numbers is on the <a class=\"link\" href=\"#/enchantments\">Enchantments</a> page.</p>\n<h2 id=\"s-cooking\">Cooking</h2><p>Cooks make food and drink from ingredients found in the world and bought from merchants. Recipes are learned from books found in chests and from vendors.</p>\n<ul>\n<li><p><strong>Food</strong> raises max Health, Mana or Stamina for 1 hour.</p></li>\n<li><p><strong>Drink</strong> raises Health, Mana or Stamina regeneration for 1 hour.</p></li>\n<li><p>You can have one food or drink buff at a time; the best dishes (Legendary quality) raise two or three stats at once.</p></li>\n</ul>\n<h2 id=\"s-crafting-passives\">Crafting passives</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Craft</th>\n<th>Passive</th>\n<th>Ranks</th>\n<th>Effect at max rank</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blacksmithing</td>\n<td>Metalworking</td>\n<td>3</td>\n<td>Unlocks higher metal tiers and gives more materials from breaking down metal gear</td>\n</tr>\n<tr class=\"even\">\n<td>Blacksmithing</td>\n<td>Quench and Polish</td>\n<td>3</td>\n<td>Improving metal gear needs 40% fewer materials</td>\n</tr>\n<tr class=\"odd\">\n<td>Clothing</td>\n<td>Tailoring</td>\n<td>3</td>\n<td>Unlocks higher cloth and leather tiers</td>\n</tr>\n<tr class=\"even\">\n<td>Clothing</td>\n<td>Leatherworking</td>\n<td>3</td>\n<td>Improving cloth and leather gear needs 40% fewer materials</td>\n</tr>\n<tr class=\"odd\">\n<td>Woodworking</td>\n<td>Carpentry</td>\n<td>3</td>\n<td>Unlocks higher wood tiers; fletches 50% more arrows</td>\n</tr>\n<tr class=\"even\">\n<td>Woodworking</td>\n<td>Sap and Varnish</td>\n<td>3</td>\n<td>Improving wooden gear needs 40% fewer materials</td>\n</tr>\n<tr class=\"odd\">\n<td>Alchemy</td>\n<td>Steady Mortar</td>\n<td>3</td>\n<td>Each mix makes 2 extra potions or poisons</td>\n</tr>\n<tr class=\"even\">\n<td>Alchemy</td>\n<td>Healer's Measure</td>\n<td>3</td>\n<td>Restoring potions are 25% stronger</td>\n</tr>\n<tr class=\"odd\">\n<td>Enchanting</td>\n<td>Glyph Carving</td>\n<td>3</td>\n<td>Unlocks higher-level glyphs</td>\n</tr>\n<tr class=\"even\">\n<td>Enchanting</td>\n<td>Deep Runes</td>\n<td>3</td>\n<td>Glyphs you make are 15% stronger</td>\n</tr>\n<tr class=\"odd\">\n<td>Cooking</td>\n<td>Open Flame</td>\n<td>3</td>\n<td>Unlocks better recipes</td>\n</tr>\n<tr class=\"even\">\n<td>Cooking</td>\n<td>Hearty Appetite</td>\n<td>3</td>\n<td>Food and drink buffs last 2 hours</td>\n</tr>\n<tr class=\"odd\">\n<td>Jewelcrafting</td>\n<td>Gemcutting</td>\n<td>3</td>\n<td>Unlocks higher jewellery tiers and gives more materials from breaking down jewellery</td>\n</tr>\n<tr class=\"even\">\n<td>Jewelcrafting</td>\n<td>Fine Settings</td>\n<td>3</td>\n<td>Improving jewellery needs 40% fewer materials</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-commissions\">Commissions</h2><p>Each day, every craft's guildmaster in town posts a <strong>Commission</strong>: a short crafting job, such as \"make 2 Fine iron daggers\". Completing it pays gold, crafting XP and a reward chest that can contain rare improvement materials and recipes.</p>\n<h2 id=\"s-crafting-for-others\">Crafting for others</h2><p>Players can craft for each other. A crafter can make any piece they know (set, trait, quality) and hand it to another player. Crafted gear can be traded until it's equipped, then it binds to the character wearing it. This lets dedicated crafters run a business: take an order, get the materials, and charge for their research time.</p>\n<h2 id=\"s-crafting-at-home\">Crafting at home</h2><p>Players can place crafting stations in their homes. A station for each of the seven crafts can be bought or crafted. A <strong>set station</strong> for one of the 12 crafted sets can be placed once you've found that station in the world.</p>\n<details class=\"devnotes\" id=\"s-design-decisions\"><summary>Design notes</summary><ul>\n<li><p><strong>Jewellery:</strong> yes. One necklace and two rings, made by a seventh craft, Jewelcrafting.</p></li>\n<li><p><strong>Crafting for others:</strong> yes. Crafted gear is tradeable until it's equipped.</p></li>\n<li><p><strong>Homes:</strong> yes. Players can place crafting stations, including set stations they've discovered, in their homes.</p></li>\n</ul>\n</details>"}}};

/* ================= SCENES: procedural SVG art per page ================= */
const SW=1200, SH=340;
function rng(seed){ let s=2166136261; for(const c of String(seed)) s=Math.imul(s^c.charCodeAt(0),16777619)>>>0; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
const f1 = n => (+n).toFixed(1);
let GID=0, CUR=0;
const fid = n => `${n}${CUR}`;            // per-scene filter id
const BLUR = n => `filter="url(#${fid("b"+n)})"`;

/* ---------- basic shapes ---------- */
function hills(r, base, amp, color, op=1, step=150){
  let px=0, py=base-amp*r(), d=`M-20,${SH} L-20,${f1(py)} L0,${f1(py)}`;
  for(let x=step; x<=SW+step; x+=step){ const y=base-amp*r(); d+=` C${f1(px+step*.5)},${f1(py)} ${f1(x-step*.5)},${f1(y)} ${x},${f1(y)}`; px=x; py=y; }
  return `<path d="${d} L${SW+20},${SH} Z" fill="${color}" opacity="${op}"/>`;
}
function crags(r, base, amp, color, op=1, step=60){
  let d=`M-20,${SH} L-20,${base}`;
  for(let x=0; x<=SW+step; x+=step){ const peak=base-amp*(.3+.7*r()); d+=` L${f1(x+step*.35)},${f1(peak)} L${f1(x+step*.55)},${f1(peak+amp*.12*r())} L${f1(x+step)},${f1(base-amp*.25*r())}`; }
  return `<path d="${d} L${SW+20},${SH} Z" fill="${color}" opacity="${op}" stroke-linejoin="round"/>`;
}
function glow(cx, cy, rad, color, op=.55){
  const id="g"+(GID++);
  return `<defs><radialGradient id="${id}"><stop offset="0" stop-color="${color}" stop-opacity="${op}"/><stop offset=".45" stop-color="${color}" stop-opacity="${op*.35}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient></defs><circle cx="${cx}" cy="${cy}" r="${rad}" fill="url(#${id})"/>`;
}
function moon(cx, cy, rad, color, halo){
  const id="m"+(GID++);
  return glow(cx,cy,rad*4.5,halo||color,.32)+
   `<defs><radialGradient id="${id}" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="${color}" stop-opacity="0"/></radialGradient></defs>`+
   `<circle cx="${cx}" cy="${cy}" r="${rad}" fill="${color}"/><circle cx="${cx}" cy="${cy}" r="${rad}" fill="url(#${id})"/>`+
   `<circle cx="${f1(cx+rad*.32)}" cy="${f1(cy-rad*.18)}" r="${f1(rad*.16)}" fill="#000" opacity=".08"/><circle cx="${f1(cx-rad*.3)}" cy="${f1(cy+rad*.32)}" r="${f1(rad*.11)}" fill="#000" opacity=".07"/><circle cx="${f1(cx+rad*.1)}" cy="${f1(cy+rad*.45)}" r="${f1(rad*.07)}" fill="#000" opacity=".06"/>`;
}
function stars(r, n, color, maxY=SH*.62){
  let s=""; for(let i=0;i<n;i++){ const x=r()*SW, y=r()*maxY, rr=r()*1.2+.35; s+=`<circle class="tw" style="animation-delay:${f1(r()*4)}s" cx="${f1(x)}" cy="${f1(y)}" r="${f1(rr)}" fill="${color}" opacity="${f1(.3+r()*.6)}"/>`; }
  return s;
}
function smoke(r, color, n=5, op=.18){
  let s=`<g class="smoke" ${BLUR(18)}>`; for(let i=0;i<n;i++){ const x=r()*SW, y=50+r()*150; s+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(170+r()*220)}" ry="${f1(22+r()*26)}" fill="${color}" opacity="${f1(op*(.6+r()*.6))}"/>`; } return s+`</g>`;
}
function fog(y, color, op=.5, cls="fog"){
  const id="f"+(GID++);
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0"/><stop offset="1" stop-color="${color}" stop-opacity="${op}"/></linearGradient></defs><rect class="${cls}" x="-200" y="${y}" width="${SW+400}" height="${SH-y}" fill="url(#${id})"/>`;
}
function shafts(r, color, n=6, op=.10){
  let s=`<g class="rays" style="transform-origin:600px -60px" ${BLUR(6)}>`;
  for(let i=0;i<n;i++){ const x=120+r()*960, w=30+r()*60, sk=140+r()*120;
    s+=`<polygon points="${f1(x)},-10 ${f1(x+w)},-10 ${f1(x+w+sk)},${SH} ${f1(x+sk)},${SH}" fill="${color}" opacity="${f1(op*(.6+r()*.8))}"/>`; }
  return s+`</g>`;
}

/* ---------- forests ---------- */
function elfTree(r, x, base, h, color, rim){
  const tb=h*.05, tt=h*.018, top=base-h*.66;
  let s=`<path d="M${f1(x-tb*2.4)},${base} C${f1(x-tb)},${f1(base-h*.03)} ${f1(x-tb)},${f1(base-h*.12)} ${f1(x-tb*.85)},${f1(base-h*.2)} L${f1(x-tt)},${f1(top)} L${f1(x+tt)},${f1(top)} L${f1(x+tb*.85)},${f1(base-h*.2)} C${f1(x+tb)},${f1(base-h*.12)} ${f1(x+tb)},${f1(base-h*.03)} ${f1(x+tb*2.4)},${base} Z" fill="${color}"/>`;
  const cy=base-h*.79, R=h*.27, blobs=[];
  for(let i=0;i<22;i++){ const a=r()*Math.PI*2, d=Math.sqrt(r()); blobs.push([x+Math.cos(a)*d*R*1.15, cy+Math.sin(a)*d*R*.72, R*(.22+r()*.2)]); }
  blobs.push([x,cy,R*.55]);
  if(rim) s+=`<g fill="${rim}" opacity=".28">`+blobs.map(([bx,by,br])=>`<circle cx="${f1(bx-R*.06)}" cy="${f1(by-R*.08)}" r="${f1(br)}"/>`).join("")+`</g>`;
  s+=`<g fill="${color}">`+blobs.map(([bx,by,br])=>`<circle cx="${f1(bx)}" cy="${f1(by)}" r="${f1(br)}"/>`).join("")+`</g>`;
  // drooping branches from crown edge
  s+=`<g stroke="${color}" stroke-width="${f1(h*.012)}" fill="none" stroke-linecap="round">`;
  for(let i=0;i<4;i++){ const sx=x+(r()-.5)*R*1.8, sy=cy+R*.45; s+=`<path d="M${f1(sx)},${f1(sy)} q${f1((r()-.5)*10)},${f1(h*.08)} ${f1((r()-.5)*14)},${f1(h*.14+r()*h*.06)}"/>`; }
  s+=`</g>`;
  return s;
}
function ferns(r, base, color, n=40){
  let s=`<g fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round">`;
  for(let i=0;i<n;i++){ const x=r()*SW, h=12+r()*26, lean=(r()-.5)*24; s+=`<path d="M${f1(x)},${base} Q${f1(x+lean*.3)},${f1(base-h*.6)} ${f1(x+lean)},${f1(base-h)}"/>`; }
  return s+`</g>`;
}
function forest(r, p){
  // p: {sky tint colors}, far, mid, near, rim, fogc, light
  let s = shafts(r, p.light, 7, .09);
  s += `<g ${BLUR(2)} opacity=".55">`; for(let i=0;i<11;i++) s+=elfTree(r, i*120+r()*60-30, 285, 150+r()*70, p.far); s+=`</g>`;
  s += fog(150, p.fogc, .55);
  for(let i=0;i<8;i++) s+=elfTree(r, i*165+r()*70-20, 312, 210+r()*80, p.mid, p.rim);
  s += fog(230, p.fogc, .35);
  s += elfTree(r, 40, 352, 420, p.near, p.rim) + elfTree(r, 1170, 352, 400, p.near, p.rim);
  s += hills(r, 322, 10, p.near, 1, 200) + ferns(r, 326, p.near, 50);
  return s;
}

/* ---------- buildings ---------- */
function spire(x, base, h, w, color, win){
  const roofH=w*2.8;
  let s=`<path d="M${f1(x-w/2)},${base} L${f1(x-w/2)},${f1(base-h)} L${f1(x-w*.62)},${f1(base-h)} L${f1(x)},${f1(base-h-roofH)} L${f1(x+w*.62)},${f1(base-h)} L${f1(x+w/2)},${f1(base-h)} L${f1(x+w/2)},${base} Z" fill="${color}"/>`;
  if(win) for(let y=base-h*.32; y>base-h*.95; y-=h*.24) s+=`<rect class="win" x="${f1(x-w*.11)}" y="${f1(y)}" width="${f1(w*.22)}" height="${f1(w*.46)}" rx="${f1(w*.11)}" fill="${win}"/>`;
  return s;
}
function castle(r, x0, x1, base, color, win){
  const wallH=44; let d=`M${x0},${base} L${x0},${base-wallH}`;
  for(let x=x0; x<x1; x+=18) d+=` L${x},${base-wallH-8} L${x+10},${base-wallH-8} L${x+10},${base-wallH} L${x+18},${base-wallH}`;
  d+=` L${x1},${base} Z`;
  let s=`<path d="${d}" fill="${color}"/>`;
  const towers=[x0+18, x0+(x1-x0)*.3, x0+(x1-x0)*.52, x0+(x1-x0)*.76, x1-18];
  towers.forEach((tx,i)=>{ const keep=i===2, th=keep?150:84+r()*34, tw=keep?64:38;
    let t=`M${f1(tx-tw/2)},${base} L${f1(tx-tw/2)},${f1(base-th)}`;
    for(let k=0;k<4;k++){ const sx=tx-tw/2+k*tw/4; t+=` L${f1(sx)},${f1(base-th-9)} L${f1(sx+tw/8)},${f1(base-th-9)} L${f1(sx+tw/8)},${f1(base-th)} L${f1(sx+tw/4)},${f1(base-th)}`; }
    t+=` L${f1(tx+tw/2)},${base} Z`; s+=`<path d="${t}" fill="${color}"/>`;
    if(win){ s+=`<rect class="win" x="${f1(tx-3.5)}" y="${f1(base-th+24)}" width="7" height="13" rx="3.5" fill="${win}"/>`; if(keep) s+=`<rect class="win" style="animation-delay:-2s" x="${f1(tx-3.5)}" y="${f1(base-th+62)}" width="7" height="13" rx="3.5" fill="${win}"/>`; }
    if(keep) s+=`<path d="M${f1(tx)},${f1(base-th-9)} L${f1(tx)},${f1(base-th-46)}" stroke="${color}" stroke-width="3"/><path class="flag" d="M${f1(tx+1)},${f1(base-th-46)} q14,4 26,1 q-6,7 2,15 q-14,-3 -28,0 Z" fill="${color}"/>`;
  });
  return s;
}
function house(x, base, w, color, win){
  const h=w*.6;
  return glow(x+w/2, base-h*.45, w*.75, win, .28)+`<path d="M${x},${base} L${x},${f1(base-h)} L${f1(x+w/2)},${f1(base-h-w*.4)} L${x+w},${f1(base-h)} L${x+w},${base} Z" fill="${color}"/><rect x="${f1(x+w*.66)}" y="${f1(base-h-w*.36)}" width="${f1(w*.09)}" height="${f1(w*.26)}" fill="${color}"/>`+
    `<rect class="win" x="${f1(x+w*.18)}" y="${f1(base-h*.68)}" width="${f1(w*.16)}" height="${f1(w*.17)}" rx="2" fill="${win}"/><rect class="win" style="animation-delay:-2.5s" x="${f1(x+w*.62)}" y="${f1(base-h*.68)}" width="${f1(w*.16)}" height="${f1(w*.17)}" rx="2" fill="${win}"/><path d="M${f1(x+w*.41)},${base} L${f1(x+w*.41)},${f1(base-h*.38)} A${f1(w*.09)},${f1(w*.09)} 0 0 1 ${f1(x+w*.59)},${f1(base-h*.38)} L${f1(x+w*.59)},${base} Z" fill="${win}" opacity=".75"/>`;
}

/* ---------- fire ---------- */
function flames(r, base, h, count, hot, mid, cool){
  const id="fl"+(GID++);
  let s=`<defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${hot}"/><stop offset=".45" stop-color="${mid}"/><stop offset="1" stop-color="${cool}" stop-opacity="0"/></linearGradient></defs>`;
  s+=glow(SW/2, base, SW*.6, mid, .45);
  const tongue=(x,hh,w,cls,dl,du)=>`<path class="${cls}" style="animation-delay:${f1(dl)}s;animation-duration:${f1(du)}s;transform-origin:${f1(x)}px ${base}px" d="M${f1(x-w)},${base} C${f1(x-w*1.15)},${f1(base-hh*.32)} ${f1(x-w*.35)},${f1(base-hh*.5)} ${f1(x-w*.25)},${f1(base-hh*.7)} S${f1(x+(r()-.5)*w*.9)},${f1(base-hh*.88)} ${f1(x+(r()-.5)*w*.6)},${f1(base-hh)} C${f1(x+w*.45)},${f1(base-hh*.72)} ${f1(x+w*1.1)},${f1(base-hh*.4)} ${f1(x+w)},${base} Z" fill="url(#${id})"/>`;
  s+=`<g ${BLUR(3)} opacity=".8">`; for(let i=0;i<count;i++){ const x=(i+.5)/count*SW+(r()-.5)*30; s+=tongue(x,h*(.6+r()*.6),34+r()*34,"fl",-r()*2,1.6+r()*1.4); } s+=`</g>`;
  s+=`<g>`; for(let i=0;i<count*.8;i++){ const x=r()*SW; s+=tongue(x,h*(.35+r()*.45),18+r()*22,"fl",-r()*2,1.1+r()*1); } s+=`</g>`;
  return s;
}
function volcano(r, cx, base, h, color, lava){
  const w=h*2.1;
  return glow(cx, base-h, h*1.1, lava, .55) +
   `<path d="M${f1(cx-w)},${base} C${f1(cx-w*.5)},${f1(base-h*.35)} ${f1(cx-w*.25)},${f1(base-h*.9)} ${f1(cx-w*.14)},${f1(base-h)} Q${f1(cx)},${f1(base-h+12)} ${f1(cx+w*.14)},${f1(base-h)} C${f1(cx+w*.25)},${f1(base-h*.9)} ${f1(cx+w*.5)},${f1(base-h*.35)} ${f1(cx+w)},${base} Z" fill="${color}"/>` +
   `<g ${BLUR(1)}><path class="lava" d="M${f1(cx-8)},${f1(base-h+6)} C${f1(cx-20)},${f1(base-h*.7)} ${f1(cx-50)},${f1(base-h*.45)} ${f1(cx-70)},${f1(base-h*.2)} S${f1(cx-110)},${f1(base-h*.05)} ${f1(cx-130)},${base}" stroke="${lava}" stroke-width="4.5" fill="none" stroke-linecap="round"/>` +
   `<path class="lava" style="animation-delay:-1.3s" d="M${f1(cx+10)},${f1(base-h+8)} C${f1(cx+26)},${f1(base-h*.7)} ${f1(cx+50)},${f1(base-h*.4)} ${f1(cx+80)},${f1(base-h*.15)}" stroke="${lava}" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>` +
   `<ellipse cx="${cx}" cy="${f1(base-h+3)}" rx="${f1(w*.12)}" ry="5" fill="${lava}" opacity=".9"/>`;
}
function brazier(x, base, color){
  const id="br"+(GID++);
  return glow(x, base-60, 130, "#ff7a2b", .5)+`<defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#ff7a2b"/><stop offset="1" stop-color="#c2241a" stop-opacity="0"/></linearGradient></defs>`+
   `<path class="fl" style="transform-origin:${x}px ${base-40}px;animation-duration:1.3s" d="M${x-30},${base-40} C${x-34},${base-80} ${x-8},${base-96} ${x},${base-130} C${x+8},${base-96} ${x+34},${base-80} ${x+30},${base-40} Z" fill="url(#${id})"/>`+
   `<path class="fl" style="transform-origin:${x}px ${base-40}px;animation-duration:.9s;animation-delay:-.4s" d="M${x-16},${base-40} C${x-18},${base-62} ${x-4},${base-72} ${x},${base-92} C${x+4},${base-72} ${x+18},${base-62} ${x+16},${base-40} Z" fill="#ffe08a" opacity=".85"/>`+

function deadTree(r, x, base, h, color){

    s+=`<path d="M${f1(x1)},${f1(y1)} Q${f1(mx)},${f1(my)} ${f1(x2)},${f1(y2)}" stroke-width="${f1(wd)}"/>`;
    br(x2,y2,len*(.6+r()*.15),ang-.42-r()*.3,wd*.6,d+1); br(x2,y2,len*(.58+r()*.15),ang+.34+r()*.3,wd*.6,d+1); };

}
function runeCircle(cx, cy, rad, color, spin, rev){

  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, x=cx+Math.cos(a)*rad*.92, y=cy+Math.sin(a)*rad*.92, k=i%4;
    const g=["M-4,-5 L0,5 L4,-5","M-4,-5 L-4,5 M-4,0 L4,-5 M-4,0 L4,5","M0,-6 L0,6 M-4,-2 L4,2","M-4,5 L0,-5 L4,5 M-2,1 L2,1"][k];
    s+=`<path d="${g}" fill="none" stroke="${color}" stroke-width="1.3" transform="translate(${f1(x)},${f1(y)}) rotate(${f1(a*180/Math.PI+90)})"/>`; }
  const poly=(o)=>[0,1,2].map(i=>{const a=o+i*2*Math.PI/3; return `${f1(cx+Math.cos(a)*rad*.72)},${f1(cy+Math.sin(a)*rad*.72)}`}).join(" ");

}
function rays(cx, color, n=14){

    s+=`<polygon points="${cx},-40 ${p(a-sp/2)} ${p(a+sp/2)}" fill="${color}" opacity="${i%2?.08:.14}"/>`; }
  return s+`</g>`;
}

/* --- particles --- */
let FX=null;
function stopFX(){ if(FX){ cancelAnimationFrame(FX.raf); FX.io&&FX.io.disconnect(); FX=null; } }
function startFX(canvas, type, acc){
  stopFX();
  if(!canvas||!type||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx=canvas.getContext("2d"), dpr=Math.min(2,window.devicePixelRatio||1);
  let w=0,h=0,k=1; const size=()=>{ w=canvas.clientWidth; h=canvas.clientHeight; k=Math.max(1,w/1160); canvas.width=w*dpr; canvas.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }; size();
  const N={embers:80,ash:55,fireflies:34,motes:40,sparks:60}[type]||0; if(!N) return;
  const R=Math.random;
  const spawn=(init)=>{ const p={x:R()*w,y:init?R()*h:h+8,s:(R()*1.8+.6)*k,v:(R()*.8+.3)*k,ph:R()*6.28,a:R()*.6+.4};
    if(type==="ash"){ p.y=init?R()*h:-8; }
    if(type==="sparks"){ p.x=w*(.2+R()*.6); p.y=h*.9; p.vx=(R()-.5)*4*k; p.vy=-(R()*5+3)*k; p.s=(R()*1.4+.6)*k; p.life=init?R():1; }
    if(type==="fireflies"){ p.y=R()*h; p.vx=(R()-.5)*.4*k; p.vy=(R()-.5)*.3*k; }
    return p; };
  const ps=Array.from({length:N},()=>spawn(true));
  let vis=true; const io=new IntersectionObserver(e=>{vis=e[0].isIntersecting}); io.observe(canvas);
  FX={raf:0,io};
  let t=0;
  const tick=()=>{ FX.raf=requestAnimationFrame(tick); if(!vis) return; if(canvas.clientWidth!==w||canvas.clientHeight!==h) size(); t+=.016;
    ctx.clearRect(0,0,w,h); ctx.globalCompositeOperation=type==="ash"?"source-over":"lighter";
    for(let i=0;i<ps.length;i++){ const p=ps[i];
      if(type==="embers"){ p.y-=p.v*1.3; p.x+=Math.sin(t*2+p.ph)*.5*k; if(p.y<-10) ps[i]=spawn(false); const al=Math.min(1,p.y/h+.15)*p.a;
        ctx.fillStyle=acc; ctx.globalAlpha=al; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); ctx.globalAlpha=al*.22; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*3.5,0,7); ctx.fill(); }
      else if(type==="ash"){ p.y+=p.v*.6; p.x+=Math.sin(t+p.ph)*.4*k; if(p.y>h+10) ps[i]=spawn(false); ctx.fillStyle="#bbb"; ctx.globalAlpha=p.a*.45; ctx.fillRect(p.x,p.y,p.s*1.6,p.s); }
      else if(type==="fireflies"){ p.x+=p.vx+Math.sin(t+p.ph)*.3*k; p.y+=p.vy+Math.cos(t*.8+p.ph)*.3*k; if(p.x<-10)p.x=w+10; if(p.x>w+10)p.x=-10; if(p.y<-10)p.y=h+10; if(p.y>h+10)p.y=-10;
        const al=(Math.sin(t*2+p.ph)+1)/2*p.a; ctx.fillStyle=acc; ctx.globalAlpha=al; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*.9,0,7); ctx.fill(); ctx.globalAlpha=al*.3; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*5,0,7); ctx.fill(); }
      else if(type==="motes"){ p.y-=p.v*.35; p.x+=Math.sin(t*.7+p.ph)*.25*k; if(p.y<-10) ps[i]=spawn(false); ctx.fillStyle=acc; ctx.globalAlpha=p.a*.5*Math.min(1,p.y/h+.2); ctx.beginPath(); ctx.arc(p.x,p.y,p.s*.8,0,7); ctx.fill(); }
      else if(type==="sparks"){ p.x+=p.vx; p.y+=p.vy; p.vy+=.09*k; p.life-=.012; if(p.life<=0||p.y>h+10) ps[i]=spawn(false);
        ctx.strokeStyle=acc; ctx.globalAlpha=Math.max(0,p.life); ctx.lineWidth=p.s; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2); ctx.stroke(); }
    }
    ctx.globalAlpha=1; };
  tick();
}

/* ---------- search index ---------- */
const KIND_G = {Page:"",Section:"",Skill:"characters",Passive:"characters",Race:"characters",Class:"characters",Weapon:"combat",Control:"combat","Status effect":"combat","Item set":"gear",Glyph:"gear",Trait:"gear",Mark:"characters",Oath:"characters",Achievement:"characters",Enemy:"world",Realm:"world",Dungeon:"world",Order:"world",Craft:"gear",Title:"characters"};
function kindFor(heads){
  const h=heads.map(x=>x.toLowerCase()), f=h[0];
  if(f==="key") return "Control";
  if(f==="skill"&&h.includes("type")) return "Skill";
  if(f==="passive") return "Passive";
  if(f==="effect"&&h.includes("stacking")) return "Status effect";
  if(f==="glyph") return "Glyph"; if(f==="trait") return "Trait"; if(f==="mark") return "Mark"; if(f==="oath") return "Oath";
  if(f==="achievement") return "Achievement"; if(f==="enemy") return "Enemy"; if(f==="realm") return "Realm"; if(f==="dungeon") return "Dungeon";
  if(f==="order") return "Order"; if(f==="craft") return "Craft"; if(f==="race") return "Race"; if(f==="class") return "Class"; if(f==="weapon") return "Weapon";
  if(f==="prestige") return "Title";
  return heads[0]||"Entry";
}
const rowKey = (heads,cells) => (heads[0]||"").toLowerCase()==="key" ? cells[1] : cells[0];
let INDEX=null;
function buildIndex(){
  const div=document.createElement("div"), E=[];
  for(const id of DOC.order){
    const p=P[id], where=p.parent?P[p.parent].title:GROUP_OF[id].label;
    E.push({k:"Page",t:p.title,sub:where,href:`#/${id}`,d:(p.sub?p.sub+". ":"")+(p.card||GROUPS.find(g=>g.items.includes(id))?.blurb[id]||""),g:(GROUP_OF[p.parent||id]||{}).id,w:30});
    div.innerHTML=(p.lede||"")+(p.html||"");
    div.querySelectorAll("h2[id],h3[id]").forEach(h=>E.push({k:"Section",t:h.childNodes[0].textContent,sub:p.title,href:`#/${id}?s=${h.id}`,d:"",g:(GROUP_OF[p.parent||id]||{}).id,w:10}));
    div.querySelectorAll("table").forEach(t=>{
      const heads=[...t.querySelectorAll("thead th")].map(x=>x.textContent.trim()); const kind=kindFor(heads);
      t.querySelectorAll("tbody tr").forEach(tr=>{ const cells=[...tr.children].map(td=>td.textContent.trim()); const key=rowKey(heads,cells); if(!key) return;
        const d=heads.map((hh,i)=>i===0||!cells[i]||cells[i]==="-"?null:(heads[0].toLowerCase()==="key"&&i===1?`Key: ${cells[0]}`:`${hh}: ${cells[i]}`)).filter(Boolean).join(". ");
        E.push({k:kind,t:key,sub:p.title,href:`#/${id}?r=${slugify(key)}`,d,g:KIND_G[kind]||(GROUP_OF[p.parent||id]||{}).id,w:20}); });
    });
  }
  E.push({k:"Page",t:"Item sets",sub:"Gear",href:"#/item-sets",d:"How sets work, gear slots, weights and bonus tiers.",g:"gear",w:30});
  E.push({k:"Page",t:"All sets",sub:"Item sets",href:"#/all",d:"Every set with filters.",g:"gear",w:30});
  CAT_ORDER.forEach(c=>E.push({k:"Page",t:CATS[c].title,sub:"Item sets",href:`#/sets/${c}`,d:CATS[c].intro,g:"gear",w:30}));
  SETS.forEach(s=>E.push({k:"Item set",t:s.name,sub:`${CATS[s.cat].label}${s.cat==="overland"||s.cat==="dungeon"||s.cat==="trial"?", "+s.source:""}`,href:`#/set/${s.id}`,d:s.bonus+(s.weight?`. ${s.weight}`:"")+(s.package?`, ${s.package}`:""),g:"gear",w:20}));
  INDEX=E;
}
function searchIndex(q, limit){
  if(!INDEX) buildIndex();
  const toks=q.toLowerCase().split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const out=[];
  for(const e of INDEX){
    const t=e.t.toLowerCase(), hay=(t+" "+e.sub+" "+e.d+" "+e.k).toLowerCase(); let sc=0, ok=true;
    for(const w of toks){ if(!hay.includes(w)){ ok=false; break; }
      if(t===w) sc+=100; else if(t.startsWith(w)) sc+=70; else if(new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(t)) sc+=50; else if(t.includes(w)) sc+=35; else sc+=6; }
    if(!ok) continue;
    if(t===q.toLowerCase()) sc+=60;
    out.push({e,sc:sc+e.w});
  }
  out.sort((a,b)=>b.sc-a.sc);
  return limit?out.slice(0,limit):out;
}
function hl(s,q){ const toks=q.split(/\s+/).filter(Boolean).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")); if(!toks.length) return esc(s);
  return esc(s).replace(new RegExp("("+toks.join("|")+")","ig"),"<mark>$1</mark>"); }
function resultRow(e,q,i,sel){
  return `<div class="pr ${sel?"sel":""} ${e.g?"g-"+e.g:""}" role="option" data-i="${i}" data-href="${e.href}" aria-selected="${sel}"><span class="k">${esc(e.k)}</span><div class="t">${hl(e.t,q)}<small>${esc(e.sub)}</small></div>${e.d?`<div class="d">${hl(e.d,q)}</div>`:""}</div>`;
}

}
function movePal(d){ if(!palRes.length) return; palSel=(palSel+d+palRes.length)%palRes.length;
  document.querySelectorAll("#pres .pr").forEach((el,i)=>{ el.classList.toggle("sel",i===palSel); el.setAttribute("aria-selected",i===palSel); if(i===palSel) el.scrollIntoView({block:"nearest"}); }); }
function goPal(i){ const e=palRes[i]; if(!e) return; closePal(); if(location.hash===e.href) route(); else location.hash=e.href; }

function searchPage(q){
  const res=q?searchIndex(q):[];
  const main=`<input class="inline-search" id="sq" type="search" value="${esc(q)}" placeholder="Search every page, skill and item set" style="width:100%;max-width:40rem;font-size:1.125rem;padding:0.75rem 0.875rem" aria-label="Search the wiki">
  <p class="muted" style="margin-top:0.75rem">${q?`${res.length} ${res.length===1?"result":"results"} for “${esc(q)}”`:"Type a name or an effect, such as Bleed, parry or Malakor."}</p>
  <div class="pres" style="padding:0">${res.slice(0,120).map((x,i)=>resultRow(x.e,q,i,false)).join("")}</div>${footer()}`;
  return layout("search", banner("search","Search","",[["","Home"]]), main, null);
}

/* ---------- glossary ---------- */
const GLOSS = {
  bleed:["Bleed","Physical damage every second. Reapplying refreshes it; the stronger Bleed wins."],
  burn:["Burn","Fire damage every second. Ashkin are immune."],
  poison:["Poison","Poison damage every second, usually long-lasting. Dreadkin are immune."],
  slow:["Slow","Lowers move speed by a percentage. The strongest Slow applies."],
  weaken:["Weaken","The target deals less damage."],
  vulnerable:["Vulnerable","The target takes more damage."],
  stagger:["Stagger","Interrupts the target and opens them to a riposte."],
  root:["Root","The target can't move but can still attack."],
  poise:["Poise","Hits wear it down; when it breaks, the target staggers and is open to a riposte."],
  riposte:["Riposte","The strike you land on a foe whose poise you've broken."],
  parry:["Parry","Raise your guard just before a hit lands to deflect it and stagger the attacker."],
  "guard counter":["Guard counter","Attack right after blocking a hit for a strong counter-strike."],
  bash:["Bash","Attack while blocking to shove the foe and damage their poise."],
  backstab:["Backstab","Attack a foe from behind while they're unaware or staggered: a heavy hit with its own animation."],
  ultimate:["Ultimate","Charges from 0 to 100 as you deal and take damage. Each ultimate costs 75 to 100."],
  flask:["Flask","Press X to drink and heal. Limited sips, refilled at shrines."],
  "ash-touched":["Ash-touched","Every Sixth Realm creature and every member of Malakor's cult."],
};
const GLOSS_RE=/\b(Bleed(?:s|ing)?|Burn(?:s|ing)?|Poison(?:s|ed)?|Slow(?:s|ed)?|Weaken(?:s|ed)?|Vulnerable|Stagger(?:s|ed)?|Root(?:s|ed)?|Poise|Ripostes?|Parry|Parries|Parrying|Parried|Guard counters?|Bash(?:es)?|Backstabs?|Ultimate|Flask|ash-touched)(?![-\w])/gi;
function glossKey(w){ w=w.toLowerCase(); if(w.startsWith("guard counter")) return "guard counter"; if(w.startsWith("parr")) return "parry"; if(w.startsWith("ash-touched")) return "ash-touched";
  for(const k of Object.keys(GLOSS)) if(w.startsWith(k)) return k; return null; }
function applyGlossary(root, path){
  if(path==="status-effects"||path==="combat") return;
  const seen=new Set();
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement; if(!p||!p.closest("td,li")||p.closest("a,h1,h2,h3,th,.term,.tchip,.cost,summary,.pk,.tile,.tiers .tag,details")) return NodeFilter.FILTER_REJECT; return GLOSS_RE.test(n.nodeValue)?(GLOSS_RE.lastIndex=0,NodeFilter.FILTER_ACCEPT):NodeFilter.FILTER_REJECT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const n of nodes){
    const txt=n.nodeValue; let last=0, frag=document.createDocumentFragment(), changed=false; GLOSS_RE.lastIndex=0; let m;
    while((m=GLOSS_RE.exec(txt))){ const k=glossKey(m[1]); if(!k||seen.has(k)) continue; seen.add(k); changed=true;
      frag.append(txt.slice(last,m.index)); const s=document.createElement("span"); s.className="term"; s.tabIndex=0; s.dataset.k=k; s.textContent=m[1]; frag.append(s); last=m.index+m[1].length; }
    if(changed){ frag.append(txt.slice(last)); n.replaceWith(frag); }
  }
}
const tip=document.getElementById("tip");
function showTip(el){ const [t,d]=GLOSS[el.dataset.k]; tip.innerHTML=`<b>${esc(t)}</b>${esc(d)}`; tip.classList.add("on");
  const r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight; let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),innerWidth-tw-8), y=r.top-th-8; if(y<8) y=r.bottom+8; tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.classList.remove("on"); }

/* ---------- after render ---------- */
function enhance(path){
  const main=document.querySelector(".main");
  // row ids + table filters
  document.querySelectorAll(".main table.doc").forEach(t=>{
    const heads=[...t.querySelectorAll("thead th")].map(x=>x.textContent.trim()), rows=[...t.querySelectorAll("tbody tr")];
    rows.forEach(tr=>{ const cells=[...tr.children].map(td=>td.textContent.trim()); const k=rowKey(heads,cells); if(k&&!document.getElementById("r-"+slugify(k))) tr.id="r-"+slugify(k); });
    if(rows.length>=8){ const wrap=t.closest(".tbl-wrap"), f=document.createElement("div"); f.className="tfilter";
      f.innerHTML=`<input type="search" placeholder="Filter this table" aria-label="Filter this table"><span>${rows.length} rows</span>`;
      wrap.before(f); const inp=f.querySelector("input"), sp=f.querySelector("span");
      inp.addEventListener("input",()=>{ const q=inp.value.toLowerCase(); let n=0; rows.forEach(tr=>{ const on=!q||tr.textContent.toLowerCase().includes(q); tr.style.display=on?"":"none"; n+=on; }); sp.textContent=q?`${n} of ${rows.length} rows`:`${rows.length} rows`; }); }
  });
  if(main) applyGlossary(main, path);
  // on this page + scrollspy
  const otp=document.getElementById("otp");
  if(otp){ const hs=[...document.querySelectorAll(".main .prose h2[id], .main .prose h3.line[id], .main details.devnotes")];
    if(hs.length<3) otp.remove(); else {
      otp.innerHTML=`<b>On this page</b>`+hs.map(h=>`<a data-t="${h.id}" tabindex="0">${esc(h.tagName==="DETAILS"?"Design notes":h.childNodes[0].textContent)}</a>`).join("");
      const go=e=>{ const a=e.target.closest("a[data-t]"); if(!a) return; const t=document.getElementById(a.dataset.t); if(t.tagName==="DETAILS") t.open=true; t.scrollIntoView({behavior:"smooth",block:"start"}); };
      otp.onclick=go; otp.onkeydown=e=>{ if(e.key==="Enter") go(e); };
      const links=[...otp.querySelectorAll("a")];
      const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ links.forEach(l=>l.classList.toggle("on",l.dataset.t===en.target.id)); } }); },{rootMargin:"0px 0px -70% 0px"});
      hs.forEach(h=>io.observe(h)); SPY=io; } }
  // particles
  const b=document.querySelector(".banner,.hero"); if(b) startFX(b.querySelector("canvas"), b.dataset.fx, b.dataset.acc); else stopFX();
}
let SPY=null;
function deepLink(qs){
  const p=new URLSearchParams(qs||""), r=p.get("r"), s=p.get("s");
  const el = r ? document.getElementById("r-"+r) : s ? document.getElementById(s) : null;
  if(!el) return false;
  if(el.tagName==="DETAILS") el.open=true;
  requestAnimationFrame(()=>{ el.scrollIntoView({block:r?"center":"start"}); if(r){ el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); } });
  return true;
}

/* ---------- router ---------- */
function drawTable(){ const box=document.querySelector("[data-cat]"); if(!box) return;
  const cat=box.dataset.cat, base=cat==="all"?SETS:SETS.filter(s=>s.cat===cat), list=applyFilter(base);
  document.getElementById("tbl").innerHTML=tableHTML(cat,list); document.getElementById("cnt").textContent=`Showing ${list.length} of ${base.length}`; }
let lastPath=null;
function route(){
  const h=location.hash.replace(/^#/,"")||"/", [raw,qs]=h.split("?"), path=raw.replace(/^\/+|\/+$/g,""), parts=path.split("/").filter(Boolean);
  const focused=document.activeElement&&document.activeElement.id;
  if(SPY){ SPY.disconnect(); SPY=null; } hideTip();
  let html, title=null;
  if(!parts.length) html=home();
  else if(path==="item-sets"){ html=howSets(); title="Item sets"; }
  else if(path==="all"){ html=allSets(); title="All sets"; }
  else if(parts[0]==="search"){ html=searchPage(new URLSearchParams(qs||"").get("q")||""); title="Search"; }
  else if(parts[0]==="sets"&&CATS[parts[1]]){ html=category(parts[1]); title=CATS[parts[1]].title; }
  else if(parts[0]==="set"){ html=setPage(parts[1]); title=BY_ID[parts[1]]?.name; }
  else if(P[path]){ html=docPage(path); title=P[path].title; }
  else html=notFound();
  if(path!=="all") state.q="";
  if(!(parts[0]==="sets"||path==="all")){ state.w="All"; state.p="All"; }
  document.getElementById("app").innerHTML=html;
  drawTable(); renderNav(path); enhance(path);
  document.title=title?`${title} | Severance Wiki`:"Severance Wiki";
  document.body.classList.remove("nav-open");
  const linked=deepLink(qs);
  if(!linked && path!==lastPath) window.scrollTo(0,0);
  lastPath=path; macKeys();
  if(parts[0]==="search"&&focused==="sq"){ const el=document.getElementById("sq"); el.focus(); const n=el.value.length; try{el.setSelectionRange(n,n)}catch(e){} }
}
window.addEventListener("hashchange",route);

document.addEventListener("click",e=>{
  if(e.target.closest("[data-open-search]")){ openPal(); return; }
  const tg=e.target.closest(".tg"); if(tg){ const id=tg.dataset.hub, now=tg.getAttribute("aria-expanded")!=="true";
    if(now){ openHubs.add(id); closedHubs.delete(id); } else { openHubs.delete(id); closedHubs.add(id); }
    tg.setAttribute("aria-expanded",now); tg.parentElement.nextElementSibling.classList.toggle("open",now); return; }
  if(e.target.closest("#menuBtn")){ document.body.classList.add("nav-open"); return; }
  if(e.target.id==="scrim"){ document.body.classList.remove("nav-open"); return; }
  if(e.target.id==="pal"||e.target.closest("#pclose")){ closePal(); return; }
  const pr=e.target.closest(".pr"); if(pr){ if(pr.closest("#pres")) goPal(+pr.dataset.i); else location.hash=pr.dataset.href; return; }
  if(e.target.closest("#pall")){ closePal(); return; }
  const row=e.target.closest("tr.go"); if(row){ location.hash=row.dataset.href; return; }
  const b=e.target.closest(".seg button"); if(b){ state[b.parentElement.dataset.f]=b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); drawTable(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="pq") renderPal();
  if(e.target.id==="fq"){ state.q=e.target.value; drawTable(); }
  if(e.target.id==="sq"){ history.replaceState(null,"","#/search"+(e.target.value?"?q="+encodeURIComponent(e.target.value):"")); route(); }
});
document.addEventListener("keydown",e=>{
  const pal=document.getElementById("pal").classList.contains("open");
  if((e.key==="k"||e.key==="K")&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); pal?closePal():openPal(); return; }
  if(pal){ if(e.key==="Escape"){ closePal(); } else if(e.key==="ArrowDown"){ e.preventDefault(); movePal(1); } else if(e.key==="ArrowUp"){ e.preventDefault(); movePal(-1); } else if(e.key==="Enter"){ e.preventDefault(); goPal(palSel); } return; }
  if(e.key==="/"&&!/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); openPal(); }
  if(e.key==="Escape") document.body.classList.remove("nav-open");
  if(e.key==="Enter"&&document.activeElement.classList.contains("term")) showTip(document.activeElement);
});
document.addEventListener("mouseover",e=>{ const t=e.target.closest(".term"); if(t) showTip(t); });
document.addEventListener("mouseout",e=>{ if(e.target.closest(".term")) hideTip(); });
document.addEventListener("focusin",e=>{ if(e.target.classList?.contains("term")) showTip(e.target); });
document.addEventListener("focusout",e=>{ if(e.target.classList?.contains("term")) hideTip(); });
window.addEventListener("scroll",hideTip,{passive:true});
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform);
function macKeys(){ if(IS_MAC) document.querySelectorAll("kbd").forEach(k=>{ if(k.textContent==="Ctrl K") k.textContent="⌘ K"; }); }
(function(){ let saved=null; try{saved=localStorage.getItem("sev-theme")}catch(e){} if(saved) document.documentElement.dataset.theme=saved;
  document.getElementById("themeBtn").onclick=()=>{ const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"), nx=cur==="light"?"dark":"light";
    document.documentElement.dataset.theme=nx; try{localStorage.setItem("sev-theme",nx)}catch(e){} }; })();
route();
</script>
