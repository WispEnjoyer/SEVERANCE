e</span></td>\n<td>8</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>For 10 s: +25% damage dealt, +15% move speed, +10% damage taken</td>\n</tr>\n<tr class=\"even\">\n<td>Unchained</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">80 <small>Ultimate</small></span></td>\n<td>For 12 s: +50% damage dealt, heal for 15% of damage dealt, and you can't be staggered</td>\n</tr>\n<tr class=\"odd\">\n<td>Blood Scent</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+5% Physical damage</td>\n</tr>\n<tr class=\"even\">\n<td>Savage</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+5% max Stamina</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-scarhide\">Scarhide<small>(Physical): Too stubborn to fall.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Brace</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>For 6 s: -30% damage taken, can't be staggered</td>\n</tr>\n<tr class=\"even\">\n<td>Shoulder Charge</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Dash 10 studs, untouchable, hitting everything in the path (100 damage), staggers</td>\n</tr>\n<tr class=\"odd\">\n<td>Thick Skull</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>Heal 25% of max Health over 6 s</td>\n</tr>\n<tr class=\"even\">\n<td>Unbreakable</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>For 10 s: a shield worth 30% of max Health, -50% damage taken, can't be staggered</td>\n</tr>\n<tr class=\"odd\">\n<td>Scarred</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>+6% max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Grit</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>-4% damage taken</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-battle-roar\">Battle Roar<small>(Physical): The fight is louder with you in it.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bellow</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A burst around you (60 damage, 10 studs), Weakens (20% less damage) for 6 s</td>\n</tr>\n<tr class=\"even\">\n<td>Quake Leap</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>Leap onto the target and slam (220 damage, 6 stud radius)</td>\n</tr>\n<tr class=\"odd\">\n<td>War Drum</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>For 15 s: +50% Stamina regeneration, +10% damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Faultline</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>A burst around you (550 damage, 14 studs), staggers</td>\n</tr>\n<tr class=\"odd\">\n<td>Thunderous</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>+5% damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Endless Fury</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>+1 Ultimate per hit</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes/necromancer": {"id": "classes/necromancer", "title": "Necromancer", "sub": "Summoner, ranged", "group": "characters", "parent": "classes", "info": [["Role", "Summoner, ranged"], ["Skill lines", "Barrow Host, Ossuary, Sutured Flesh"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/destruction-staff\">Destruction Staff</a>, <a class=\"link\" href=\"#/weapons/scythe\">Scythe</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a>, <a class=\"link\" href=\"#/races/highborn\">Highborn</a>"]], "card": "Barrow Host, Ossuary, Sutured Flesh", "badge": null, "html": "<p><em>Borrows soldiers from the grave. Doesn't fight so much as delegate.</em></p>\n<p>Mana caster who fights through summoned dead, wears bone as armour and heals by stealing life.</p>\n<p><strong>Cult: The Quiet Choir</strong> (the barrows beneath Oakhaven)</p>\n<p>The Quiet Choir began as Oakhaven's gravekeepers, who sang the dead to sleep. Somewhere along the way they learned that the dead will also wake to a song. Now the Choir believes death is a debt, and that the dead owe one last service to the living. The crown outlawed them twice. When Oakhaven burned, the Choir's skeletons held the barrow gates while the living fled, and nobody has tried to outlaw them since. Many Dreadkin say a Choir song is the last thing they heard before they woke.</p>\n<h3 class=\"line\" id=\"s-barrow-host\">Barrow Host<small>(Necrotic): The dead outnumber the living. Use that.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Marrow Spike</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-mana\">250 <small>Mana</small></span></td>\n<td>A bolt (170 damage, 60 studs), pierces</td>\n</tr>\n<tr class=\"even\">\n<td>Bone Bowman</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-mana\">450 <small>Mana</small></span></td>\n<td>Raise a skeletal archer for 14 s that shoots the nearest foe (90 damage every 1.4 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Corpse Burst</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>8</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>A burst 9 studs ahead (240 damage, 6 studs)</td>\n</tr>\n<tr class=\"even\">\n<td>Legion of the Grave</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">100 <small>Ultimate</small></span></td>\n<td>Raise 3 skeletons for 12 s, each shooting the nearest foe (100 damage every 1 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Dread Mastery</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+8% Necrotic damage</td>\n</tr>\n<tr class=\"even\">\n<td>Last Bell</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+5% max Mana</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-ossuary\">Ossuary<small>(Necrotic): Wear the dead as armour.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ribcage Ward</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>For 8 s: a shield worth 30% of max Health, -10% damage taken</td>\n</tr>\n<tr class=\"even\">\n<td>Clutching Dead</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-mana\">380 <small>Mana</small></span></td>\n<td>An area 8 studs ahead (6 studs, 4 s): 30 damage/s, Slows by 60% for 1.5 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Marrow Leech</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-mana\">320 <small>Mana</small></span></td>\n<td>A bolt (140 damage, 50 studs), heals you for 50% of the damage</td>\n</tr>\n<tr class=\"even\">\n<td>Ossuary Colossus</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>For 12 s: a shield worth 40% of max Health, -50% damage taken, can't be staggered</td>\n</tr>\n<tr class=\"odd\">\n<td>Ossified</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>+6% max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Calcified</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>-4% damage taken</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-sutured-flesh\">Sutured Flesh<small>(Necrotic): Stitch yourself back together.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mend Flesh</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>Heal 25% of max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Spirit Siphon</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-mana\">450 <small>Mana</small></span></td>\n<td>An area around you, following you (8 studs, 6 s): 30 damage/s, heals allies 3% of max Health/s</td>\n</tr>\n<tr class=\"odd\">\n<td>Grave Pact</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-health\">150 <small>Health</small></span></td>\n<td>For 10 s: +60% Mana regeneration</td>\n</tr>\n<tr class=\"even\">\n<td>Undying</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Heal 20% of max Health, then for 8 s: 30% less damage taken and heal for 40% of damage dealt</td>\n</tr>\n<tr class=\"odd\">\n<td>Corpse Eater</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>+5% healing</td>\n</tr>\n<tr class=\"even\">\n<td>Pale Vigour</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>+4% max Health</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes/dark-knight": {"id": "classes/dark-knight", "title": "Dark Knight", "sub": "Melee damage, life drain", "group": "characters", "parent": "classes", "info": [["Role", "Melee damage, life drain"], ["Skill lines", "Abyssal Edge, Crimson Pact, Dread Aegis"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/greatsword\">Greatsword</a>, <a class=\"link\" href=\"#/weapons/longsword\">Longsword</a>, <a class=\"link\" href=\"#/weapons/sword-and-shield\">Sword and Shield</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/drakari\">Drakari</a>, <a class=\"link\" href=\"#/races/dreadkin\">Dreadkin</a>"]], "card": "Abyssal Edge, Crimson Pact, Dread Aegis", "badge": null, "html": "<p><em>Trades its own blood for power. Every kill is a step further from mercy.</em></p>\n<p>Melee fighter who mixes Stamina and Mana: shadow steel, life drain and fear-based defence. Some skills cost Health.</p>\n<p><strong>Order: The Umbral Vow</strong> (Oakhaven, in exile)</p>\n<p>The Umbral Vow were once knights of the Dawnward Order. When the Ash Sovereign's fire reached Oakhaven, their light didn't stop it, so a handful of them swore themselves to the dark instead: shadow doesn't burn. They fight Malakor with power as dangerous as his, paid for in their own blood. The Dawnward call them oathbreakers. The Vow answers that they kept the only oath that mattered, which was to make sure Oakhaven never burns again, whatever it costs them.</p>\n<h3 class=\"line\" id=\"s-abyssal-edge\">Abyssal Edge<small>(Shadow): Steel tempered in the dark.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Void Slash</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A strike (220 damage), heals you for 10% of the damage</td>\n</tr>\n<tr class=\"even\">\n<td>Shadow Lunge</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Dash 13 studs, untouchable, hitting everything in the path (160 damage)</td>\n</tr>\n<tr class=\"odd\">\n<td>Night Rend</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>8</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>3 strikes (90 damage each)</td>\n</tr>\n<tr class=\"even\">\n<td>Eclipse Blade</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>A strike (800 damage), unblockable</td>\n</tr>\n<tr class=\"odd\">\n<td>Umbral Edge</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+8% Shadow damage</td>\n</tr>\n<tr class=\"even\">\n<td>Relentless</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+5% max Stamina</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-crimson-pact\">Crimson Pact<small>(Blood): Trade your blood for theirs.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blood Price</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-health\">150 <small>Health</small></span></td>\n<td>For 8 s: +30% damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Lifethief</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-mana\">300 <small>Mana</small></span></td>\n<td>A bolt (140 damage, 45 studs), heals you for 60% of the damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Sanguine Wave</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>A burst around you (160 damage, 8 studs), heals you for 30% of the damage</td>\n</tr>\n<tr class=\"even\">\n<td>Blood Moon</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>For 12 s: +25% damage dealt and heal for 35% of damage dealt</td>\n</tr>\n<tr class=\"odd\">\n<td>Thirst</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>Heal for 3% of damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Hemomancy</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>+5% max Health</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-dread-aegis\">Dread Aegis<small>(Shadow): Fear is the best armour.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Dread Ward</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>For 6 s: a shield worth 25% of max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Terrorize</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A burst around you (50 damage, 10 studs), Weakens (25% less damage) for 6 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Shackles of Night</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-mana\">300 <small>Mana</small></span></td>\n<td>A bolt (100 damage, 45 studs), Slows by 50% for 4 s</td>\n</tr>\n<tr class=\"even\">\n<td>Fallen Bastion</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>An aura around you (10 studs, 8 s): 40 damage/s and Weakens foes by 30%; you take 40% less damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Dark Bulwark</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>-4% damage taken</td>\n</tr>\n<tr class=\"even\">\n<td>Fearsome</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>Blocking costs 10% less</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes/holy-knight": {"id": "classes/holy-knight", "title": "Holy Knight", "sub": "Tank, healer", "group": "characters", "parent": "classes", "info": [["Role", "Tank, healer"], ["Skill lines", "Radiant Oath, Hallowed Shelter, Verdict of Light"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/sword-and-shield\">Sword and Shield</a>, <a class=\"link\" href=\"#/weapons/longsword\">Longsword</a>, <a class=\"link\" href=\"#/weapons/restoration-staff\">Restoration Staff</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/overlander\">Overlander</a>, <a class=\"link\" href=\"#/races/lunari\">Lunari</a>"]], "card": "Radiant Oath, Hallowed Shelter, Verdict of Light", "badge": null, "html": "<p><em>Sword in one hand, oath in the other. Slow to anger, slower to fall.</em></p>\n<p>Holy warrior who tanks and heals: radiant strikes, shields and healing ground, plus judgement for damage.</p>\n<p><strong>Order: The Dawnward Order</strong> (Oakhaven)</p>\n<p>The Dawnward are the sworn knights of Oakhaven, the shield of the last kingdom. Each knight takes three oaths: to stand (Radiant Oath), to shelter (Hallowed Shelter) and to judge (Verdict of Light). Their great citadel burned with the rest of Oakhaven on the night the Ash Sovereign came, and the surviving knights now rebuild it stone by stone in the ruins. They still have not forgiven the Umbral Vow, the brothers and sisters who turned to the dark that night.</p>\n<h3 class=\"line\" id=\"s-radiant-oath\">Radiant Oath<small>(Holy): A sworn sword, burning.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Oathstrike</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A strike (200 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Radiant Charge</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Dash 12 studs, untouchable, hitting everything in the path (140 damage)</td>\n</tr>\n<tr class=\"odd\">\n<td>Blessed Circle</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>8</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>An area around you, following you (8 studs, 6 s): 50 damage/s, heals allies 2% of max Health/s</td>\n</tr>\n<tr class=\"even\">\n<td>Dawnlance</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>A spear of light lands 10 studs ahead (700 damage, 10 studs)</td>\n</tr>\n<tr class=\"odd\">\n<td>Zealot</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+8% Holy damage</td>\n</tr>\n<tr class=\"even\">\n<td>Steadfast</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+5% max Stamina</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-hallowed-shelter\">Hallowed Shelter<small>(Holy): Shelter for those who stand with you.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Vigil's Mercy</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>Heal 25% of max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Aegis of Light</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>For 6 s: a shield worth 30% of max Health</td>\n</tr>\n<tr class=\"odd\">\n<td>Rite of Renewal</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-mana\">450 <small>Mana</small></span></td>\n<td>Heal 30% of max Health over 8 s</td>\n</tr>\n<tr class=\"even\">\n<td>Sanctified Ground</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">100 <small>Ultimate</small></span></td>\n<td>Holy ground around you (12 studs, 10 s) heals allies 4% of max Health/s; you take 20% less damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Devotion</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>+5% healing</td>\n</tr>\n<tr class=\"even\">\n<td>Faithful</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>+5% max Mana</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-verdict-of-light\">Verdict of Light<small>(Holy): The verdict is light.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Spear of Light</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-mana\">250 <small>Mana</small></span></td>\n<td>A bolt (160 damage, 60 studs)</td>\n</tr>\n<tr class=\"even\">\n<td>Indict</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-mana\">300 <small>Mana</small></span></td>\n<td>A bolt (100 damage, 50 studs), leaves them Vulnerable (15% more damage) for 6 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Answering Flame</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>For 10 s: +20% damage dealt, -10% damage taken</td>\n</tr>\n<tr class=\"even\">\n<td>Wrath of the Heavens</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">100 <small>Ultimate</small></span></td>\n<td>Summon a sentinel of light for 10 s that shoots the nearest foe (150 damage every 0.7 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Righteous</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>+4% damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Oathbound</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>-4% damage taken</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes/shadowblade": {"id": "classes/shadowblade", "title": "Shadowblade", "sub": "Melee damage, assassin", "group": "characters", "parent": "classes", "info": [["Role", "Melee damage, assassin"], ["Skill lines", "Quiet Knife, Umbral Arts, Duskstride"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/daggers\">Daggers</a>, <a class=\"link\" href=\"#/weapons/katana\">Katana</a>, <a class=\"link\" href=\"#/weapons/bow\">Bow</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/felyne\">Felyne</a>, <a class=\"link\" href=\"#/races/duskborn\">Duskborn</a>, <a class=\"link\" href=\"#/races/oakborn\">Oakborn</a>"]], "card": "Quiet Knife, Umbral Arts, Duskstride", "badge": null, "html": "<p><em>Gone before the body hits the floor. Bleeds them, blinds them, and is never where you look.</em></p>\n<p>Stamina assassin: Bleeds, marks and backstabs, with shadow magic and the best mobility in the game.</p>\n<p><strong>Guild: The Hushed Court</strong> (Deepspire)</p>\n<p>Deepspire's Felyne queens never sent armies to settle a dispute: they sent the Hushed Court. The Court is a guild of assassins who work the moonlit spires, and it serves the throne, the highest bidder and itself, in no fixed order. Its members never speak inside the guildhall, only sign, so no secret is ever overheard. Rumour says the Court has accepted a contract on Malakor himself, and that every Shadowblade who takes it has disappeared.</p>\n<h3 class=\"line\" id=\"s-quiet-knife\">Quiet Knife<small>(Physical): One clean cut. Then another.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Gutting Cut</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A strike (240 damage), Bleeds (40/s for 4 s)</td>\n</tr>\n<tr class=\"even\">\n<td>Scatterblades</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>5 bolts (80 damage each, 35 studs)</td>\n</tr>\n<tr class=\"odd\">\n<td>Marked Quarry</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>8</td>\n<td><span class=\"cost c-stamina\">200 <small>Stamina</small></span></td>\n<td>A bolt (40 damage, 50 studs), leaves them Vulnerable (20% more damage) for 8 s</td>\n</tr>\n<tr class=\"even\">\n<td>Red Bloom</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>A burst around you (180 damage, 10 studs), Bleeds (50/s for 5 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Precision</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+6% Physical damage</td>\n</tr>\n<tr class=\"even\">\n<td>Cutthroat</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+5% max Stamina</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-umbral-arts\">Umbral Arts<small>(Shadow): The dark is a tool. Use it.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Veil</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>For 6 s: +40% move speed, -20% damage taken</td>\n</tr>\n<tr class=\"even\">\n<td>Night Dart</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-mana\">250 <small>Mana</small></span></td>\n<td>A bolt (150 damage, 55 studs)</td>\n</tr>\n<tr class=\"odd\">\n<td>Siphoning Shade</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-mana\">450 <small>Mana</small></span></td>\n<td>Summon a shade for 10 s that shoots the nearest foe (90 damage every 1.2 s) and heals you for 50% of its damage</td>\n</tr>\n<tr class=\"even\">\n<td>Nightfall</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Darkness around you (12 studs, 8 s): 40 damage/s and Weakens foes by 25%; you deal 30% more damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Umbral Mastery</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>+8% Shadow damage</td>\n</tr>\n<tr class=\"even\">\n<td>Duskblooded</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>+5% max Mana</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-duskstride\">Duskstride<small>(Shadow): Never where they're looking.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blink Strike</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Dash 15 studs, untouchable, hitting everything in the path (160 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Smoke Roll</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>Roll back 10 studs, untouchable, then +30% move speed for 4 s</td>\n</tr>\n<tr class=\"odd\">\n<td>From Above</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>Leap onto the target and slam (260 damage, 4 stud radius)</td>\n</tr>\n<tr class=\"even\">\n<td>Thousand Cuts</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>5 strikes (140 damage each), unblockable, lunges 8 studs</td>\n</tr>\n<tr class=\"odd\">\n<td>Fleet</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>+5% move speed</td>\n</tr>\n<tr class=\"even\">\n<td>Slipstep</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>Dodging costs 10% less</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes/alchemist": {"id": "classes/alchemist", "title": "Alchemist", "sub": "Support, damage over time", "group": "characters", "parent": "classes", "info": [["Role", "Support, damage over time"], ["Skill lines", "Volatile Mixtures, Tinctures, Toxicology"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/daggers\">Daggers</a>, <a class=\"link\" href=\"#/weapons/bow\">Bow</a>, <a class=\"link\" href=\"#/weapons/restoration-staff\">Restoration Staff</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/oakborn\">Oakborn</a>, <a class=\"link\" href=\"#/races/lunari\">Lunari</a>"]], "card": "Volatile Mixtures, Tinctures, Toxicology", "badge": null, "html": "<p><em>Poisons, potions, and a chemistry set that occasionally doubles as a weapon.</em></p>\n<p>Utility class: thrown bombs, healing and buff potions, and Poisons that wear foes down.</p>\n<p><strong>School: The Lampwrights</strong> (Aethelwing)</p>\n<p>The Lampwrights started as Aethelwing's lantern-makers, mixing the oils that light the Lunari's night-time cities. Oil that burns can also explode, and a remedy is only a poison at the right dose, so the guild grew into the realm's apothecaries, bomb-makers and poisoners all at once. Lampwright workshops are the most fireproof buildings in the five realms, for good reason. Their current project is a draught that cures the ash-sickness spreading from the Sixth Realm, so far without success.</p>\n<h3 class=\"line\" id=\"s-volatile-mixtures\">Volatile Mixtures<small>(Fire): Shake well. Throw hard. Duck.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Fire Flask</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A bolt (140 damage, 40 studs), splashes 5 studs, Burns (30/s for 4 s)</td>\n</tr>\n<tr class=\"even\">\n<td>Shrapnel Bomb</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>A bolt (180 damage, 40 studs), splashes 7 studs, Bleeds (30/s for 4 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Choking Cloud</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>8</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>A smoke cloud around you (7 studs, 5 s) Slows foes by 40%; you gain +30% move speed and take 15% less damage</td>\n</tr>\n<tr class=\"even\">\n<td>Grand Detonation</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>A huge blast 10 studs ahead (750 damage, 11 studs), Burns (50/s for 5 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Volatility</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+8% Fire damage</td>\n</tr>\n<tr class=\"even\">\n<td>Steady Hands</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+5% max Stamina</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-tinctures\">Tinctures<small>(Poison): A cure for most things, and worse for the rest.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Healing Draught</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-stamina\">400 <small>Stamina</small></span></td>\n<td>Heal 30% of max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Elixir of Vigour</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>For 12 s: +60% Stamina regeneration, +60% Mana regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>Ironskin Tonic</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">350 <small>Stamina</small></span></td>\n<td>For 10 s: -25% damage taken</td>\n</tr>\n<tr class=\"even\">\n<td>Philosopher's Draught</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>For 10 s: +30% damage dealt</td>\n</tr>\n<tr class=\"odd\">\n<td>Potency</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>+5% healing</td>\n</tr>\n<tr class=\"even\">\n<td>Distiller</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>Mana and Stamina costs 5% lower</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-toxicology\">Toxicology<small>(Poison): The patient art of making things worse.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Venom Dart</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">200 <small>Stamina</small></span></td>\n<td>A bolt (80 damage, 55 studs), Poisons (40/s for 8 s)</td>\n</tr>\n<tr class=\"even\">\n<td>Fever Fog</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>An area 8 studs ahead (7 studs, 8 s): 50 damage/s</td>\n</tr>\n<tr class=\"odd\">\n<td>Corrosive Coat</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>For 12 s, your hits Poison (30/s for 5 s)</td>\n</tr>\n<tr class=\"even\">\n<td>Plague Cloud</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">95 <small>Ultimate</small></span></td>\n<td>An area around you, following you (12 studs, 10 s): 90 damage/s, Weakens (20% less damage) for 1.5 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Toxic</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>+8% Poison damage</td>\n</tr>\n<tr class=\"even\">\n<td>Antidote</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>-4% damage taken</td>\n</tr>\n</tbody>\n</table></div>\n"}, "classes/blood-maiden": {"id": "classes/blood-maiden", "title": "Blood Maiden", "sub": "Mid-range damage, life steal", "group": "characters", "parent": "classes", "info": [["Role", "Mid-range damage, life steal"], ["Skill lines", "Red Rites, Crimson Thorn, Vein Puppetry"], ["Best fit weapons", "<a class=\"link\" href=\"#/weapons/scythe\">Scythe</a>, <a class=\"link\" href=\"#/weapons/destruction-staff\">Destruction Staff</a>"], ["Best fit races", "<a class=\"link\" href=\"#/races/vampyri\">Vampyri</a>, <a class=\"link\" href=\"#/races/ashkin\">Ashkin</a>"]], "card": "Red Rites, Crimson Thorn, Vein Puppetry", "badge": null, "html": "<p><em>Bleeds for her power, and makes you bleed more. Her spells are paid in her own blood.</em></p>\n<p>Blood mage who spends Health instead of Mana on many skills and heals it back with life steal. Thorns punish attackers, and blood control locks foes down.</p>\n<p><strong>Cult: The Rose Covenant</strong> (Aethelwing)</p>\n<p>The Rose Covenant is a sisterhood that keeps the old blood pacts of the Vampyri: the oldest magic, paid for in the caster's own blood. Its members cultivate blood-roses in hidden gardens and swear to give their blood before they ever take another's. The Covenant is feared in Aethelwing and needed by it, since its maidens can pull the poison out of a wound with a gesture. Few know that Malakor once came to the Covenant asking for its secrets, and that it refused him. He has not forgotten.</p>\n<h3 class=\"line\" id=\"s-red-rites\">Red Rites<small>(Blood): Blood is the oldest magic. She spends her own.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blood Lash</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-health\">60 <small>Health</small></span></td>\n<td>A strike (180 damage), heals you for 25% of the damage</td>\n</tr>\n<tr class=\"even\">\n<td>Open Veins</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>4</td>\n<td><span class=\"cost c-health\">80 <small>Health</small></span></td>\n<td>A bolt (100 damage, 55 studs), Bleeds (50/s for 6 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Crimson Tide</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>8</td>\n<td><span class=\"cost c-health\">120 <small>Health</small></span></td>\n<td>A burst around you (200 damage, 9 studs), heals you for 40% of the damage</td>\n</tr>\n<tr class=\"even\">\n<td>Scarlet Requiem</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>An area around you, following you (12 studs, 6 s): 120 damage/s, heals you for 50% of the damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Blood Sovereign</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+8% Blood damage</td>\n</tr>\n<tr class=\"even\">\n<td>Ichor</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>6</td>\n<td>-</td>\n<td>+6% max Health</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-crimson-thorn\">Crimson Thorn<small>(Blood): Roses grow where she bleeds.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Thorn Spear</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>2</td>\n<td><span class=\"cost c-mana\">250 <small>Mana</small></span></td>\n<td>A bolt (160 damage, 55 studs), pierces, Bleeds (20/s for 4 s)</td>\n</tr>\n<tr class=\"even\">\n<td>Briar Cage</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>5</td>\n<td><span class=\"cost c-mana\">400 <small>Mana</small></span></td>\n<td>An area 8 studs ahead (6 studs, 5 s): 40 damage/s, Slows by 70% for 1.5 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Rose of Thorns</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>For 10 s: -15% damage taken, reflect 30% of damage taken</td>\n</tr>\n<tr class=\"even\">\n<td>Garden of Blades</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>12</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>An area 9 studs ahead (10 studs, 6 s): 100 damage/s, Bleeds (30/s for 3 s)</td>\n</tr>\n<tr class=\"odd\">\n<td>Thorned</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>3</td>\n<td>-</td>\n<td>+5% damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Rosebound</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>7</td>\n<td>-</td>\n<td>+5% max Mana</td>\n</tr>\n</tbody>\n</table></div>\n<h3 class=\"line\" id=\"s-vein-puppetry\">Vein Puppetry<small>(Blood): Everyone has blood. She can pull on it.</small></h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Puppet Strings</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-mana\">300 <small>Mana</small></span></td>\n<td>A bolt (80 damage, 45 studs), staggers</td>\n</tr>\n<tr class=\"even\">\n<td>Transfusion</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-mana\">350 <small>Mana</small></span></td>\n<td>A burst around you (100 damage, 8 studs), heals you for 100% of the damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Red Bargain</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>11</td>\n<td><span class=\"cost c-health\">200 <small>Health</small></span></td>\n<td>For 12 s: +100% Mana regeneration, +15% damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Marionette</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>14</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>A burst around you (300 damage, 12 studs), Weakens (40% less damage) for 6 s</td>\n</tr>\n<tr class=\"odd\">\n<td>Heartstring</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>4</td>\n<td>-</td>\n<td>Heal for 3% of damage dealt</td>\n</tr>\n<tr class=\"even\">\n<td>Hemophage</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>8</td>\n<td>-</td>\n<td>Health costs 10% less</td>\n</tr>\n</tbody>\n</table></div>\n"}, "prestige": {"id": "prestige", "title": "Prestige", "group": "characters", "children": [], "lede": "<p>Reaching level 50 doesn't stop your character's growth. From then on, XP earns <strong>prestige points</strong> instead of levels, up to 1500 at launch. You spend them across three Paths of small passive bonuses, and slot a few powerful <strong>Oaths</strong> that change how you play. Your prestige number replaces your level on the HUD, marked with the prestige sigil.</p>\n", "html": "<h2 id=\"s-earning-prestige\">Earning prestige</h2><ul>\n<li><p><strong>Unlocks:</strong> at level 50, once the tutorial and your home realm's opening story are done.</p></li>\n<li><p><strong>Shared across your account:</strong> prestige belongs to your account, not one character. XP earned by any of your level 50 characters adds to the same pool, and every character that reaches 50 gets your full prestige straight away. Characters below 50 can't use it.</p></li>\n<li><p><strong>Cost:</strong> prestige is meant to be a long grind, so each point costs a little more than the last. Point <em>n</em> costs 23,000 + 40 × <em>n</em> XP. The first point costs about 23,000 XP and the 1500th about 83,000, for roughly 80 million XP in all.</p></li>\n<li><p><strong>Sources:</strong> all XP counts: enemies, quests, dungeons, trials, the Ashpit and exploration.</p></li>\n<li><p><strong>Cap:</strong> 1500 points at launch. It may rise with later updates.</p></li>\n</ul>\n<h2 id=\"s-the-three-paths\">The three Paths</h2><p>Points can go into any Path, in any mix. Each Path has passive <strong>Marks</strong> you raise one point at a time, and <strong>Oath slots</strong> that unlock as you spend points in that Path. Filling every Mark in all three Paths takes 1,080 points. The rest of the 1500 is room for Marks added in later updates.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Path</th>\n<th>Colour</th>\n<th>Covers</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Path of War</td>\n<td>Red</td>\n<td>Damage, poise breaking, Ultimate</td>\n</tr>\n<tr class=\"even\">\n<td>Path of Endurance</td>\n<td>Blue</td>\n<td>Health, resources, blocking, survival</td>\n</tr>\n<tr class=\"odd\">\n<td>Path of the Wanderer</td>\n<td>Green</td>\n<td>Exploration, loot, gathering, crafting</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"path-of-war\">Path of War</h3>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Mark</th>\n<th>Max points</th>\n<th>At max</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Honed Steel</td>\n<td>50</td>\n<td>+5% weapon damage</td>\n</tr>\n<tr class=\"even\">\n<td>Focused Mind</td>\n<td>50</td>\n<td>+5% Spell Damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Breaker</td>\n<td>50</td>\n<td>+10% poise damage</td>\n</tr>\n<tr class=\"even\">\n<td>From the Shadows</td>\n<td>40</td>\n<td>+8% damage on backstabs and ripostes</td>\n</tr>\n<tr class=\"odd\">\n<td>Heavy Hand</td>\n<td>40</td>\n<td>+8% damage with heavy attacks</td>\n</tr>\n<tr class=\"even\">\n<td>Battle-Hunger</td>\n<td>50</td>\n<td>+8% Ultimate gained</td>\n</tr>\n<tr class=\"odd\">\n<td>Giant-Slayer</td>\n<td>50</td>\n<td>+6% damage to bosses</td>\n</tr>\n<tr class=\"even\">\n<td>Afflicter</td>\n<td>40</td>\n<td>+8% damage from Bleed, Burn and Poison</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Oath</th>\n<th>Unlocks at</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Oath of the Headsman</td>\n<td>25 points in War</td>\n<td>+15% damage to foes under 25% Health</td>\n</tr>\n<tr class=\"even\">\n<td>Oath of the Duellist</td>\n<td>75 points in War</td>\n<td>Your parry window is 20% longer</td>\n</tr>\n<tr class=\"odd\">\n<td>Oath of the Warhorn</td>\n<td>150 points in War</td>\n<td>Killing a foe grants 5 Ultimate</td>\n</tr>\n<tr class=\"even\">\n<td>Oath of Open Wounds</td>\n<td>250 points in War</td>\n<td>Your Bleeds can stack twice on the same foe</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"path-of-endurance\">Path of Endurance</h3>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Mark</th>\n<th>Max points</th>\n<th>At max</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Deep Reserves</td>\n<td>50</td>\n<td>+6% max Health</td>\n</tr>\n<tr class=\"even\">\n<td>Second Lung</td>\n<td>50</td>\n<td>+6% max Stamina</td>\n</tr>\n<tr class=\"odd\">\n<td>Wellspring of Will</td>\n<td>50</td>\n<td>+6% max Mana</td>\n</tr>\n<tr class=\"even\">\n<td>Quick Recovery</td>\n<td>50</td>\n<td>+10% Stamina and Mana regeneration</td>\n</tr>\n<tr class=\"odd\">\n<td>Braced Guard</td>\n<td>40</td>\n<td>Blocking costs 10% less</td>\n</tr>\n<tr class=\"even\">\n<td>Light Feet</td>\n<td>40</td>\n<td>Dodging costs 10% less</td>\n</tr>\n<tr class=\"odd\">\n<td>Rooted</td>\n<td>40</td>\n<td>+15 Poise</td>\n</tr>\n<tr class=\"even\">\n<td>Mended Flesh</td>\n<td>40</td>\n<td>+8% healing received</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Oath</th>\n<th>Unlocks at</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Oath of the Flask</td>\n<td>25 points in Endurance</td>\n<td>+1 Flask charge</td>\n</tr>\n<tr class=\"even\">\n<td>Oath of the Last Stand</td>\n<td>75 points in Endurance</td>\n<td>Below 30% Health, take 15% less damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Oath of the Unbowed</td>\n<td>150 points in Endurance</td>\n<td>Once per 30 s, a hit that would stagger you doesn't</td>\n</tr>\n<tr class=\"even\">\n<td>Oath of the Tireless</td>\n<td>250 points in Endurance</td>\n<td>Sprinting costs no Stamina out of combat, and 50% less in combat</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"path-of-the-wanderer\">Path of the Wanderer</h3>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Mark</th>\n<th>Max points</th>\n<th>At max</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Gatherer</td>\n<td>50</td>\n<td>20% chance of double materials from gathering</td>\n</tr>\n<tr class=\"even\">\n<td>Coin-Finder</td>\n<td>50</td>\n<td>+15% gold from enemies and chests</td>\n</tr>\n<tr class=\"odd\">\n<td>Haggler</td>\n<td>40</td>\n<td>Merchants charge 10% less and pay 10% more</td>\n</tr>\n<tr class=\"even\">\n<td>Quiet Step</td>\n<td>40</td>\n<td>+15% sneaking speed</td>\n</tr>\n<tr class=\"odd\">\n<td>Steady Fall</td>\n<td>30</td>\n<td>Take 30% less fall damage</td>\n</tr>\n<tr class=\"even\">\n<td>Swift Research</td>\n<td>50</td>\n<td>Crafting trait research is 20% faster</td>\n</tr>\n<tr class=\"odd\">\n<td>Pathfinder</td>\n<td>40</td>\n<td>+10% movement speed out of combat</td>\n</tr>\n<tr class=\"even\">\n<td>Keen Eye</td>\n<td>40</td>\n<td>Lootable containers and resources glow from 10 studs further away</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Oath</th>\n<th>Unlocks at</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Oath of the Treasure-Seeker</td>\n<td>25 points in Wanderer</td>\n<td>Nearby chests show on your compass</td>\n</tr>\n<tr class=\"even\">\n<td>Oath of the Fletcher</td>\n<td>75 points in Wanderer</td>\n<td>Crafting arrows makes 50% more</td>\n</tr>\n<tr class=\"odd\">\n<td>Oath of the Master Smith</td>\n<td>150 points in Wanderer</td>\n<td>10% chance not to use up improvement materials</td>\n</tr>\n<tr class=\"even\">\n<td>Oath of the Pack-Bearer</td>\n<td>250 points in Wanderer</td>\n<td>+30 inventory slots</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-oaths\">Oaths</h2><p>Each Path has four Oaths, but you can only keep <strong>two Oaths per Path</strong> active at once (six in total). Oaths are swapped at any Wayshrine, or anywhere out of combat, so you can set up for a boss, a dungeon run or a farming trip.</p>\n<h2 id=\"s-gear-and-prestige\">Gear and prestige</h2><p>Gear keeps scaling past level 50 with your prestige, up to <strong>prestige 200</strong>. Gear you find or craft matches your prestige, and gear at a higher prestige has stronger base stats (armour, weapon damage). Set bonuses are the same at every prestige. From prestige 200 on, gear stops scaling, so your best gear never goes out of date, and the rest of prestige is purely about Marks and Oaths.</p>\n<h2 id=\"s-resetting-points\">Resetting points</h2><p>You can take all your prestige points back and spend them again at any Wayshrine for a gold fee that grows with your prestige. The first reset is free.</p>\n<h2 id=\"s-prestige-milestones\">Prestige milestones</h2><p>Prestige milestones unlock titles (see <a class=\"link\" href=\"#/titles\">the titles system</a>):</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Prestige</th>\n<th>Title</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>100</td>\n<td>Unbound</td>\n</tr>\n<tr class=\"even\">\n<td>500</td>\n<td>Ashwalker</td>\n</tr>\n<tr class=\"odd\">\n<td>1000</td>\n<td>Realm-Forged</td>\n</tr>\n<tr class=\"even\">\n<td>1500</td>\n<td>Severed from Fate</td>\n</tr>\n</tbody>\n</table></div>\n<details class=\"devnotes\" id=\"s-design-decisions\"><summary>Design notes</summary><ul>\n<li><p><strong>Account or character:</strong> prestige is shared across the account, but only level 50 characters can use it.</p></li>\n<li><p><strong>Gear:</strong> gear scales with prestige up to 200, then stops.</p></li>\n<li><p><strong>Reset fee:</strong> a gold fee, with the first reset free.</p></li>\n<li><p><strong>Point cost:</strong> each point costs slightly more than the last, so reaching 1500 is a long grind.</p></li>\n</ul>\n</details>"}, "titles": {"id": "titles", "title": "Titles & achievements", "group": "characters", "children": [], "lede": "<p>Achievements track what you've done; many award a <strong>title</strong> shown under your name on your nameplate. Pick your title from the Titles menu. Titles are shared across your account.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Achievement</th>\n<th>Title</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>First Blood</td>\n<td>(none)</td>\n</tr>\n<tr class=\"even\">\n<td>Slayer</td>\n<td>Slayer</td>\n</tr>\n<tr class=\"odd\">\n<td>The Reaping</td>\n<td>the Reaper</td>\n</tr>\n<tr class=\"even\">\n<td>Steel Answers Steel</td>\n<td>Duelist</td>\n</tr>\n<tr class=\"odd\">\n<td>Unflinching</td>\n<td>the Unflinching</td>\n</tr>\n<tr class=\"even\">\n<td>Executioner</td>\n<td>Executioner</td>\n</tr>\n<tr class=\"odd\">\n<td>Unseen Knife</td>\n<td>Unseen Knife</td>\n</tr>\n<tr class=\"even\">\n<td>Iron Answer</td>\n<td>Iron Answer</td>\n</tr>\n<tr class=\"odd\">\n<td>Guardbreaker</td>\n<td>Guardbreaker</td>\n</tr>\n<tr class=\"even\">\n<td>Death from Above</td>\n<td>Death from Above</td>\n</tr>\n<tr class=\"odd\">\n<td>Crimson Drinker</td>\n<td>Crimson Drinker</td>\n</tr>\n<tr class=\"even\">\n<td>Seasoned</td>\n<td>the Seasoned</td>\n</tr>\n<tr class=\"odd\">\n<td>Veteran</td>\n<td>Veteran</td>\n</tr>\n<tr class=\"even\">\n<td>Ascendant</td>\n<td>the Ascendant</td>\n</tr>\n<tr class=\"odd\">\n<td>Try, Try Again</td>\n<td>Undying Fool</td>\n</tr>\n<tr class=\"even\">\n<td>Gaolbreaker (defeat the Chained Warden)</td>\n<td>Gaolbreaker</td>\n</tr>\n</tbody>\n</table></div>\n", "html": "<h2 id=\"s-prestige-titles\">Prestige titles</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Prestige</th>\n<th>Title</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>100</td>\n<td>Unbound</td>\n</tr>\n<tr class=\"even\">\n<td>500</td>\n<td>Ashwalker</td>\n</tr>\n<tr class=\"odd\">\n<td>1000</td>\n<td>Realm-Forged</td>\n</tr>\n<tr class=\"even\">\n<td>1500</td>\n<td>Severed from Fate</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-rarity\">Rarity</h2><p>Titles have a rarity (Common to Legendary) that colours them on your nameplate. Some titles are unique to one person, such as \"The Architect\" for the game's creator.</p>\n"}, "combat": {"id": "combat", "title": "Combat basics", "group": "combat", "children": [], "lede": "<p>Severance plays like a slower, deliberate action game: every swing commits you, and reading your foe matters more than mashing.</p>\n", "html": "<h2 id=\"s-resources\">Resources</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Resource</th>\n<th>Start</th>\n<th>Used for</th>\n<th>Refills</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Health</td>\n<td>1,000 (+120 per attribute point)</td>\n<td>Staying alive; some Blood skills</td>\n<td>Healing, Flask, regeneration</td>\n</tr>\n<tr class=\"even\">\n<td>Stamina</td>\n<td>1,000 (+100 per point)</td>\n<td>Dodging, blocking, heavy attacks, physical skills</td>\n<td>400 per second, 0.75 s after you stop spending</td>\n</tr>\n<tr class=\"odd\">\n<td>Mana</td>\n<td>1,000 (+100 per point)</td>\n<td>Spells and magical skills</td>\n<td>50 per second, 1.5 s after you stop spending</td>\n</tr>\n</tbody>\n</table></div>\n<p>Each level gives 1 attribute point to put into Health, Stamina or Mana (C opens the character sheet).</p>\n<h2 id=\"s-attacks\">Attacks</h2><ul>\n<li><p><strong>Light attack (tap):</strong> free, a string of 3-5 quick strikes depending on the weapon.</p></li>\n<li><p><strong>Heavy attack (hold):</strong> costs Stamina, slower and armoured, deals big poise damage.</p></li>\n<li><p><strong>Jump attack:</strong> attack in the air for a downward strike.</p></li>\n<li><p><strong>Skills:</strong> 1-5 cast the skills on your bar, R casts your ultimate, Z swaps bars.</p></li>\n</ul>\n<h2 id=\"s-defence\">Defence</h2><ul>\n<li><p><strong>Block:</strong> hold to raise your guard; blocked hits cost Stamina instead of Health. Your Stamina refills slower while blocking.</p></li>\n<li><p><strong>Parry:</strong> raise your guard just before a hit lands to deflect it and stagger the attacker.</p></li>\n<li><p><strong>Guard counter:</strong> attack right after blocking a hit for a strong counter-strike.</p></li>\n<li><p><strong>Bash:</strong> attack while blocking to shove the foe and damage their poise.</p></li>\n<li><p><strong>Dodge:</strong> roll out of the way; costs Stamina and you can't be hit during the roll.</p></li>\n</ul>\n<h2 id=\"s-poise-and-staggers\">Poise and staggers</h2><p>Every character has poise. Hits wear it down, and when it breaks, the target staggers and is open to a <strong>riposte</strong>. Heavy attacks and some weapons (Greatsword, Halberd) break poise fastest. Breaking a blocking foe's guard leaves them open too.</p>\n<h2 id=\"s-backstabs\">Backstabs</h2><p>Attacking a foe from behind while they're unaware or staggered triggers a <strong>backstab</strong>: a heavy hit with its own animation. Daggers and Shadowblades are built around them.</p>\n<h2 id=\"s-the-flask\">The Flask</h2><p>Press X to drink from your Flask and heal. It has limited sips, which refill at shrines. Alchemists can add tinctures to it (see <a class=\"link\" href=\"#/crafting\">Crafting</a>).</p>\n<h2 id=\"s-ultimate\">Ultimate</h2><p>Ultimate charges from 0 to 100 as you deal and take damage. Each ultimate costs 75-100.</p>\n<h2 id=\"s-sheathing\">Sheathing</h2><p>G sheathes or draws your weapon. Attacking while sheathed draws it instantly.</p>\n<h2 id=\"s-controls\">Controls</h2><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Key</th>\n<th>Action</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Click / tap</td>\n<td>Light attack</td>\n</tr>\n<tr class=\"even\">\n<td>Hold click</td>\n<td>Heavy attack</td>\n</tr>\n<tr class=\"odd\">\n<td>Right click (hold)</td>\n<td>Block / parry</td>\n</tr>\n<tr class=\"even\">\n<td>Space</td>\n<td>Jump</td>\n</tr>\n<tr class=\"odd\">\n<td>Dodge key</td>\n<td>Dodge roll</td>\n</tr>\n<tr class=\"even\">\n<td>1-5, R</td>\n<td>Skills, ultimate</td>\n</tr>\n<tr class=\"odd\">\n<td>Z</td>\n<td>Swap bars</td>\n</tr>\n<tr class=\"even\">\n<td>X</td>\n<td>Flask</td>\n</tr>\n<tr class=\"odd\">\n<td>G</td>\n<td>Sheathe / draw</td>\n</tr>\n<tr class=\"even\">\n<td>J</td>\n<td>Skills menu</td>\n</tr>\n<tr class=\"odd\">\n<td>C</td>\n<td>Character sheet</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons": {"id": "weapons", "title": "Weapons", "group": "combat", "children": ["weapons/katana", "weapons/longsword", "weapons/sword-and-shield", "weapons/daggers", "weapons/destruction-staff", "weapons/restoration-staff", "weapons/scythe", "weapons/greatsword", "weapons/bow", "weapons/halberd", "weapons/twinblade"], "lede": "<p>Severance launches with 11 weapon types. The Katana and Longsword are already in the game, and the other nine are being built for launch. More weapons may follow in later updates. Each weapon has its own moveset and its own skill line, so the weapon you carry on each bar shapes your build as much as your class does.</p>\n", "html": "<h2 id=\"s-overview\">Overview</h2><p>Any class can use any weapon; the classes listed are where each weapon fits most naturally, not a restriction.</p>\n<div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Weapon</th>\n<th>Hands</th>\n<th>Plays like</th>\n<th>Resource</th>\n<th>Fits</th>\n<th>Skill line</th>\n<th>Status</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/weapons/katana\">Katana</a></td>\n<td>One-handed</td>\n<td>Fast cuts, parries and ripostes</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a></td>\n<td>Way of the Katana</td>\n<td>In game</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/weapons/longsword\">Longsword</a></td>\n<td>One-handed</td>\n<td>Steady all-rounder built around guard counters</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a></td>\n<td>Knightly Arts</td>\n<td>In game</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/weapons/sword-and-shield\">Sword and Shield</a></td>\n<td>One-handed + shield</td>\n<td>Cheap blocking, strong bashes, holds poise</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a></td>\n<td>Bastion</td>\n<td>Launch</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/weapons/daggers\">Daggers</a></td>\n<td>Dual-wielded</td>\n<td>Very fast strings, Bleeds, backstabs</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a></td>\n<td>Twin Fangs</td>\n<td>Launch</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/weapons/destruction-staff\">Destruction Staff</a></td>\n<td>Two-handed</td>\n<td>Ranged Fire, Frost or Shock bolts</td>\n<td>Mana</td>\n<td><a class=\"link\" href=\"#/classes/wizard\">Wizard</a>, <a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a></td>\n<td>Ruinous Arts</td>\n<td>Launch</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/weapons/restoration-staff\">Restoration Staff</a></td>\n<td>Two-handed</td>\n<td>Ranged heals and wards</td>\n<td>Mana</td>\n<td><a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a>, <a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a></td>\n<td>Mending Arts</td>\n<td>Launch</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/weapons/scythe\">Scythe</a></td>\n<td>Two-handed</td>\n<td>Wide reaping sweeps that drain life</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a>, <a class=\"link\" href=\"#/classes/blood-maiden\">Blood Maiden</a></td>\n<td>Reaping</td>\n<td>Launch</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/weapons/greatsword\">Greatsword</a></td>\n<td>Two-handed</td>\n<td>Slow, armoured swings that break poise</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/berserker\">Berserker</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a></td>\n<td>Colossus</td>\n<td>Launch</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/weapons/bow\">Bow</a></td>\n<td>Two-handed</td>\n<td>Ranged physical damage and status arrows</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a></td>\n<td>Fletcher's Eye</td>\n<td>Launch</td>\n</tr>\n<tr class=\"even\">\n<td><a class=\"link\" href=\"#/weapons/halberd\">Halberd</a></td>\n<td>Two-handed</td>\n<td>Long reach: thrusts and sweeps that keep foes at bay</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a></td>\n<td>Long Reach</td>\n<td>Launch</td>\n</tr>\n<tr class=\"odd\">\n<td><a class=\"link\" href=\"#/weapons/twinblade\">Twinblade</a></td>\n<td>Two-handed</td>\n<td>Spinning combos that hit everything nearby</td>\n<td>Stamina</td>\n<td><a class=\"link\" href=\"#/classes/berserker\">Berserker</a>, <a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a></td>\n<td>Whirling Steel</td>\n<td>Launch</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"s-how-weapons-work\">How weapons work</h2><p>You carry two weapon loadouts, one per skill bar, and Z swaps between them mid-fight. A loadout is a one-hander (Katana, Longsword), a one-hander with a shield, a pair of daggers, or a two-hander (everything else).</p>\n<ul>\n<li><p><strong>Light attack (tap):</strong> a string of 3-5 quick strikes, free to use. Staves and bows fire bolts or arrows instead.</p></li>\n<li><p><strong>Heavy attack (hold):</strong> a slower, armoured blow that costs Stamina and does heavy poise damage. Staves channel instead; bows draw a charged shot.</p></li>\n<li><p><strong>Block and parry:</strong> melee weapons block, and raising the guard just before a hit parries it. Staves raise a ward that costs Mana instead of Stamina. Bows can't block, so you dodge.</p></li>\n<li><p><strong>Sheathing:</strong> G puts the weapon away. Attacking while sheathed draws it instantly.</p></li>\n<li><p><strong>Skill line:</strong> every weapon has its own line of 4 active skills, an ultimate and 2 passives. The line levels up as you fight with that weapon, and its skills only slot on a bar holding it.</p></li>\n<li><p><strong>Item sets:</strong> weapons count toward set bonuses only while their bar is in hand (see <a class=\"link\" href=\"#/item-sets\">Item Sets</a>).</p></li>\n</ul>\n<!--CHILDREN--><details class=\"devnotes\" id=\"s-design-decisions\"><summary>Design notes</summary><ul>\n<li><p><strong>Dual-wielding:</strong> only daggers can be dual-wielded at launch. Other pairings may come later.</p></li>\n<li><p><strong>Staff elements:</strong> a dropped Destruction Staff comes with its element already set (Emberwood, Rimewood or Stormwood). When you craft one, you pick the element.</p></li>\n<li><p><strong>Arrows:</strong> arrows run out. You can craft them, and they're common in chests, enemy drops and other loot.</p></li>\n<li><p><strong>Launch scope:</strong> all 11 weapons on this page ship at launch, and more may be added later. Each one still needs a moveset, an idle and a skill line.</p></li>\n<li><p><strong>Original names:</strong> every skill and skill line name here is original to Severance. Keep new ones that way: mechanics can be familiar, but names and wording should be our own.</p></li>\n</ul>\n</details>"}, "weapons/katana": {"id": "weapons/katana", "title": "Katana", "sub": "Fast cuts, parries and ripostes", "group": "combat", "parent": "weapons", "info": [["Hands", "One-handed"], ["Resource", "Stamina"], ["Skill line", "Way of the Katana"], ["Fits", "<a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/berserker\">Berserker</a>"], ["Status", "In game"], ["Arena set", "<a class=\"link\" href=\"#/set/crowds-favour\">Crowd&#x27;s Favour</a>"]], "card": "Fast cuts, parries and ripostes", "badge": "In game", "html": "<p>The katana is fast and precise, built for parrying and punishing. Its light string is four cuts: diagonal, rising, flat, then a lunging thrust. Its heavy is an armoured overhead that breaks poise.</p>\n<h3 class=\"line\" id=\"s-way-of-the-katana\">Way of the Katana</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Iaijutsu</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Dash 10 studs and cut through everything in the path (240 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Crescent Moon</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>Two wide arcs (120 damage each); the second makes them Bleed</td>\n</tr>\n<tr class=\"odd\">\n<td>Wind Cutter</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>A cut so fast it flies: a piercing projectile (140 damage, 30 studs)</td>\n</tr>\n<tr class=\"even\">\n<td>Still Water</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>For 4 s, take 50% less damage and can't be staggered</td>\n</tr>\n<tr class=\"odd\">\n<td>Thousand Petals</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">90 <small>Ultimate</small></span></td>\n<td>Five rapid cuts (140 damage each) that leave a heavy Bleed</td>\n</tr>\n<tr class=\"even\">\n<td>Keen Edge</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+6% damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Flowing Water</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>Stamina costs 6% lower</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/longsword": {"id": "weapons/longsword", "title": "Longsword", "sub": "Steady all-rounder built around guard counters", "group": "combat", "parent": "weapons", "info": [["Hands", "One-handed"], ["Resource", "Stamina"], ["Skill line", "Knightly Arts"], ["Fits", "<a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a>"], ["Status", "In game"], ["Arena set", "<a class=\"link\" href=\"#/set/pitmasters-edge\">Pitmaster&#x27;s Edge</a>"]], "card": "Steady all-rounder built around guard counters", "badge": "In game", "html": "<p>The longsword is the steady all-rounder of the old knightly orders. It hits a little harder and a little slower than the katana. Its light string is three cuts, the last a heavier finisher, and its heavy is a big armoured swing.</p>\n<h3 class=\"line\" id=\"s-knightly-arts\">Knightly Arts</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Sweeping Cut</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>A broad, heavy sweep (180 damage)</td>\n</tr>\n<tr class=\"even\">\n<td>Pommel Strike</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">200 <small>Stamina</small></span></td>\n<td>A short bash that stuns</td>\n</tr>\n<tr class=\"odd\">\n<td>Rising Edge</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>An upward cut (160 damage) that leaves them Vulnerable for 5 s</td>\n</tr>\n<tr class=\"even\">\n<td>Valiant Guard</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>A 6 s shield worth 20% of your max Health</td>\n</tr>\n<tr class=\"odd\">\n<td>Champion's Verdict</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>Leap up to 18 studs and slam down (700 damage around you)</td>\n</tr>\n<tr class=\"even\">\n<td>Knight's Drill</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>+6% damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Guardsman</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>Blocking costs 10% less</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/sword-and-shield": {"id": "weapons/sword-and-shield", "title": "Sword and Shield", "sub": "Cheap blocking, strong bashes, holds poise", "group": "combat", "parent": "weapons", "info": [["Hands", "One-handed + shield"], ["Resource", "Stamina"], ["Skill line", "Bastion"], ["Fits", "<a class=\"link\" href=\"#/classes/holy-knight\">Holy Knight</a>, <a class=\"link\" href=\"#/classes/dark-knight\">Dark Knight</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/pit-wardens-bulwark\">Pit-Warden&#x27;s Bulwark</a>"]], "card": "Cheap blocking, strong bashes, holds poise", "badge": "Launch", "html": "<p>Sword and Shield is the tank's weapon: a one-handed sword with a shield on the off-hand. Light attacks are a three-cut string, and the heavy leads with the shield to shove, then cuts.</p>\n<ul>\n<li><p><strong>Shield block:</strong> blocking costs 40% less Stamina and covers a wider arc (110° either side instead of 80°).</p></li>\n<li><p><strong>Shield bash:</strong> the bash (attack while blocking) does double poise damage, so guards break faster.</p></li>\n</ul>\n<h3 class=\"line\" id=\"s-bastion\">Bastion</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Shieldrush</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Charge 12 studs behind your shield; the first foe hit has its guard broken</td>\n</tr>\n<tr class=\"even\">\n<td>Bastion Stance</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>For 8 s, blocking costs 50% less and blocked projectiles fly back at their source</td>\n</tr>\n<tr class=\"odd\">\n<td>Iron Rebuke</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>A shield strike that Weakens the target (30% less damage) for 6 s</td>\n</tr>\n<tr class=\"even\">\n<td>Steel Breath</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">300 <small>Stamina</small></span></td>\n<td>Heal 15% of max Health over 6 s; twice as fast while your guard is up</td>\n</tr>\n<tr class=\"odd\">\n<td>Aegis of the Last Wall</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>Plant your shield: for 8 s you, and allies behind you, take 40% less damage</td>\n</tr>\n<tr class=\"even\">\n<td>Shield-Sworn</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>Blocking costs 15% less</td>\n</tr>\n<tr class=\"odd\">\n<td>Unshaken</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>+15 Poise</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/daggers": {"id": "weapons/daggers", "title": "Daggers", "sub": "Very fast strings, Bleeds, backstabs", "group": "combat", "parent": "weapons", "info": [["Hands", "Dual-wielded"], ["Resource", "Stamina"], ["Skill line", "Twin Fangs"], ["Fits", "<a class=\"link\" href=\"#/classes/shadowblade\">Shadowblade</a>, <a class=\"link\" href=\"#/classes/alchemist\">Alchemist</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/gutterfang\">Gutterfang</a>"]], "card": "Very fast strings, Bleeds, backstabs", "badge": "Launch", "html": "<p>Daggers are dual-wielded and the fastest weapon in the game: a five-hit light string, and a heavy double-stab that opens a Bleed. They block poorly, so the dagger fighter's defence is the dodge.</p>\n<ul>\n<li><p><strong>Weak guard:</strong> blocking costs 25% more Stamina.</p></li>\n<li><p><strong>Killing blows from behind:</strong> backstabs with daggers deal 30% more damage.</p></li>\n</ul>\n<h3 class=\"line\" id=\"s-twin-fangs\">Twin Fangs</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Viper's Flurry</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>Six rapid stabs (60 damage each)</td>\n</tr>\n<tr class=\"even\">\n<td>Tendon Cut</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>3</td>\n<td><span class=\"cost c-stamina\">220 <small>Stamina</small></span></td>\n<td>A low cut that Slows by 40% for 4 s and Bleeds</td>\n</tr>\n<tr class=\"odd\">\n<td>Ghoststep</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>6</td>\n<td><span class=\"cost c-stamina\">280 <small>Stamina</small></span></td>\n<td>Blink behind your target, ready to backstab</td>\n</tr>\n<tr class=\"even\">\n<td>Blade Venom</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>9</td>\n<td><span class=\"cost c-stamina\">250 <small>Stamina</small></span></td>\n<td>For 10 s your light attacks Poison</td>\n</tr>\n<tr class=\"odd\">\n<td>Crimson Execution</td>\n<td><span class=\"tchip t-ultimate\">Ultimate</span></td>\n<td>10</td>\n<td><span class=\"cost c-ultimate\">85 <small>Ultimate</small></span></td>\n<td>Eight strikes in 2 s, each refreshing Bleed; double damage to foes under 20% Health</td>\n</tr>\n<tr class=\"even\">\n<td>Paired Edges</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>2</td>\n<td>-</td>\n<td>Light attacks deal 10% more damage</td>\n</tr>\n<tr class=\"odd\">\n<td>Opportunist</td>\n<td><span class=\"tchip t-passive\">Passive</span></td>\n<td>5</td>\n<td>-</td>\n<td>Backstabs and ripostes deal 15% more damage</td>\n</tr>\n</tbody>\n</table></div>\n"}, "weapons/destruction-staff": {"id": "weapons/destruction-staff", "title": "Destruction Staff", "sub": "Ranged Fire, Frost or Shock bolts", "group": "combat", "parent": "weapons", "info": [["Hands", "Two-handed"], ["Resource", "Mana"], ["Skill line", "Ruinous Arts"], ["Fits", "<a class=\"link\" href=\"#/classes/wizard\">Wizard</a>, <a class=\"link\" href=\"#/classes/necromancer\">Necromancer</a>"], ["Status", "Launch"], ["Arena set", "<a class=\"link\" href=\"#/set/emberwake-staff\">Emberwake Staff</a>"]], "card": "Ranged Fire, Frost or Shock bolts", "badge": "Launch", "html": "<p>The Destruction Staff is the ranged damage weapon. Light attacks fire elemental bolts up to 40 studs; the heavy is a channelled beam that costs Mana while held. It comes in three elements, and its skills take on the staff's element.</p>\n<ul>\n<li><p><strong>Emberwood (Fire):</strong> bolts can Burn; best for raw damage.</p></li>\n<li><p><strong>Rimewood (Frost):</strong> bolts Slow, and its ward absorbs 30% more; the tank's staff.</p></li>\n<li><p><strong>Stormwood (Shock):</strong> bolts arc to a second foe; the heavy beam hits everything in a line.</p></li>\n<li><p><strong>Ward:</strong> instead of blocking, the staff raises a magic ward that drains Mana.</p></li>\n</ul>\n<h3 class=\"line\" id=\"s-ruinous-arts\">Ruinous Arts</h3><div class=\"tbl-wrap\"><table class=\"doc\">\n<thead>\n<tr class=\"header\">\n<th>Skill</th>\n<th>Type</th>\n<th>Level</th>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ruin Bolt</td>\n<td><span class=\"tchip t-active\">Active</span></td>\n<td>1</td>\n<td><span class=\"cost c-mana\">250 <small>Mana</small></span></td>\n<td>A heavier bolt of the
